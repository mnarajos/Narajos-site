<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title description">
  <title id="title">Septal openings in hearts P and Q</title>
  <desc id="description">P has a gap in the wall separating the two upper chambers. Q has a gap in the wall separating the two lower chambers.</desc>
  <defs>
    <g id="chambers" stroke="#782f45" stroke-width="4" stroke-linejoin="round">
      <path fill="#fae5eb" d="M129 265C81 253 48 211 45 162c-1-16 2-31 11-44C28 100 34 55 53 42c26-19 53-17 76 3 23-20 50-22 76-3 19 13 25 58-3 76 9 13 12 28 11 44-3 49-36 91-84 103Z"/>
      <g stroke-width="2">
        <path fill="#dcecf5" d="M123 50c-21-15-40-18-60-3-17 12-18 45-4 57h64Z"/>
        <path fill="#e7edf6" d="M123 121H61c-10 19-8 43 1 67 11 29 31 48 61 60Z"/>
        <path fill="#f6d8df" d="M135 50c21-15 40-18 60-3 17 12 18 45 4 57h-64Z"/>
        <path fill="#fae3e2" d="M135 121h62c10 19 8 43-1 67-11 29-31 48-61 60Z"/>
      </g>
      <path fill="none" stroke-width="4" stroke-linecap="round" d="M56 112h23m24 0h52m24 0h23"/>
    </g>
  </defs>
  <rect width="600" height="360" rx="16" fill="#f7fbfa"/>
  <path d="M300 48v257" stroke="#d5e5e1" stroke-width="2"/>
  <g font-family="system-ui,sans-serif" font-weight="700" font-size="32" text-anchor="middle" fill="#263e4b">
    <text x="157" y="47">P</text>
    <text x="443" y="47">Q</text>
  </g>
  <g transform="translate(28 47)">
    <use href="#chambers"/>
    <path d="M113 66h32v23h-32z" fill="#fff"/>
    <path d="M129 47v19m0 23v167" fill="none" stroke="#782f45" stroke-width="9" stroke-linecap="round"/>
    <circle cx="129" cy="78" r="23" fill="none" stroke="#176e60" stroke-width="3" stroke-dasharray="4 4"/>
  </g>
  <g transform="translate(314 47)">
    <use href="#chambers"/>
    <path d="M113 169h32v23h-32z" fill="#fff"/>
    <path d="M129 47v122m0 23v64" fill="none" stroke="#782f45" stroke-width="9" stroke-linecap="round"/>
    <circle cx="129" cy="181" r="23" fill="none" stroke="#176e60" stroke-width="3" stroke-dasharray="4 4"/>
  </g>
  <text x="300" y="340" font-family="system-ui,sans-serif" font-size="25" text-anchor="middle" fill="#263e4b">Dashed circle marks the gap</text>
</svg>
