<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title description">
  <title id="title">Connections to a transplanted kidney</title>
  <desc id="description">In a simplified front view of the lower abdomen, blood enters the donor kidney through its renal artery and leaves through its renal vein. Urine flows through the donor ureter to the bladder.</desc>
  <defs>
    <marker id="arterial-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a73c50"/></marker>
    <marker id="venous-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#325f9b"/></marker>
    <marker id="urine-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#936316"/></marker>
  </defs>
  <rect width="600" height="360" rx="15" fill="#fafcfb"/>
  <path d="M165 44C165 85 155 110 130 152C104 197 103 239 117 284L131 331H470L484 284C498 239 497 197 471 152C446 110 436 85 436 44" fill="#f3f7f7" stroke="#bdcdce" stroke-width="2"/>
  <text x="300" y="37" font-family="system-ui,sans-serif" font-size="17" text-anchor="middle" fill="#455969">Lower abdomen</text>

  <path d="M186 124C153 122 131 150 135 187C140 223 165 251 201 246C229 242 240 224 227 210C219 201 210 195 212 185C214 177 224 176 232 170C245 160 239 142 224 133C213 126 200 123 186 124Z" fill="#efb4bf" stroke="#9a4759" stroke-width="4"/>
  <path d="M260 274C280 262 321 262 343 274C357 285 354 306 341 315C332 321 318 322 312 327L311 339H292L291 327C285 322 271 320 260 313C247 304 247 285 260 274Z" fill="#dbe8ef" stroke="#557787" stroke-width="4"/>

  <path d="M460 118C426 118 397 146 354 151L232 151" fill="none" stroke="#a73c50" stroke-width="7" stroke-linecap="round" marker-end="url(#arterial-arrow)"/>
  <path d="M218 179H350C395 179 415 161 459 162" fill="none" stroke="#325f9b" stroke-width="7" stroke-dasharray="13 8" stroke-linecap="round" marker-end="url(#venous-arrow)"/>
  <path d="M223 205C255 208 262 223 264 239C266 253 269 267 276 275" fill="none" stroke="#936316" stroke-width="7" stroke-linecap="round" marker-end="url(#urine-arrow)"/>

  <rect x="462" y="95" width="124" height="92" rx="11" fill="#e7f1f0" stroke="#8baba9" stroke-width="2"/>
  <g font-family="system-ui,sans-serif" font-size="16" font-weight="650" fill="#263f48">
    <text x="524" y="135" text-anchor="middle"><tspan x="524">Recipient’s</tspan><tspan x="524" dy="21">circulation</tspan></text>
    <text x="43" y="103">Donor kidney</text>
    <text x="333" y="133" text-anchor="middle" fill="#852c3d">Donor renal artery</text>
    <text x="341" y="204" text-anchor="middle" fill="#2c5186">Donor renal vein</text>
    <text x="207" y="263" text-anchor="end" fill="#775018">Donor ureter</text>
    <text x="397" y="286">Bladder</text>
  </g>
  <g fill="none" stroke="#526773" stroke-width="2" stroke-linecap="round">
    <path d="M114 110L152 138"/>
    <path d="M213 258L259 245"/>
    <path d="M390 282L351 283"/>
  </g>
</svg>
