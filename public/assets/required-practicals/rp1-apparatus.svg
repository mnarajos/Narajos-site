<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 184">
  <title>Trypsin and casein temperature investigation</title>
  <desc>Equilibrate separate tubes of milk and buffered trypsin in a temperature-controlled water bath. Mix and start the stopwatch. Look through the reaction tube until the marked cross becomes visible.</desc>
