    <path d="M19 66h176M23 66l9 66h150l9-66"/>
    <path fill="#fffdf5" d="M53 48h35m-31 0v62a13.5 13.5 0 0 0 27 0V48"/>
    <path fill="#e6f1f0" d="M117 48h35m-31 0v62a13.5 13.5 0 0 0 27 0V48"/>
    <path d="M60 81h21m43 0h21"/>
    <path d="M169 57v52m0-14h8"/>
    <circle cx="169" cy="113" r="4" fill="#8f3b2f"/>
    <path d="M207 88h40m-8-8 8 8-8 8"/>
    <path fill="#dcecf0" d="M265 79h73l-5 54h-63z"/>
