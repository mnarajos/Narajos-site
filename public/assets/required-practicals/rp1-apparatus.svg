    <text x="135" y="143">Trypsin</text>
    <text x="93" y="165">Water bath · pH fixed</text>
    <text x="345" y="28" font-weight="700">Mix and start timing</text>
    <text x="345" y="161">Watch for the cross</text>
  </g>
</svg>
