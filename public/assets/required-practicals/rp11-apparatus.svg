    <path fill="#fff" d="M350 64h16v20h-16z"/>
  </g>
  <g fill="#203c4c" font-family="system-ui,sans-serif" text-anchor="middle" font-size="18">
    <text x="66" y="28" font-weight="700">Dilute stock</text>
    <text x="228" y="28" font-weight="700">Heat with reagent</text>
    <text x="383" y="28" font-weight="700">Read at 680 nm</text>
    <text x="37" y="110">0</text>
    <text x="67" y="110">6</text>
