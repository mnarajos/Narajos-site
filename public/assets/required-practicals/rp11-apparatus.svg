<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 190">
  <title>Glucose calibration with quantitative Benedict’s reagent</title>
  <desc>Prepare glucose standards and the unknown. Heat them with quantitative Benedict’s reagent under equal conditions. A pale blue tube with more glucose has more white precipitate. Measure the clear liquid above the solid at 680 nanometres.</desc>
