    <path fill="#e6f1f4" stroke="none" d="M29 83h14v36a7 7 0 0 1-14 0zm31 0h14v36a7 7 0 0 1-14 0zm31 0h14v36a7 7 0 0 1-14 0z"/>
    <path d="M118 87h33m-7-7 7 7-7 7"/>
    <path fill="#cde6f3" d="M166 80h127l-7 61H173z"/>
    <path fill="#33899f" d="M188 80h23v42a11.5 11.5 0 0 1-23 0z"/>
    <path fill="#98c7d0" d="M240 80h23v42a11.5 11.5 0 0 1-23 0z"/>
    <path d="M188 80V55h23v25m29 0V55h23v25"/>
    <path fill="#fff" d="M240 121h23v1a11.5 11.5 0 0 1-23 0z"/>
