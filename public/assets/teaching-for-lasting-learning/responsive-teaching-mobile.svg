<svg xmlns="http://www.w3.org/2000/svg" width="288" height="700" viewBox="0 0 288 700" role="img" aria-labelledby="title description">
<title id="title">Responsive teaching</title><desc id="description">A simplified illustration of how evidence can inform teaching, drawing on formative assessment research by Black and Wiliam (1998). It shows eliciting evidence, considering possible explanations, adapting instruction, and rechecking. Professional judgement is needed, and the relationships need not follow a fixed sequence.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#435763"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;} @media print{*{print-color-adjust:exact}}</style>
<rect width="288" height="700" fill="#fff"/>
<text x="20" y="38" fill="#24323e" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle" >Responsive teaching</text>
<path class="diagram-edge" d="M 144 183 V 225" fill="none" stroke="#435763" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path class="diagram-edge" d="M 144 303 V 345" fill="none" stroke="#435763" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path class="diagram-edge" d="M 144 423 V 465" fill="none" stroke="#435763" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path class="diagram-edge" d="M 48 504 H 20 V 144 H 48" fill="none" stroke="#435763" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g class="diagram-node" data-node="one">
<rect x="48" y="105" width="192" height="78" rx="12" fill="#fff2e8" stroke="#ad6536" stroke-width="1.5" />
<text x="144.0" y="144.0" fill="#24323e" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Elicit evidence</text>
</g>
<g class="diagram-node" data-node="two">
<rect x="48" y="225" width="192" height="78" rx="12" fill="#fff2e8" stroke="#ad6536" stroke-width="1.5" />
<text x="144.0" y="252.5" fill="#24323e" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Consider possible</text>
<text x="144.0" y="275.5" fill="#24323e" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">explanations</text>
</g>
<g class="diagram-node" data-node="three">
<rect x="48" y="345" width="192" height="78" rx="12" fill="#fff2e8" stroke="#ad6536" stroke-width="1.5" />
<text x="144.0" y="384.0" fill="#24323e" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Adapt instruction</text>
</g>
<g class="diagram-node" data-node="four">
<rect x="48" y="465" width="192" height="78" rx="12" fill="#fff2e8" stroke="#ad6536" stroke-width="1.5" />
<text x="144.0" y="504.0" fill="#24323e" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Recheck</text>
</g>
<text x="144" y="610" fill="#53646c" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="middle" >One way to think about a response.</text>
<text x="144.0" y="680" fill="#53646c" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="middle" >Narajos · narajos.com</text>
