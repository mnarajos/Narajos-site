<svg xmlns="http://www.w3.org/2000/svg" width="288" height="820" viewBox="0 0 288 820" role="img" aria-labelledby="title description">
<title id="title">Success and motivation</title><desc id="description">A simplified illustration of possible relationships, including Bandura’s (1977) work on self-efficacy. Meaningful success may support self-efficacy, motivation, engagement, and further learning, which may contribute to future success. These are distinct constructs; other influences matter at every point, and the links are not guaranteed.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#435763"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;} @media print{*{print-color-adjust:exact}}</style>
<rect width="288" height="820" fill="#fff"/>
<text x="20" y="38" fill="#24323e" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle" >Success and motivation</text>
<path class="diagram-edge" d="M 144 183 V 225" fill="none" stroke="#435763" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path class="diagram-edge" d="M 144 303 V 345" fill="none" stroke="#435763" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path class="diagram-edge" d="M 144 423 V 465" fill="none" stroke="#435763" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path class="diagram-edge" d="M 144 543 V 585" fill="none" stroke="#435763" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path class="diagram-edge" d="M 48 624 H 20 V 144 H 48" fill="none" stroke="#435763" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<g class="diagram-node" data-node="success">
<rect x="48" y="105" width="192" height="78" rx="12" fill="#e8f3ef" stroke="#39786c" stroke-width="1.5" />
<text x="144.0" y="130.0" fill="#24323e" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Meaningful</text>
<text x="144.0" y="158.0" fill="#24323e" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">success</text>
</g>
<g class="diagram-node" data-node="efficacy">
<rect x="48" y="225" width="192" height="78" rx="12" fill="#f2eef7" stroke="#7c6c8d" stroke-width="1.5" />
<text x="144.0" y="264.0" fill="#24323e" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Self-efficacy</text>
</g>
<g class="diagram-node" data-node="motivation">
<rect x="48" y="345" width="192" height="78" rx="12" fill="#f2eef7" stroke="#7c6c8d" stroke-width="1.5" />
<text x="144.0" y="384.0" fill="#24323e" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Motivation</text>
</g>
<g class="diagram-node" data-node="engagement">
<rect x="48" y="465" width="192" height="78" rx="12" fill="#f2eef7" stroke="#7c6c8d" stroke-width="1.5" />
<text x="144.0" y="504.0" fill="#24323e" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Engagement</text>
</g>
<g class="diagram-node" data-node="learning">
