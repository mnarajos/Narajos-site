<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" role="img" aria-labelledby="title description">
<title id="title">Success and motivation</title><desc id="description">Meaningful success may support self-efficacy, motivation, engagement, and further learning, which may contribute to future success. These are distinct constructs; other influences matter at every point, and the links are not guaranteed.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#435763"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;} @media print{*{print-color-adjust:exact}}</style>
<rect width="880" height="540" fill="#fff"/>
<text x="36" y="48" fill="#24323e" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="middle" >Success and motivation</text>
<text x="36" y="80" fill="#53646c" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="middle" >These links are possible, not guaranteed.</text>
<path class="diagram-edge" d="M 260 180 H 330" fill="none" stroke="#435763" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
