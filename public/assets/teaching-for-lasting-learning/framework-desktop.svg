<text x="40" y="102" fill="#53646c" font-size="17" font-weight="400" text-anchor="start" dominant-baseline="middle" >Accessibility, routines, relationships, expectations, and participation</text>
<text x="40" y="145" fill="#53646c" font-size="17" font-weight="600" text-anchor="start" dominant-baseline="middle" >Learner influences throughout:</text>
<text x="355" y="145" fill="#69567b" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle" >Motivation</text>
<text x="520" y="145" fill="#69567b" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle" >Self-regulation</text>
