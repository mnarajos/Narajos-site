<text x="415.0" y="790.0" fill="#24323e" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Independent competence</text>
</g>
<g class="diagram-node" data-node="performance">
<rect x="625" y="525" width="200" height="100" rx="12" fill="#edf1f6" stroke="#667b8e" stroke-width="1.5" />
<text x="725.0" y="559.0" fill="#24323e" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Observable</text>
<text x="725.0" y="591.0" fill="#24323e" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">performance</text>
</g>
<g class="diagram-node" data-node="teacher">
<rect x="615" y="740" width="210" height="150" rx="12" fill="#fff2e8" stroke="#ad6536" stroke-width="1.5" />
<text x="720.0" y="774.5" fill="#24323e" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Teacher</text>
<text x="720.0" y="801.5" fill="#24323e" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">interprets evidence</text>
<text x="720.0" y="828.5" fill="#24323e" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">and adapts</text>
<text x="720.0" y="855.5" fill="#24323e" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">instruction</text>
</g>
<text x="40" y="940" fill="#53646c" font-size="18" font-weight="600" text-anchor="start" dominant-baseline="middle" >Distinct learner factors can influence participation throughout</text>
<g class="diagram-node" data-node="motivation">
<rect x="60" y="970" width="320" height="70" rx="12" fill="#f2eef7" stroke="#7c6c8d" stroke-width="1.5" />
<text x="220.0" y="1005.0" fill="#24323e" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Motivation</text>
</g>
<g class="diagram-node" data-node="self-regulation">
<rect x="470" y="970" width="320" height="70" rx="12" fill="#f2eef7" stroke="#7c6c8d" stroke-width="1.5" />
<text x="630.0" y="1005.0" fill="#24323e" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Self-regulation</text>
</g>
<text x="440" y="1114" fill="#53646c" font-size="16" font-weight="400" text-anchor="middle" dominant-baseline="middle" >Relationships are possible, not a fixed sequence.</text>
<text x="440.0" y="1148" fill="#53646c" font-size="16" font-weight="400" text-anchor="middle" dominant-baseline="middle" >Narajos · narajos.com/teaching-for-lasting-learning/</text>
