<path class="diagram-edge" d="M 250 570 H 75 V 175 H 270" fill="none" stroke="#435763" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="96" y="430" fill="#24323e" font-size="17" font-weight="600" text-anchor="start" dominant-baseline="middle" >Becomes prior</text>
<text x="96" y="454" fill="#24323e" font-size="17" font-weight="600" text-anchor="start" dominant-baseline="middle" >knowledge for</text>
<text x="96" y="478" fill="#24323e" font-size="17" font-weight="600" text-anchor="start" dominant-baseline="middle" >later learning</text>
<text x="635" y="223" fill="#24323e" font-size="17" font-weight="600" text-anchor="start" dominant-baseline="middle" >Adapt instruction</text>
