<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1000" viewBox="0 0 880 1000" role="img" aria-labelledby="title description">
<title id="title">Bringing together ideas about learning and teaching</title><desc id="description">A simplified illustration bringing together established ideas about learning and teaching. Conditions for learning, including accessibility, enable the system as a whole. Prior knowledge, instruction, practice, task design, and support can contribute to developed knowledge. Developed knowledge can become prior knowledge for later learning and support independent competence. Developed knowledge and instructional conditions can each influence observable performance. Teachers interpret this evidence and adapt instruction; existing knowledge is not directly observable. Motivation and self-regulation are distinct learner influences throughout. These relationships are possible, not a fixed sequence or guaranteed outcomes. Related research includes Ausubel (1968), Soderstrom and Bjork (2015), Black and Wiliam (1998), Bandura (1977), and Zimmerman (2002).</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#435763"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;} @media print{*{print-color-adjust:exact}}</style>
