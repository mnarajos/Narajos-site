<rect x="270" y="135" width="300" height="80" rx="12" fill="#e8f3ef" stroke="#39786c" stroke-width="1.5" />
<text x="420.0" y="175.0" fill="#24323e" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Prior knowledge</text>
</g>
<g class="diagram-node" data-node="instruction">
<rect x="250" y="290" width="330" height="100" rx="12" fill="#fff2e8" stroke="#ad6536" stroke-width="1.5" />
<text x="415.0" y="324.0" fill="#24323e" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Instruction, practice,</text>
<text x="415.0" y="356.0" fill="#24323e" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">task design, and support</text>
</g>
<g class="diagram-node" data-node="developed">
<rect x="250" y="505" width="330" height="140" rx="12" fill="#e8f3ef" stroke="#39786c" stroke-width="1.5" />
