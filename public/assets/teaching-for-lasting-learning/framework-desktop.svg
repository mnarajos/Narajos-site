<text x="415.0" y="575.0" fill="#24323e" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">Extensive · Accurate</text>
<text x="415.0" y="606.0" fill="#24323e" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">Accessible · Organised</text>
</g>
<g class="diagram-node" data-node="competence">
