<svg xmlns="http://www.w3.org/2000/svg" width="288" height="590" viewBox="0 0 288 590" role="img" aria-labelledby="title description">
<title id="title">Challenge and instructional support</title><desc id="description">A simplified matrix distinguishing challenge and instructional support, drawing on work about scaffolding and learner expertise by Wood, Bruner, and Ross (1976), and Kalyuga et al. (2003). Higher challenge with lower support is independent stretch; higher challenge with higher support is supported stretch; lower challenge with lower support is independent consolidation; lower challenge with higher support is supported foundations. All four can be useful.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#435763"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;} @media print{*{print-color-adjust:exact}}</style>
<rect width="288" height="590" fill="#fff"/>
<text x="20" y="35" fill="#24323e" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle" >Challenge and</text>
<text x="20" y="60" fill="#24323e" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle" >instructional support</text>
<text x="75" y="100" fill="#53646c" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" >LOWER</text>
<text x="75" y="120" fill="#53646c" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" >SUPPORT</text>
<text x="213" y="100" fill="#53646c" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" >HIGHER</text>
<text x="213" y="120" fill="#53646c" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" >SUPPORT</text>
<text x="144" y="160" fill="#53646c" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" >HIGHER CHALLENGE</text>
<g class="diagram-node" data-node="independent-stretch" data-related-group="matrix">
<rect x="12" y="185" width="126" height="104" rx="12" fill="#e8f3ef" stroke="#39786c" stroke-width="1.5" />
<text x="75" y="225" fill="#24323e" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">Independent</text>
<text x="75" y="249" fill="#24323e" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">stretch</text>
</g>
<g class="diagram-node" data-node="supported-stretch" data-related-group="matrix">
<rect x="150" y="185" width="126" height="104" rx="12" fill="#fff2e8" stroke="#ad6536" stroke-width="1.5" />
<text x="213" y="225" fill="#24323e" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">Supported</text>
<text x="213" y="249" fill="#24323e" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">stretch</text>
</g>
<text x="144" y="329" fill="#53646c" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" >LOWER CHALLENGE</text>
<g class="diagram-node" data-node="independent-consolidation" data-related-group="matrix">
<rect x="12" y="350" width="126" height="104" rx="12" fill="#e8f3ef" stroke="#39786c" stroke-width="1.5" />
<text x="75" y="390" fill="#24323e" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">Independent</text>
<text x="75" y="414" fill="#24323e" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">consolidation</text>
</g>
<g class="diagram-node" data-node="supported-foundations" data-related-group="matrix">
<rect x="150" y="350" width="126" height="104" rx="12" fill="#fff2e8" stroke="#ad6536" stroke-width="1.5" />
<text x="213" y="390" fill="#24323e" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">Supported</text>
<text x="213" y="414" fill="#24323e" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">foundations</text>
</g>
<text x="144" y="500" fill="#24323e" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" >Each can be useful for</text>
<text x="144" y="523" fill="#24323e" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" >a different purpose.</text>
<text x="144.0" y="565" fill="#53646c" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="middle" >Narajos · narajos.com</text>
</svg>
