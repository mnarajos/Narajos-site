<svg xmlns="http://www.w3.org/2000/svg" width="288" height="860" viewBox="0 0 288 860" role="img" aria-labelledby="title description">
<title id="title">Challenge and instructional support</title><desc id="description">A matrix compares challenge and instructional support. Higher challenge with lower support is independent stretch; higher challenge with higher support is supported stretch; lower challenge with lower support is independent consolidation; lower challenge with higher support is supported foundations. All four can be useful.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#435763"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;} @media print{*{print-color-adjust:exact}}</style>
<rect width="288" height="860" fill="#fff"/>
<text x="20" y="35" fill="#24323e" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle" >Challenge and</text>
<text x="20" y="60" fill="#24323e" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle" >instructional support</text>
<text x="144" y="112" fill="#53646c" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" >HIGHER CHALLENGE</text>
<g class="diagram-node" data-node="independent-stretch">
<rect x="24" y="140" width="240" height="110" rx="12" fill="#e8f3ef" stroke="#39786c" stroke-width="1.5" />
<text x="144.0" y="171.0" fill="#24323e" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Independent</text>
<text x="144.0" y="195.0" fill="#24323e" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">stretch</text>
<text x="144.0" y="219.0" fill="#24323e" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">Lower support</text>
</g>
<g class="diagram-node" data-node="supported-stretch">
<rect x="24" y="280" width="240" height="110" rx="12" fill="#fff2e8" stroke="#ad6536" stroke-width="1.5" />
<text x="144.0" y="311.0" fill="#24323e" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Supported</text>
<text x="144.0" y="335.0" fill="#24323e" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">stretch</text>
<text x="144.0" y="359.0" fill="#24323e" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">Higher support</text>
</g>
<text x="144" y="440" fill="#53646c" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" >LOWER CHALLENGE</text>
<g class="diagram-node" data-node="independent-consolidation">
<rect x="24" y="470" width="240" height="110" rx="12" fill="#e8f3ef" stroke="#39786c" stroke-width="1.5" />
<text x="144.0" y="501.0" fill="#24323e" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Independent</text>
<text x="144.0" y="525.0" fill="#24323e" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">consolidation</text>
<text x="144.0" y="549.0" fill="#24323e" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">Lower support</text>
</g>
<g class="diagram-node" data-node="supported-foundations">
<rect x="24" y="610" width="240" height="110" rx="12" fill="#fff2e8" stroke="#ad6536" stroke-width="1.5" />
<text x="144.0" y="641.0" fill="#24323e" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Supported</text>
<text x="144.0" y="665.0" fill="#24323e" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">foundations</text>
<text x="144.0" y="689.0" fill="#24323e" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">Higher support</text>
</g>
<text x="144" y="770" fill="#24323e" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" >Each can be useful for</text>
<text x="144" y="793" fill="#24323e" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" >a different purpose.</text>
<text x="144.0" y="840" fill="#53646c" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="middle" >Narajos · narajos.com</text>
</svg>
