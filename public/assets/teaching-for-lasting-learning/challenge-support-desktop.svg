<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" role="img" aria-labelledby="title description">
<title id="title">Challenge and instructional support</title><desc id="description">A matrix compares challenge and instructional support. Higher challenge with lower support is independent stretch; higher challenge with higher support is supported stretch; lower challenge with lower support is independent consolidation; lower challenge with higher support is supported foundations. All four can be useful.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#435763"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;} @media print{*{print-color-adjust:exact}}</style>
<rect width="880" height="600" fill="#fff"/>
<text x="36" y="48" fill="#24323e" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="middle" >Challenge and instructional support</text>
<text x="36" y="80" fill="#53646c" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="middle" >Both can be adjusted independently.</text>
<text x="340" y="125" fill="#53646c" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" >LOWER SUPPORT</text>
<text x="675" y="125" fill="#53646c" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle" >HIGHER SUPPORT</text>
<text x="30" y="225" fill="#53646c" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" >HIGHER</text>
<text x="30" y="250" fill="#53646c" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" >CHALLENGE</text>
<text x="30" y="410" fill="#53646c" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" >LOWER</text>
<text x="30" y="435" fill="#53646c" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" >CHALLENGE</text>
<g class="diagram-node" data-node="independent-stretch">
<rect x="190" y="155" width="300" height="145" rx="12" fill="#e8f3ef" stroke="#39786c" stroke-width="1.5" />
<text x="340.0" y="212.5" fill="#24323e" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Independent</text>
<text x="340.0" y="242.5" fill="#24323e" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">stretch</text>
</g>
<g class="diagram-node" data-node="supported-stretch">
<rect x="525" y="155" width="300" height="145" rx="12" fill="#fff2e8" stroke="#ad6536" stroke-width="1.5" />
<text x="675.0" y="212.5" fill="#24323e" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Supported</text>
<text x="675.0" y="242.5" fill="#24323e" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">stretch</text>
</g>
<g class="diagram-node" data-node="independent-consolidation">
<rect x="190" y="340" width="300" height="145" rx="12" fill="#e8f3ef" stroke="#39786c" stroke-width="1.5" />
<text x="340.0" y="397.5" fill="#24323e" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Independent</text>
<text x="340.0" y="427.5" fill="#24323e" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">consolidation</text>
</g>
<g class="diagram-node" data-node="supported-foundations">
<rect x="525" y="340" width="300" height="145" rx="12" fill="#fff2e8" stroke="#ad6536" stroke-width="1.5" />
<text x="675.0" y="397.5" fill="#24323e" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Supported</text>
<text x="675.0" y="427.5" fill="#24323e" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">foundations</text>
</g>
<text x="440" y="535" fill="#53646c" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle" >Each can be useful for a different purpose.</text>
<text x="440.0" y="575" fill="#53646c" font-size="16" font-weight="400" text-anchor="middle" dominant-baseline="middle" >Narajos · narajos.com/teaching-for-lasting-learning/</text>
</svg>
