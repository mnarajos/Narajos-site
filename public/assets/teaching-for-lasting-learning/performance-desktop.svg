<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" role="img" aria-labelledby="title description">
<title id="title">Learning and performance</title><desc id="description">Learning and the task, cues, timing, and support can each influence observable performance. Performance is evidence from which learning is inferred, not a direct measure of learning.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#435763"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;} @media print{*{print-color-adjust:exact}}</style>
<rect width="880" height="390" fill="#fff"/>
<text x="36" y="48" fill="#24323e" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="middle" >Learning and performance</text>
<text x="36" y="80" fill="#53646c" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="middle" >What is observed is shaped by more than learning.</text>
<path class="diagram-edge" d="M 270 185 H 325" fill="none" stroke="#435763" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path class="diagram-edge" d="M 610 185 H 555" fill="none" stroke="#435763" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g class="diagram-node" data-node="learning">
<rect x="40" y="135" width="230" height="100" rx="12" fill="#e8f3ef" stroke="#39786c" stroke-width="1.5" />
<text x="155.0" y="169.0" fill="#24323e" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Learning</text>
<text x="155.0" y="201.0" fill="#24323e" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">over time</text>
</g>
<g class="diagram-node" data-node="performance">
<rect x="325" y="135" width="230" height="100" rx="12" fill="#edf1f6" stroke="#667b8e" stroke-width="1.5" />
<text x="440.0" y="169.0" fill="#24323e" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Observable</text>
<text x="440.0" y="201.0" fill="#24323e" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">performance</text>
</g>
<g class="diagram-node" data-node="conditions">
<rect x="610" y="135" width="230" height="100" rx="12" fill="#f8f9f7" stroke="#899891" stroke-width="1.5" />
<text x="725.0" y="169.5" fill="#24323e" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Task, cues, timing,</text>
<text x="725.0" y="200.5" fill="#24323e" font-size="19" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">and support</text>
</g>
<text x="440" y="295" fill="#24323e" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle" >Performance is evidence, not direct access to learning.</text>
<text x="440.0" y="365" fill="#53646c" font-size="16" font-weight="400" text-anchor="middle" dominant-baseline="middle" >Narajos · narajos.com/teaching-for-lasting-learning/</text>
</svg>
