<text x="146.0" y="1031.5" fill="#24323e" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">knowledge</text>
</g>
<g class="diagram-node" data-node="performance">
<rect x="52" y="1135" width="188" height="80" rx="12" fill="#edf1f6" stroke="#667b8e" stroke-width="1.5" />
<text x="146.0" y="1163.5" fill="#24323e" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Observable</text>
<text x="146.0" y="1186.5" fill="#24323e" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">performance</text>
</g>
