<svg xmlns="http://www.w3.org/2000/svg" width="288" height="1168" viewBox="0 0 288 1168" role="img" aria-labelledby="title description">
<title id="title">A framework for learning and teaching</title><desc id="description">Conditions for learning, including accessibility, enable the system as a whole. Prior knowledge and instruction, practice, task design, and support can contribute to developed knowledge. Developed knowledge can become prior knowledge for later learning and support independent competence. Developed knowledge and instructional conditions can each influence observable performance. Teachers interpret this evidence and adapt instruction; existing knowledge is not directly observable. Motivation and self-regulation are distinct learner influences throughout. These relationships are possible, not a fixed sequence or guaranteed outcomes.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#435763"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;} @media print{*{print-color-adjust:exact}}</style>
<rect width="288" height="1168" fill="#fff"/>
<rect x="4" y="4" width="280" height="1086" rx="16" fill="#fbfcfa" stroke="#d8e0db" stroke-width="1.5" />
<text x="20" y="29" fill="#24323e" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" >Learning and teaching</text>
<text x="20" y="55" fill="#24323e" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle" >Conditions for learning</text>
<text x="20" y="77" fill="#53646c" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" >Accessibility, routines,</text>
<text x="20" y="97" fill="#53646c" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" >relationships, expectations,</text>
<text x="20" y="117" fill="#53646c" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" >and participation</text>
<text x="20" y="147" fill="#53646c" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" >Learner influences throughout:</text>
<text x="20" y="171" fill="#69567b" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="middle" >Motivation · Self-regulation</text>
