<svg xmlns="http://www.w3.org/2000/svg" width="288" height="1740" viewBox="0 0 288 1740" role="img" aria-labelledby="title description">
<title id="title">A framework for learning and teaching</title><desc id="description">Conditions for learning surround prior knowledge, instruction and practice, developed knowledge, independent competence, evidence, and learner factors. Developed knowledge becomes prior knowledge for later learning. Instruction and developed knowledge can both influence observable performance. Teachers interpret evidence and adapt instruction. Motivation and self-regulation are distinct factors.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#435763"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;} @media print{*{print-color-adjust:exact}}</style>
<rect width="288" height="1740" fill="#fff"/>
<rect x="6" y="6" width="276" height="1662" rx="16" fill="#fbfcfa" stroke="#d8e0db" stroke-width="1.5" />
<text x="22" y="29" fill="#24323e" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" >Learning and teaching</text>
<text x="22" y="55" fill="#24323e" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle" >Conditions for learning</text>
<text x="22" y="77" fill="#53646c" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" >Routines, relationships,</text>
<text x="22" y="97" fill="#53646c" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" >expectations, and participation</text>
<text x="22" y="130" fill="#53646c" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" >LEARNING OVER TIME</text>
<path class="diagram-edge" d="M 146 210 V 280" fill="none" stroke="#435763" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
