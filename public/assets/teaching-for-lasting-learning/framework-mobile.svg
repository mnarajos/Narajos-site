<text x="16" y="51" fill="#24323e" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle" >about learning and teaching</text>
<text x="20" y="79" fill="#24323e" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle" >Conditions for learning</text>
<text x="20" y="101" fill="#53646c" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" >Accessibility, routines,</text>
<text x="20" y="121" fill="#53646c" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" >relationships, expectations,</text>
<text x="20" y="141" fill="#53646c" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" >and participation</text>
<text x="20" y="171" fill="#53646c" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" >Learner influences throughout:</text>
<text x="20" y="195" fill="#69567b" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="middle" >Motivation · Self-regulation</text>
