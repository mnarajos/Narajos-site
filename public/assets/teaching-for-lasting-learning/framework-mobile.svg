<path class="diagram-edge" d="M 52 1340 H 22 V 890 H 52" fill="none" stroke="#435763" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g class="diagram-node" data-node="instruction-evidence">
<rect x="52" y="850" width="188" height="80" rx="12" fill="#fff2e8" stroke="#ad6536" stroke-width="1.5" />
<text x="146.0" y="878.5" fill="#24323e" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Instruction, task</text>
<text x="146.0" y="901.5" fill="#24323e" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">design, and support</text>
</g>
