<path class="diagram-edge" d="M 146 630 V 670" fill="none" stroke="#435763" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path class="diagram-edge" d="M 46 520 H 24 V 180 H 52" fill="none" stroke="#435763" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g class="diagram-node" data-node="prior">
<rect x="52" y="150" width="188" height="60" rx="12" fill="#e8f3ef" stroke="#39786c" stroke-width="1.5" />
<text x="146.0" y="180.0" fill="#24323e" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Prior knowledge</text>
</g>
<g class="diagram-node" data-node="instruction">
<rect x="52" y="280" width="188" height="120" rx="12" fill="#fff2e8" stroke="#ad6536" stroke-width="1.5" />
<text x="146.0" y="305.5" fill="#24323e" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Instruction,</text>
<text x="146.0" y="328.5" fill="#24323e" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">practice,</text>
<text x="146.0" y="351.5" fill="#24323e" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">task design,</text>
<text x="146.0" y="374.5" fill="#24323e" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">and support</text>
</g>
<g class="diagram-node" data-node="developed">
<rect x="46" y="430" width="200" height="200" rx="12" fill="#e8f3ef" stroke="#39786c" stroke-width="1.5" />
<text x="146.0" y="458.0" fill="#24323e" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Developed</text>
<text x="146.0" y="482.0" fill="#24323e" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">knowledge</text>
<text x="146.0" y="506.0" fill="#24323e" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">Extensive · Accurate</text>
<text x="146.0" y="530.0" fill="#24323e" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">Accessible · Organised</text>
<text x="146.0" y="554.0" fill="#24323e" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">Becomes prior</text>
<text x="146.0" y="578.0" fill="#24323e" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">knowledge for</text>
<text x="146.0" y="602.0" fill="#24323e" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">later learning</text>
</g>
<g class="diagram-node" data-node="competence">
