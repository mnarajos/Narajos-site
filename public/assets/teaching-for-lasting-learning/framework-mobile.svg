<text x="146.0" y="1317.0" fill="#24323e" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Teacher interprets</text>
<text x="146.0" y="1340.0" fill="#24323e" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">evidence and adapts</text>
<text x="146.0" y="1363.0" fill="#24323e" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">instruction</text>
</g>
<text x="22" y="1450" fill="#53646c" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" >DISTINCT LEARNER FACTORS</text>
