<text x="146.0" y="698.5" fill="#24323e" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="node-label">Independent</text>
<text x="146.0" y="721.5" fill="#24323e" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="middle" class="node-label">competence</text>
</g>
<text x="22" y="806" fill="#53646c" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" >OBSERVING PERFORMANCE</text>
