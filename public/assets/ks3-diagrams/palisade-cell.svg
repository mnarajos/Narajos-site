    <use href="#mitochondrion" transform="translate(137 121) rotate(-82) scale(.72)"/>
    <use href="#mitochondrion" transform="translate(198 229) rotate(-63) scale(.79)"/>
    <use href="#mitochondrion" transform="translate(174 247) scale(.62)"/>
  </g>

  <g fill="#283d55">
    <circle cx="136" cy="66" r="1.8"/><circle cx="132" cy="76" r="1.8"/><circle cx="141" cy="80" r="1.8"/>
    <circle cx="136" cy="137" r="1.8"/><circle cx="139" cy="154" r="1.8"/><circle cx="133" cy="188" r="1.8"/>
    <circle cx="147" cy="226" r="1.8"/><circle cx="133" cy="232" r="1.8"/><circle cx="140" cy="237" r="1.8"/>
    <circle cx="218" cy="64" r="1.8"/><circle cx="224" cy="98" r="1.8"/><circle cx="227" cy="135" r="1.8"/>
