    <use href="#chloroplast" transform="translate(216 47) rotate(30)"/>
    <use href="#chloroplast" transform="translate(219 82) rotate(92)"/>
    <use href="#chloroplast" transform="translate(218 117) rotate(92)"/>
    <use href="#chloroplast" transform="translate(135 101) rotate(86)"/>
    <use href="#chloroplast" transform="translate(135 170) rotate(94)"/>
    <use href="#chloroplast" transform="translate(138 211) rotate(79)"/>
    <use href="#chloroplast" transform="translate(218 213) rotate(81)"/>
