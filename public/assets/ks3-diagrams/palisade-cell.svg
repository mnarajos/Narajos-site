<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-labelledby="title description">
  <title id="title">Green leaf palisade cell</title>
  <desc id="description">An elongated cell with a thick wall and a thin membrane just inside it. A large vacuole presses the cytoplasm towards the edges. The cytoplasm contains green chloroplasts, striped orange mitochondria and small dot-like ribosomes. Fine threads represent DNA in the nucleus.</desc>
  <style>
    .label { fill:#203842; font:600 17px system-ui,sans-serif; }
    .leader { stroke:#435c68; stroke-width:1.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  </style>
  <path d="M127 20Q177 15 227 22Q239 24 240 38L240 242Q239 257 227 260Q173 265 128 259Q118 257 117 243L117 37Q117 24 127 20Z"
        fill="#e4c89e" stroke="#795b3b" stroke-width="2.5"/>
  <path d="M130 29Q177 24 225 30Q231 32 231 40V241Q230 249 223 251Q171 255 131 250Q126 248 126 241V41Q126 32 130 29Z"
        fill="#f1f7fa" stroke="#304858" stroke-width="2.3"/>
  <path d="M164 55Q185 45 204 60C215 68 212 102 205 126Q201 139 184 149Q175 159 176 177Q181 189 188 200Q200 229 176 240Q150 245 149 217L145 91Q145 63 164 55Z"
        fill="#d5ecfa" stroke="#43798f" stroke-width="1.8"/>

