<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-labelledby="title description">
  <title id="title">Human cheek cell</title>
  <desc id="description">A flattened animal cell with an uneven outline and a thin blue-grey membrane. Its pale cytoplasm contains small dot-like ribosomes and striped orange mitochondria. Fine threads represent DNA inside the nucleus.</desc>
  <style>
    .label { fill:#203842; font:600 17px system-ui,sans-serif; }
    .leader { stroke:#435c68; stroke-width:1.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  </style>
  <path d="M129 66C148 62 162 66 185 60C212 53 240 63 254 88
           C264 109 253 123 260 144C267 161 270 178 251 195C228 214 210 214 184 222
           C155 230 143 221 108 219C83 217 66 198 68 173C70 149 55 137 66 110C79 79 100 73 129 66Z"
        fill="#f1f7fa" stroke="#304858" stroke-width="2.6"/>

  <defs>
    <g id="mitochondrion">
      <path d="M-13 1Q-8-8 2-7Q11-6 13 1Q8 8-3 7Q-11 6-13 1Z" fill="#f2c497" stroke="#854d2d" stroke-width="1.5"/>
      <path d="M-8 1Q-4-5-1 1T7 0" fill="none" stroke="#854d2d" stroke-width="1.3"/>
    </g>
  </defs>
  <g>
    <use href="#mitochondrion" transform="translate(112 106) rotate(-29)"/>
    <use href="#mitochondrion" transform="translate(202 93) rotate(11)"/>
    <use href="#mitochondrion" transform="translate(219 181) rotate(-37)"/>
    <use href="#mitochondrion" transform="translate(156 206) rotate(20)"/>
    <use href="#mitochondrion" transform="translate(101 185) rotate(51)"/>
  </g>
  <g fill="#283d55">
    <circle cx="93" cy="124" r="1.9"/><circle cx="104" cy="133" r="1.9"/><circle cx="85" cy="150" r="1.9"/>
    <circle cx="109" cy="161" r="1.9"/><circle cx="123" cy="156" r="1.9"/><circle cx="95" cy="168" r="1.9"/>
    <circle cx="131" cy="90" r="1.9"/><circle cx="150" cy="81" r="1.9"/><circle cx="168" cy="86" r="1.9"/>
    <circle cx="229" cy="95" r="1.9"/><circle cx="223" cy="113" r="1.9"/><circle cx="242" cy="127" r="1.9"/>
    <circle cx="204" cy="151" r="1.9"/><circle cx="225" cy="147" r="1.9"/><circle cx="243" cy="167" r="1.9"/>
    <circle cx="128" cy="197" r="1.9"/><circle cx="171" cy="185" r="1.9"/><circle cx="192" cy="203" r="1.9"/>
    <circle cx="202" cy="194" r="1.9"/><circle cx="185" cy="210" r="1.9"/><circle cx="235" cy="193" r="1.9"/>
  </g>

  <ellipse cx="159" cy="136" rx="30" ry="29" fill="#e8dcf2" stroke="#665178" stroke-width="2"/>
  <path d="M145 118C133 130 162 130 154 141S134 145 149 154M163 118C177 124 153 137 173 145S179 152 168 155M145 137q-9 4-4 9"
        stroke="#664182" stroke-width="2.6" fill="none" stroke-linecap="round"/>

