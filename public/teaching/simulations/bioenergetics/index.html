<style>
  :root{
    --bg:#eef1f4; --card:#ffffff; --ink:#13202b; --muted:#5b6f7e; --line:#d6dee5;
    --photo:#2f9e5f; --resp:#c85a2b; --anaer:#8a5cc8;

  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

  header{background:var(--card);border-bottom:1px solid var(--line)}
  .top{padding:9px 16px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}

  .toptabs{display:flex;gap:6px;margin-left:auto}
  .toptab{border:1.5px solid var(--line);background:#f5f8f9;color:var(--ink);padding:8px 14px;border-radius:10px 10px 0 0;

  .toptab:hover{border-color:var(--photo)}
  .toptab[data-top="photosynthesis"][aria-pressed="true"]{background:var(--photo);color:#fff;border-color:var(--photo)}
  .toptab[data-top="aerobic"][aria-pressed="true"]{background:var(--resp);color:#fff;border-color:var(--resp)}
  .toptab[data-top="anaerobic"][aria-pressed="true"]{background:var(--anaer);color:#fff;border-color:var(--anaer)}
  .subtabs{padding:8px 16px;display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);background:#f8fafb}
  .subtab{border:1.5px solid var(--line);background:#fff;color:var(--muted);padding:6px 13px;border-radius:999px;

  main{flex:1;display:flex;min-height:0}

  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--ink);border:3px solid #fff;cursor:pointer}

<script>
"use strict";
/* =======================================================================
   BIOENERGETICS — A-level (AQA 3.5). Self-contained, offline, single file.
   Nested tabs: Photosynthesis (LDR, Calvin) · Aerobic respiration
   (glycolysis, link, Krebs, oxidative phosphorylation) · Anaerobic
   respiration (animals — lactate; plants & fungi — ethanol).
   Pathway stages animate as a guided walkthrough with a running tally;
   the two membrane stages animate chemiosmosis (shared mechanism).
   ======================================================================= */

const cv=document.getElementById("viz"), ctx=cv.getContext("2d");
let DPR=1, VW=940, VH=560, VS=1, OX=0, OY=0, CW=940, CH=560;
function size(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const r=cv.parentElement.getBoundingClientRect();
  CW=Math.max(1,r.width); CH=Math.max(1,r.height);
  cv.width=CW*DPR; cv.height=CH*DPR;
  if(isGuided() && CW<500){
    const [x,y,width,height]=OBSERVATIONS[guideStep].focus;
    VS=Math.min(CW/Math.max(280,width+65),CH/(height+65));
    OX=CW/2-(x+width/2)*VS; OY=CH/2-(y+height/2)*VS;
  }else{
    VS=Math.min(CW/VW,CH/VH); OX=(CW-VW*VS)/2; OY=(CH-VH*VS)/2;
  }
}
window.addEventListener("resize",size);
function enter(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,CW,CH);
  const g=ctx.createLinearGradient(0,0,0,CH);g.addColorStop(0,"#14252f");g.addColorStop(1,"#0d1a24");
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);ctx.translate(OX,OY);ctx.scale(VS,VS);}
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.beginPath();this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);return this;};
}

/* colours for molecule types */
const COL={atp:"#e0a021",nad:"#7b57d6",nadp:"#7b57d6",fad:"#159b8a",co2:"#7a8a96",o2:"#3d8fd6",
  h2o:"#3d8fd6",carbon:"#5c93b0",lac:"#c05a8a",eth:"#c07a2b",gluc:"#e0a021"};

/* ---------- drawing helpers ---------- */
function molBox(x,y,w,h,name,carbons,o){
  o=o||{};
  ctx.save();
  ctx.fillStyle=o.hl?"#ffffff":(o.fill||"#e9f0f5");
  ctx.strokeStyle=o.hl?(o.accent||"#e0a021"):"#8aa6b6";
  ctx.lineWidth=o.hl?3:1.6;
  ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,11);ctx.fill();ctx.stroke();
  ctx.fillStyle="#12303f";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.font="700 "+(o.fs||14)+"px system-ui,sans-serif";
  const ty = carbons!=null ? y-9 : y;
  wrapText(name,x,ty,w-12,15);
  if(carbons!=null) drawCarbons(x, y+13, carbons);
  ctx.restore();
}
function wrapText(t,x,y,maxw,lh){
  const words=t.split(" ");let line="",yy=y,lines=[];
  for(const wd of words){const test=line?line+" "+wd:wd;
    if(ctx.measureText(test).width>maxw&&line){lines.push(line);line=wd;}else line=test;}
  lines.push(line);
  const start=y-(lines.length-1)*lh/2;
  lines.forEach((l,i)=>ctx.fillText(l,x,start+i*lh));
}
function drawCarbons(cx,cy,n){
  const r=4.2, gap=11, tot=(n-1)*gap, x0=cx-tot/2;
  for(let i=0;i<n;i++){ctx.beginPath();ctx.arc(x0+i*gap,cy,r,0,6.29);ctx.fillStyle=COL.carbon;ctx.fill();
    ctx.strokeStyle="#2c4a5c";ctx.lineWidth=1;ctx.stroke();}
}
function arrow(x1,y1,x2,y2,o){
  o=o||{};ctx.save();
  const col=o.hl?(o.col||"#f0c030"):"#4a6272";
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=o.hl?3.5:2.2;ctx.lineCap="round";
  if(o.hl&&o.flow!=null){ctx.setLineDash([9,7]);ctx.lineDashOffset=-o.flow*32;}
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);
  const a=Math.atan2(y2-y1,x2-x1),s=o.hl?12:9;
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-Math.cos(a-0.5)*s,y2-Math.sin(a-0.5)*s);
  ctx.lineTo(x2-Math.cos(a+0.5)*s,y2-Math.sin(a+0.5)*s);ctx.closePath();ctx.fill();
  ctx.restore();
}
/* small labelled token that flies off toward the tally when a step fires */
function sideLabel(x,y,txt,col,align){
  ctx.save();ctx.font="700 12px system-ui,sans-serif";ctx.textBaseline="middle";
  const w=ctx.measureText(txt).width+16;
  align=align||"center";
  const bx = align==="left"?x : align==="right"?x-w : x-w/2;
  ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(bx,y-11,w,22,8);ctx.fill();
  ctx.fillStyle="#fff";ctx.textAlign="center";ctx.fillText(txt,bx+w/2,y+0.5);
  ctx.restore();
}
function inOut(x,y,ins,outs,hl){ // ins consumed (red), outs produced (green), stacked labels near an arrow
  ctx.save();ctx.font="700 11.5px system-ui,sans-serif";ctx.textBaseline="middle";ctx.textAlign="center";
  let yy=y;
  for(const t of ins){ const w=ctx.measureText(t).width+14;
    ctx.globalAlpha=hl?1:.5;ctx.fillStyle="#d64c5a";ctx.beginPath();ctx.roundRect(x-w/2,yy-9,w,18,7);ctx.fill();
    ctx.fillStyle="#fff";ctx.fillText(t,x,yy+0.5);yy-=21;}
  yy=y+ (ins.length?21:0);
  for(const t of outs){ const w=ctx.measureText(t).width+14;
    ctx.globalAlpha=hl?1:.5;ctx.fillStyle="#2f9e5f";ctx.beginPath();ctx.roundRect(x-w/2,yy-9,w,18,7);ctx.fill();
    ctx.fillStyle="#fff";ctx.fillText(t,x,yy+0.5);yy+=21;}
  ctx.restore();
}
function title(txt,sub){
  ctx.save();ctx.textAlign="center";
  ctx.fillStyle="#e7f1f8";ctx.font="800 20px system-ui,sans-serif";ctx.fillText(txt,VW/2,40);
  if(sub){ctx.fillStyle="#7fa0b4";ctx.font="600 12.5px system-ui,sans-serif";ctx.fillText(sub,VW/2,62);}
  ctx.restore();
}

/* =======================================================================
   STAGE DEFINITIONS
   Each stage: {top, loc, locColor, equation, summary, facts[],
     type:'path'|'membrane', steps:[{desc, yield:{}}], turnNote, draw(f)}
   'yield' keys: atp,nad,nadp,fad,co2,o2,h2o,acetyl,pyr,lactate,ethanol,glucose,tp
   Positive = produced; negative = used. 'spent' keys shown as "used".
   ======================================================================= */
const STAGES={};

/* ---- GLYCOLYSIS ---- */
STAGES.glycolysis={
  top:"aerobic", loc:"Cytosol", locColor:"#c85a2b", equation:"",
  summary:"<b>Net 2 ATP</b>, <b>2 reduced NAD</b> and <b>2 pyruvate</b> per glucose. 2 ATP are used to phosphorylate the sugar and 4 are made, so the net gain is 2. Happens in the cytosol and needs no oxygen \u2014 the shared first stage of aerobic <em>and</em> anaerobic respiration.",
  facts:["Phosphorylation of glucose to glucose phosphate, using ATP.",
    "A second phosphorylation gives an unstable 6C sugar with two phosphates.",
    "This splits to produce two triose phosphate molecules.",
    "Oxidation of triose phosphate to pyruvate: net gain of ATP and reduced NAD."],
  type:"glyco"
};

/* ---- LINK REACTION ---- */
STAGES.link={
  top:"aerobic", loc:"Mitochondrial matrix", locColor:"#c85a2b", equation:"",
  summary:"Per pyruvate: <b>1 CO\u2082</b>, <b>1 reduced NAD</b> and <b>1 acetyl coenzyme A</b>. <b>No ATP</b> is made. It runs <b>twice per glucose</b>, because glycolysis produced two pyruvate, so per glucose: 2 CO\u2082, 2 reduced NAD and 2 acetyl CoA.",
  facts:["Decarboxylation: a carbon is removed from pyruvate as CO\u2082.",
    "Dehydrogenation: hydrogen passes to NAD \u2192 reduced NAD.",
    "The 2C acetate joins coenzyme A to form acetyl coenzyme A.",

function makeChemi(cfg){ return { electrons:[], protons:[], byp:[], curls:[], products:[], donorEv:[],

function chemiOf(){ const k=S.sub; if(!CHEMI[k]) CHEMI[k]=makeChemi(CH_CFG[k]); return CHEMI[k]; }

    a.pi.x+=(px-a.pi.x)*Math.min(1,dt*sp*5.0);   a.pi.y+=(py-a.pi.y)*Math.min(1,dt*sp*5.0);

/* ======================================================================
   CALVIN CYCLE — molecules are drawn as linked circles and physically move
   round the cycle, so the stoichiometry is carried by the NUMBER of
   molecules, not by an equation.
     RuBP = P + 5 grey C + P      (phosphorylated at both ends)
     GP   = 3 grey C + P
     TP   = 3 purple C + P        (purple = reduced, energy-rich)
     CO2  = 1 grey C
   Balance used (all carbon-balanced):
     fixation      1 CO2 + 1 RuBP            -> 2 GP
     reduction     1 GP + 1 ATP + 1 rNADP    -> 1 TP
     regeneration  5 TP + 3 ATP              -> 3 RuBP
     output        2 TP                      -> 1 glucose
   Over 6 turns that is 18 ATP and 12 reduced NADP per glucose.
   ====================================================================== */
const CG={ cx:440, cy:290, rx:230, ry:115,
  rubp:[213,270], rubisco:[440,140], gp:[656,251], tp:[440,405],
  bindRuBP:[418,182], bindCO2:[478,182],
  co2:[250,96], glu:[664,488], gluLabel:[830,488], tpLabel:[440,480] };
const C_FIX="#e0a021", C_RED="#7c3aed", C_REG="#159b8a", C_OUT="#2f9e5f";
const ATP_BLUE="#8ecbf5", ADP_GREY="#7d8f99", NADP_ORG="#f5b774", NADP_GREY="#9c8d7e";
const CARB="#93a3b0", CARBR="#7c3aed", PHOS="#ec4899";
/* Supply of ATP and reduced NADP from the LDR: individual molecules that
   accumulate in the top-right corner, then move off one at a time to be used.
   Baby blue = ATP, light orange = reduced NADP; the spent forms (ADP, NADP)
   are desaturated. Purple is reserved for the key end product. */
const SUP={
  atp:{ox:786,oy:88,cols:3,dx:38,dy:21,max:9,col:"#8fd3f4",spentCol:"#8098a6",lab:"ATP",spentLab:"ADP"},
  nadp:{ox:786,oy:160,cols:2,dx:80,dy:21,max:6,col:"#f6c48a",spentCol:"#a89681",lab:"reduced NADP",spentLab:"NADP"} };
function slotPos(k,i){ const s=SUP[k], c=i%s.cols, r=Math.floor(i/s.cols);
  return [s.ox+(c-(s.cols-1)/2)*s.dx, s.oy+r*s.dy]; }
let CAL=null;
function makeCalvin(){ return { pools:{co2:1,rubp:6,gp:2,tp:0,glucose:0,atp:0,nadph:0},

function calvin(){ if(!CAL) CAL=makeCalvin(); return CAL; }
/* Remove CO2: every CO2 on screen goes — the pool, the ones diffusing in,
   the one bound to rubisco, and any fixation already under way. */
function calvinClearCO2(){ const C=calvin();
  C.pools.co2=0; C.co2in=[]; C.rubCO2=null;
  C.ev=C.ev.filter(e=>e.k!=="fix");
  C.t.co2=0; C.t.fix=0; }
function newTok(k,delay){ return {k, st:"in", x:986+Math.random()*46, y:56+Math.random()*170,
  t:0, delay:delay||0, rate:1.7+Math.random()*1.3, slot:0}; }
function idleCount(C,k){ return C.supply.filter(t=>t.k===k&&t.st==="idle").length; }
function takeToken(C,k,tgt,delay,ev){
  const t=C.supply.find(z=>z.k===k&&z.st==="idle"); if(!t) return null;
  t.st="use"; t.tgt=tgt; t.t=-(delay||0); t.delay=0; t.dur=0.9+Math.random()*0.35;
  t.ox=(Math.random()-0.5)*100; t.oy=(Math.random()-0.5)*80; t.rate=2.0+Math.random()*1.5; t.ev=ev; return t; }

const D=Math.PI/180, A_RUBP=190*D, A_RUBI=270*D, A_GP=340*D, A_TP=90*D;
function arcPath(a0,a1,n){ const o=[]; let d=a1-a0; while(d<0)d+=6.283;

function walk(path,t){ t=Math.max(0,Math.min(1,t));
  const seg=t*(path.length-1), i=Math.min(Math.floor(seg),path.length-2), f=seg-i;
  return [path[i][0]+(path[i+1][0]-path[i][0])*f, path[i][1]+(path[i+1][1]-path[i][1])*f]; }
const P_FIX=arcPath(A_RUBP,A_RUBI,10).concat([CG.bindRuBP]), P_GP=arcPath(A_RUBI,A_GP,10),
      P_RED=arcPath(A_GP,A_TP,14), P_REG=arcPath(A_TP,A_RUBP,14);
const P_OUT=[[484,432],[560,452],[632,470]];      // TP -> glucose, straight out to the right
function updateCalvin(dt){
  const C=calvin(), sp=S.speed*0.6, P=C.pools;   // slower by default
  if(!S.playing) { for(const c of C.curls) c.age+=dt*sp*1.5; C.curls=C.curls.filter(c=>c.age<1); return; }
  // CO2 drifts in from above into a small waiting pool
  C.t.co2-=dt*sp;
  if(S.noCO2 && (P.co2>0||C.co2in.length||C.rubCO2)) calvinClearCO2();
  if(C.t.co2<=0 && !S.noCO2 && P.co2+C.co2in.length<5){ C.t.co2=1.5;
    C.co2in.push({x:-22, y:CG.co2[1]-10+Math.random()*20, t:0}); }   // diffuses in from the LEFT
  for(const c of C.co2in){ c.t+=dt*sp*0.7; c.x=-22+(CG.co2[0]+22)*Math.min(1,c.t);
    if(c.t>=1&&!c.done){ c.done=true; P.co2++; } }
  C.co2in=C.co2in.filter(c=>!c.done);
  // A CO2 binds rubisco first, then waits there for RuBP to arrive
  if(!C.rubCO2 && P.co2>=1){ P.co2--; C.rubCO2={t:0,bound:false}; }
  if(C.rubCO2 && !C.rubCO2.bound){ C.rubCO2.t+=dt*sp*0.85;
    if(C.rubCO2.t>=1){ C.rubCO2.bound=true; C.rubCO2.t=1; } }
  // ATP + reduced NADP arrive from the light-dependent reaction (3 ATP : 2 rNADP)
  C.t.sup-=dt*sp;
  if(C.t.sup<=0 && !S.dark){ C.t.sup=2.6/Math.max(0.15,S.lightI);
    const held=k=>C.supply.filter(t=>t.k===k&&(t.st==="in"||t.st==="idle")).length;
    for(let i=0;i<3;i++) if(held("atp")<SUP.atp.max)  C.supply.push(newTok("atp",i*0.24));
    for(let i=0;i<2;i++) if(held("nadp")<SUP.nadp.max) C.supply.push(newTok("nadp",0.14+i*0.32)); }
  // ---- trigger events ----
  C.t.fix-=dt*sp; C.t.red-=dt*sp; C.t.reg-=dt*sp; C.t.out-=dt*sp;
  const busy=k=>C.ev.filter(e=>e.k===k).length;
  // Fixation needs no ATP (so it still runs in the dark), but its rate is set
  // by how fast RuBP is regenerated, which is ATP-limited -> tie it to light.
  if(C.t.fix<=0 && C.rubCO2 && C.rubCO2.bound && P.rubp>=1 && P.gp<=13 && busy("fix")<1){
    C.rubCO2.used=true; P.rubp--; C.t.fix=2.7/Math.max(0.15,S.lightI); C.ev.push({k:"fix",ph:"in",t:0}); }
  if(C.t.red<=0 && P.gp>=1 && idleCount(C,"atp")>=1 && idleCount(C,"nadp")>=1 && busy("red")<3){
    P.gp--; C.t.red=0.9;
    const evR={k:"red",ph:"move",t:0,prog:0,hasA:false,hasN:false,w:0,cv:0}; C.ev.push(evR);
    takeToken(C,"atp","red",0,evR); takeToken(C,"nadp","red",0.24,evR); }
  if(C.t.reg<=0 && P.tp>=5 && idleCount(C,"atp")>=3 && busy("reg")===0){
    P.tp-=5; C.t.reg=2.2;
    const evG={k:"reg",ph:"move",t:0}; C.ev.push(evG);
    for(let i=0;i<3;i++) takeToken(C,"atp","reg",i*0.32,evG); }
  // Exactly 1 TP in 6 leaves the cycle: 12 TP made per 2 exported = 1 glucose
  // per 6 turns, which is the textbook stoichiometry.
  if(C.t.out<=0 && P.tp>=2 && busy("out")===0 && C.tpMade>=12*(P.glucose+1)){
    P.tp-=2; C.t.out=1.4; C.ev.push({k:"out",ph:"move",t:0}); }
  // ---- advance events ----
  for(const e of C.ev){ e.t+=dt*sp;
    if(e.k==="fix"){
      if(e.ph==="in" && e.t>=1){ e.ph="react"; e.t=0; C.curls.push({x:CG.rubisco[0]+46,y:176,age:0}); }
      else if(e.ph==="react" && e.t>=0.55){ e.ph="out"; e.t=0; C.rubCO2=null; }   // CO2 consumed here
      else if(e.ph==="out" && e.t>=1){ e.done=true; P.gp+=2; C.fixed++; } }
    else if(e.k==="red"){
      if(e.ph==="move"){ e.prog=Math.min(0.5,e.prog+dt*sp*0.9); if(e.prog>=0.5) e.ph="wait"; }
      else if(e.ph==="wait"){ e.w+=dt*sp;                       // holds until BOTH have made contact
        if((e.hasA&&e.hasN)||e.w>6){ e.ph="pause"; e.cv=0;
          C.curls.push({x:walk(P_RED,e.prog)[0]+28,y:walk(P_RED,e.prog)[1],age:0}); } }
      else if(e.ph==="pause"){ e.cv+=dt*sp; if(e.cv>=0.5) e.ph="out"; }   // half-second pause, then it converts
      else { e.prog=Math.min(1,e.prog+dt*sp*0.9);
        if(e.prog>=1){ e.done=true; P.tp++; C.tpMade++; } } }
    else if(e.k==="reg"){
      if(!e.mid && e.t>=0.6){ e.mid=true; C.curls.push({x:walk(P_REG,0.55)[0],y:walk(P_REG,0.55)[1]-26,age:0}); }
      if(e.t>=1.5){ e.done=true; P.rubp+=3; } }
    else if(e.k==="out"){ if(e.t>=1.2){ e.done=true; P.glucose++; } } }
  C.ev=C.ev.filter(e=>!e.done);
  // waiting molecules re-pack into the corner grid as others are taken
  let ia=0, ib=0;
  for(const t of C.supply) if(t.st==="in"||t.st==="idle") t.slot = (t.k==="atp"? ia++ : ib++);
  for(const t of C.supply){ t.t+=dt*sp;
    if(t.t < (t.delay||0)) continue;
    if(t.st==="in"||t.st==="idle"){
      const q=slotPos(t.k,t.slot);
      t.x+=(q[0]-t.x)*Math.min(1,dt*sp*t.rate); t.y+=(q[1]-t.y)*Math.min(1,dt*sp*t.rate);
      if(t.st==="in" && Math.hypot(q[0]-t.x,q[1]-t.y)<5) t.st="idle"; }
    else if(t.st==="use"){                                  // travels on its own arc to the reaction
      const e=t.ev;
      const base = t.tgt==="red" ? walk(P_RED, e?e.prog:0.5)
                                 : walk(P_REG, e?Math.min(1,e.t/1.5):0.55);
      const f=Math.min(1,Math.max(0,t.t)/t.dur);
      const dx=base[0]+t.ox*(1-f), dy=base[1]+t.oy*(1-f);
      t.x+=(dx-t.x)*Math.min(1,dt*sp*t.rate); t.y+=(dy-t.y)*Math.min(1,dt*sp*t.rate);
      if(f>=1){ t.st="spent"; t.t=0;                        // now ADP / NADP
        if(e){ if(t.k==="atp") e.hasA=true; else e.hasN=true; }
        t.bx=t.x+(Math.random()-0.5)*90; t.by=t.y+56+Math.random()*54; } }
    else { t.x+=(t.bx-t.x)*Math.min(1,dt*sp*1.2); t.y+=(t.by-t.y)*Math.min(1,dt*sp*1.2);
      if(t.t>1.6) t.done=true; } }
  C.supply=C.supply.filter(t=>!t.done);
  P.atp=idleCount(C,"atp"); P.nadph=idleCount(C,"nadp");
  for(const c of C.curls) c.age+=dt*sp*1.5; C.curls=C.curls.filter(c=>c.age<1);
}
/* ---------- molecule glyphs: linked circles ---------- */
function molSpec(kind){
  const C6=[[CARB,""],[CARB,""],[CARB,""],[CARB,""],[CARB,""],[CARB,""]];
  if(kind==="glucose") return C6;                                   // 6C
  if(kind==="g1p")     return C6.concat([[PHOS,"P"]]);              // glucose phosphate
  if(kind==="hbp")     return [[PHOS,"P"]].concat(C6,[[PHOS,"P"]]); // 2 phosphates (unlabelled)
  if(kind==="tp3")     return [[CARB,""],[CARB,""],[CARB,""],[PHOS,"P"]];
  if(kind==="lact")    return [["#c05a8a",""],["#c05a8a",""],["#c05a8a",""]];
  if(kind==="ethanal") return [[CARB,""],[CARB,""]];
  if(kind==="ethanol") return [["#c07a2b",""],["#c07a2b",""]];
  if(kind==="oaa")     return [["#f0e08a",""],["#f0e08a",""],["#f0e08a",""],["#f0e08a",""]];  // regenerated oxaloacetate
  if(kind==="cit6")    return [["#22aaf5",""],["#22aaf5",""],["#22aaf5",""],["#22aaf5",""],["#22aaf5",""],["#22aaf5",""]];
  if(kind==="c4")      return [[CARB,""],[CARB,""],[CARB,""],[CARB,""]];
  if(kind==="c5")      return [[CARB,""],[CARB,""],[CARB,""],[CARB,""],[CARB,""]];
  if(kind==="c6")      return [[CARB,""],[CARB,""],[CARB,""],[CARB,""],[CARB,""],[CARB,""]];
  if(kind==="acetB")   return [["#6cbdf0",""],["#6cbdf0",""]];              // acetyl group arriving
  if(kind==="pyrIn")   return [["#6cbdf0",""],["#6cbdf0",""],["#6cbdf0",""]];  // substrate, not the product
  if(kind==="acet")    return [[CARB,""],[CARB,""]];                       // 2C acetate
  if(kind==="acetY")   return [["#f0e08a",""],["#f0e08a",""]];              // acetate once NAD has been reduced
  if(kind==="acetP")   return [["#6d28d9",""],["#6d28d9",""]];              // acetate once bound to CoA
  if(kind==="tpL")     return [[PHOS,"P"],[CARB,""],[CARB,""],[CARB,""]];   // left half of the split
  if(kind==="tp3b")    return [[PHOS,"P"],[CARB,""],[CARB,""],[CARB,""],[PHOS,"P"]];  // during oxidation
  if(kind==="pyr")     return [["#6d28d9",""],["#6d28d9",""],["#6d28d9",""]];        // darkest purple = key product
  if(kind==="rubp") return [[PHOS,"P"],[CARB,""],[CARB,""],[CARB,""],[CARB,""],[CARB,""],[PHOS,"P"]];
  if(kind==="gp")   return [[CARB,""],[CARB,""],[CARB,""],[PHOS,"P"]];
  if(kind==="tp")   return [[CARBR,""],[CARBR,""],[CARBR,""],[PHOS,"P"]];
  return [[CARB,""]];                       // CO2 = one carbon
}
function drawMol(x,y,kind,sc){
  sc=sc||1; const spec=molSpec(kind), n=spec.length, r=6.4*sc, gap=14.5*sc;
  const x0=x-(n-1)*gap/2;
  ctx.save();
  if(n>1){ ctx.strokeStyle="rgba(210,225,235,.55)";ctx.lineWidth=3.4*sc;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x0+(n-1)*gap,y);ctx.stroke(); }
  for(let i=0;i<n;i++){ const cx=x0+i*gap;
    ctx.beginPath();ctx.arc(cx,y,r,0,6.29);ctx.fillStyle=spec[i][0];ctx.fill();
    ctx.strokeStyle="rgba(10,25,35,.55)";ctx.lineWidth=1.1*sc;ctx.stroke();
    if(spec[i][1]){ ctx.fillStyle="#fff";ctx.font="800 "+(8*sc)+"px system-ui";
      ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(spec[i][1],cx,y+0.5); } }
  ctx.restore();
}
function nameBubble(x,y,txt,col,fs){ fs=fs||11; ctx.save();ctx.font="800 "+fs+"px system-ui";ctx.textBaseline="middle";
  const w=ctx.measureText(txt).width+18, hh=fs*1.9;
  ctx.fillStyle="rgba(12,26,36,.92)";ctx.strokeStyle=col;ctx.lineWidth=1.6;
  ctx.beginPath();ctx.roundRect(x-w/2,y-hh/2,w,hh,8);ctx.fill();ctx.stroke();
  ctx.fillStyle="#e9f3fa";ctx.textAlign="center";ctx.fillText(txt,x,y+0.5);ctx.restore(); }
function nameCount(x,y,txt,col,n){
  ctx.save();ctx.font="800 11px system-ui";
  const w=ctx.measureText(txt).width+18;ctx.restore();
  nameBubble(x,y,txt,col);
  countBadge(x-w/2-14,y,n,col);
}
function countBadge(x,y,n,col){ ctx.save();ctx.beginPath();ctx.arc(x,y,11,0,6.29);
  ctx.fillStyle=col;ctx.fill();ctx.strokeStyle="rgba(8,20,28,.6)";ctx.lineWidth=1.2;ctx.stroke();
  ctx.fillStyle="#fff";ctx.font="800 11px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(String(n),x,y+0.5);ctx.restore(); }
function drawPool(pos,kind,count,maxShow){
  const show=Math.min(count,maxShow||5), sp=17, y0=pos[1]-(show-1)*sp/2;
  for(let i=0;i<show;i++) drawMol(pos[0],y0+i*sp,kind,0.86);
}
function drawArcArrows(path,col,nArrow){
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=2.4;ctx.setLineDash([7,7]);
  ctx.beginPath();path.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=col;
  for(let k=1;k<=nArrow;k++){ const t=k/(nArrow+1);
    const a=walk(path,Math.max(0,t-0.01)), b=walk(path,Math.min(1,t+0.01));
    const ang=Math.atan2(b[1]-a[1],b[0]-a[0]), px=b[0], py=b[1];
    ctx.beginPath();ctx.moveTo(px+Math.cos(ang)*8,py+Math.sin(ang)*8);
    ctx.lineTo(px-Math.cos(ang-0.55)*8,py-Math.sin(ang-0.55)*8);
    ctx.lineTo(px-Math.cos(ang+0.55)*8,py-Math.sin(ang+0.55)*8);ctx.closePath();ctx.fill(); }
  ctx.restore(); }
function drawRubisco(x,y,hot){
  ctx.save();
  ctx.fillStyle=hot?"#f0c357":"#8a6a1e";ctx.strokeStyle=C_FIX;ctx.lineWidth=2.6;
  ctx.beginPath();ctx.roundRect(x-52,y-28,104,56,16);ctx.fill();ctx.stroke();
  ctx.fillStyle="rgba(10,24,32,.5)";                       // active site opening, facing the substrates
  ctx.beginPath();ctx.ellipse(x+16,y+28,26,9,0,0,6.29);ctx.fill();
  ctx.fillStyle=hot?"#3a2a00":"#f2e2b8";ctx.font="800 13px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("rubisco",x-14,y-2);ctx.restore(); }
function drawHexGlucose(x,y,sc){
  sc=sc||1; const r=17*sc;
  ctx.save();
  ctx.beginPath();
  for(let i=0;i<6;i++){ const a=(i*60-90)*Math.PI/180, px=x+Math.cos(a)*r, py=y+Math.sin(a)*r;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
  ctx.closePath();
  ctx.fillStyle="#2f9e5f";ctx.fill();ctx.strokeStyle="#8ff0bb";ctx.lineWidth=2*sc;ctx.stroke();
  ctx.fillStyle="#eafff2";ctx.font="800 "+(9*sc)+"px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("6C",x,y+0.5);
  ctx.restore();
}
function drawCalvin(){
  const C=calvin(), P=C.pools;
  title("The Calvin Cycle","Stroma");
  // coloured, arrowed cycle
  drawArcArrows(P_FIX,C_FIX,2); drawArcArrows(P_GP,C_FIX,2);
  drawArcArrows(P_RED,C_RED,3); drawArcArrows(P_REG,C_REG,3);
  drawArcArrows(P_OUT,C_OUT,1);
  ctx.textBaseline="middle";ctx.textAlign="center";
  ctx.font="800 13.5px system-ui";
  ctx.fillStyle=C_FIX;ctx.fillText("1  FIXATION",300,156);
  ctx.fillStyle=C_RED;ctx.fillText("2  REDUCTION",714,374);
  ctx.fillStyle=C_REG;ctx.fillText("3  REGENERATION",196,440);
  // supply arriving from the LDR, top-right (next to where it is used)
  ctx.fillStyle="#8fa8b8";ctx.font="700 9.5px system-ui";ctx.textAlign="right";
  ctx.fillText(S.dark?"nothing arriving \u2014 dark":"arriving from the light-dependent reaction",914,62);
  // (the individual ATP / reduced NADP molecules themselves are drawn further down)
  // CO2 waiting pool (fades in from the top)
  nameBubble(CG.co2[0],CG.co2[1]-34,"CO\u2082",C_FIX);
  const nco2=Math.min(P.co2,5);
  for(let i=0;i<nco2;i++) drawMol(CG.co2[0]-(nco2-1)*11.5+i*23,CG.co2[1],"co2",0.9);
  ctx.fillStyle="#7d8b96";ctx.font="italic 600 9.5px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("diffuses in from the air",176,CG.co2[1]+28);
  for(const c of C.co2in){ ctx.globalAlpha=Math.min(1,c.t*1.6); drawMol(c.x,c.y,"co2",0.9); ctx.globalAlpha=1; }

  // rubisco at the top of the cycle
  drawRubisco(CG.rubisco[0],CG.rubisco[1],C.ev.some(e=>e.k==="fix"&&e.ph==="react"));
  // the CO2 bound in front of rubisco, drawn ON TOP of the enzyme so it stays visible
  if(C.rubCO2){ const f=C.rubCO2.t;
    const bx=CG.co2[0]+(CG.bindCO2[0]-CG.co2[0])*f, by=CG.co2[1]+(CG.bindCO2[1]-CG.co2[1])*f;
    if(C.rubCO2.bound){ ctx.strokeStyle=C_FIX;ctx.lineWidth=1.8;
      ctx.beginPath();ctx.arc(CG.bindCO2[0],CG.bindCO2[1],12,0,6.29);ctx.stroke(); }
    drawMol(bx,by,"co2",0.9); }
  // pools — count badge sits to the LEFT of each set of molecules
  nameCount(158,200,"RuBP (5C)",C_REG,P.rubp);   drawPool(CG.rubp,"rubp",P.rubp,5);
  nameCount(CG.gp[0],CG.gp[1]-84,"GP (3C)",C_FIX,P.gp);           drawPool(CG.gp,"gp",P.gp,5);
  drawPool(CG.tp,"tp",P.tp,6); nameCount(CG.tp[0],CG.tp[1]+76,"triose phosphate (3C)",C_RED,P.tp);
  // output: glucose hexagon, then the label
  drawHexGlucose(CG.glu[0],CG.glu[1],1);
  nameCount(CG.gluLabel[0],CG.gluLabel[1],"glucose, amino acids, lipids",C_OUT,P.glucose);
  // moving molecules
  for(const e of C.ev){
    if(e.k==="fix"){
      if(e.ph==="in"){ const f=Math.min(1,e.t);
        const a=walk(P_FIX,f); drawMol(a[0],a[1],"rubp",0.86); }
      else if(e.ph==="react"){ drawMol(448,182,"gp",0.72); }
      else { const f=Math.min(1,e.t), a=walk(P_GP,f);
        drawMol(a[0],a[1]-10,"gp",0.86); drawMol(a[0],a[1]+10,"gp",0.86); } }
    else if(e.k==="red"){ const a=walk(P_RED,e.prog);
      drawMol(a[0],a[1], (e.ph==="out")?"tp":"gp", 0.86); }
    else if(e.k==="reg"){ const f=Math.min(1,e.t/1.5), a=walk(P_REG,f);
      if(f<0.6){ for(let i=0;i<5;i++) drawMol(a[0],a[1]-32+i*16,"tp",0.62); }
      else { for(let i=0;i<3;i++) drawMol(a[0],a[1]-18+i*18,"rubp",0.72); } }
    else if(e.k==="out"){ const f=Math.min(1,e.t/1.2), a=walk(P_OUT,f);
      if(f<0.8){ drawMol(a[0],a[1]-9,"tp",0.7); drawMol(a[0],a[1]+9,"tp",0.7); }
      else { ctx.globalAlpha=Math.min(1,(f-0.8)*5); drawHexGlucose(a[0],a[1],0.8); ctx.globalAlpha=1; } } }
  for(const t of C.supply){ const s=SUP[t.k], spent=(t.st==="spent");
    ctx.globalAlpha = spent ? Math.max(0,1-t.t/1.6) : 1;
    pill(t.x, t.y, spent?s.spentLab:s.lab, spent?s.spentCol:s.col, 9.5, !spent);
    ctx.globalAlpha=1; }
  for(const c of C.curls) drawCurl(c.x,c.y,c.age);
  if(S.dark) drawCalvinDark(); else if(S.noCO2) drawCalvinNoCO2();
}

/* ======================================================================
   GLYCOLYSIS — the substrate physically travels from station to station,
   being converted as it goes, with individual ATP / ADP / NAD / reduced
   NAD molecules moving in and out. AQA stages: phosphorylation of glucose
   to glucose phosphate using ATP; production of triose phosphate;
   oxidation of triose phosphate to pyruvate with a net gain of ATP and
   reduced NAD. The hexose bisphosphate is shown but left unlabelled.
   ====================================================================== */

/* ======================================================================
   THE KREBS CYCLE — acetyl CoA enters at the TOP, CoA is released and
   recycled, and the substrate travels round a colour-coded ring losing
   two carbons as CO2. Purple is reserved for the key products (reduced
   NAD and ATP); the cycle intermediates stay grey. FAD is left out.
   ====================================================================== */
const KG={ cx:470, cy:296, rx:215, ry:126,
  aOAA:250*Math.PI/180, aWAIT:234*Math.PI/180, aCIT:320*Math.PI/180,
  aC5:30*Math.PI/180, aC4:130*Math.PI/180,
  entry:[396,96], coaOut:[812,104],
  prod:{x:854,y0:152,dy:38}, q:{x0:326,y:84,dx:58,shown:3} };
const C_OX="#159b8a", C_KREG="#3d8fd6", C_OAA="#e6c84f";
function ovalAt(x){ return {x, y:LG.memY, rx:LG.ovalRx, ry:LG.ovalRy}; }
function kPt(a){ return [KG.cx+KG.rx*Math.cos(a), KG.cy+KG.ry*Math.sin(a)]; }
function kArc(a0,a1,n){ const o=[]; let d=a1-a0; while(d<0)d+=6.283;
  for(let i=0;i<=n;i++) o.push(kPt(a0+d*i/n)); return o; }
const KP=[kArc(KG.aOAA,KG.aCIT,14), kArc(KG.aCIT,KG.aC5,12),
          kArc(KG.aC5,KG.aC4,12), kArc(KG.aC4,KG.aWAIT,14), kArc(KG.aWAIT,KG.aOAA,6)];
const KSTA=[kPt(KG.aOAA), kPt(KG.aCIT), kPt(KG.aC5), kPt(KG.aC4)], KWAIT=kPt(KG.aWAIT);
const KSTEPS=[
  {d:2.4, t:"Acetyl CoA (2C) comes down from the top and touches the oxaloacetate (4C) waiting at the front of the cycle."},
  {d:2.8, t:"Condensation: the two join to form citrate \u2014 a 6C chain. Coenzyme A is released and reused."},
  {d:4.2, t:"NAD moves out from the matrix towards the citrate, the 5C and the 4C. ADP and Pi move in on the 4C."},
  {d:5.4, t:"Two carbons come away as CO\u2082 and drift into the matrix. Three NAD are reduced, and ADP + Pi join on the 4C to make ATP."},
  {d:3.0, t:"Each molecule moves round to the next position, and the waiting oxaloacetate takes its place at the front."},
  {d:2.6, t:"The products leave the matrix. Oxaloacetate is regenerated, so the cycle can turn again."}
];
let KRB=null;
function makeKrb(){ return {step:0,t:0,curls:[],cum:{acoa:0,co2:0,rnad:0,atp:0,turns:0},
  queue:[{x:KG.q.x0,y:KG.q.y},{x:KG.q.x0+KG.q.dx,y:KG.q.y}]}; }
function krb(){ if(!KRB) KRB=makeKrb(); return KRB; }
function krbSlot(i){ return [KG.q.x0+Math.min(i,KG.q.shown-1)*KG.q.dx, KG.q.y]; }
function krbTotalTime(){ return KSTEPS.reduce((a,s)=>a+s.d,0); }
function krbElapsed(){ const K=krb(); let t=K.t; for(let i=0;i<K.step;i++) t+=KSTEPS[i].d; return t; }
function krbSeek(fr){ const K=krb(); let t=Math.max(0,Math.min(1,fr))*krbTotalTime();
  for(let i=0;i<KSTEPS.length;i++){ if(t<KSTEPS[i].d||i===KSTEPS.length-1){ K.step=i; K.t=Math.min(t,KSTEPS[i].d-0.001); break; } t-=KSTEPS[i].d; } }
function krbRate(){ return Math.min(3.2, 0.85+0.35*Math.max(1,krb().queue.length)); }
function updateKrb(dt){ const K=krb(), sp=S.speed*krbRate();
  if(S.playing){ K.t+=dt*sp;
    if(K.t>=KSTEPS[K.step].d){ K.t=0; K.step++;
      if(K.step>=KSTEPS.length){ K.step=0; const n=Math.max(1,K.queue.length);
        K.cum.turns+=n; K.cum.acoa+=n; K.cum.co2+=2*n; K.cum.rnad+=3*n; K.cum.atp+=1*n;
        K.queue.shift(); K.queue.push({x:krbSlot(KG.q.shown-1)[0],y:-40}); } } }
  for(let i=0;i<K.queue.length;i++){ const q=K.queue[i], t=krbSlot(i);
    q.x+=(t[0]-q.x)*Math.min(1,dt*sp*2.2); q.y+=(t[1]-q.y)*Math.min(1,dt*sp*2.2); }
  for(const c of K.curls) c.age+=dt*sp*1.4; K.curls=K.curls.filter(c=>c.age<1); }
function kArrows(path,col,n){
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=2.6;ctx.setLineDash([7,7]);
  ctx.beginPath();path.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=col;
  for(let k=1;k<=n;k++){ const t=k/(n+1);
    const a=walk(path,Math.max(0,t-0.02)), b=walk(path,Math.min(1,t+0.02));
    const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
    ctx.beginPath();ctx.moveTo(b[0]+Math.cos(ang)*8,b[1]+Math.sin(ang)*8);
    ctx.lineTo(b[0]-Math.cos(ang-0.55)*8,b[1]-Math.sin(ang-0.55)*8);
    ctx.lineTo(b[0]-Math.cos(ang+0.55)*8,b[1]-Math.sin(ang+0.55)*8);ctx.closePath();ctx.fill(); }
  ctx.restore(); }
function kProdSlot(i){ return [KG.prod.x, KG.prod.y0+i*KG.prod.dy]; }
/* acetyl CoA drawn with proper bonds joining the symbols */
function drawAcetylUnit(x,y,sc,blue){ sc=sc||1;
  const g=14.5*sc, cx1=x-g/2, cx2=x+g/2, sq=x+g/2+20*sc;
  ctx.save();ctx.strokeStyle="rgba(210,225,235,.7)";ctx.lineWidth=3.2*sc;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(cx1,y);ctx.lineTo(cx2,y);ctx.stroke();          // C–C bond
  ctx.beginPath();ctx.moveTo(cx2,y);ctx.lineTo(sq-13*sc,y);ctx.stroke();     // bond to CoA
  ctx.restore();
  for(const cx of [cx1,cx2]){ ctx.beginPath();ctx.arc(cx,y,6.4*sc,0,6.29);
    ctx.fillStyle=blue?"#6cbdf0":"#6cbdf0";ctx.fill();
    ctx.strokeStyle="rgba(10,25,35,.55)";ctx.lineWidth=1.1*sc;ctx.stroke(); }
  drawCoA(sq,y,sc*0.95,false); }
function ringKind(i,st,f){
  if(st>=5) return ["oaa","cit6","c5","c4"][i];             // steady state once everything has moved on
  const decarb = st===4 || (st===3 && f>=0.12);
  const regen  = st===4 || (st===3 && f>=0.62);
  if(i===0) return (st>=2 || (st===1 && f>=0.45)) ? "cit6" : "oaa";
  if(i===1) return decarb ? "c5" : "cit6";

function drawKrb(){

function drawKrbEntry(st,f){

/* NAD starts in the middle of the ring, touches its molecule, then flies out

function drawKrbCoenzymes(st,f){
  const K=krb(), L=(a,b,u)=>a+(b-a)*u;
  const home=[[430,250],[430,288],[430,326]], tgt=[KSTA[1],KSTA[2],KSTA[3]], slot=[2,3,4];

    if(st===2){ const u=seg(f,0.06+i*0.09,0.95);                       // slow, clear approach
      pill(L(h[0],t[0],u), L(h[1],t[1]-22,u), "NAD", C_NAD, 10, true); }
    else { if(f<0.30){ pill(t[0],t[1]-22,"NAD",C_NAD,10,true);

      else if(f<w.a0){ cx=hold[i][0]; cy=hold[i][1]; }                 // lingers in the matrix
      else { const u=seg(f,w.a0,w.a1); cx=L(hold[i][0],d[0]-30,u); cy=L(hold[i][1],d[1],u); }

      ctx.strokeStyle="rgba(10,25,35,.55)";ctx.lineWidth=1.1;ctx.stroke();

  else { if(f<0.44){ pill(aL[0],aL[1],"ADP",C_ADP,10); pill(pR[0],pR[1],"Pi",PHOS,9.5); }
    else if(f<0.62){ const u=seg(f,0.44,0.62);                          // they come together on the 4C

      pill(L(pR[0],c4[0]+16,u), L(pR[1],c4[1]+22,u), "Pi", PHOS, 9.5);

/* products sit in the column, then drift right and fade at the end of the turn */

function anaSteps(){ const c=anaCfg(), S1=[

function anaIdx(){ const e=anaCfg().co2?1:0;

let ANA=null, ANAV=null;
function makeAna(){ return {step:0,t:0,curls:[],cum:{glucose:0,atp:0,prod:0,nad:0,co2:0},
  offs:[0], queue:[{x:AG.q.x0,y:AG.q.y}]}; }
function ana(){ if(!ANA || ANAV!==S.sub){ ANA=makeAna(); ANAV=S.sub; } return ANA; }
function anaSlot(i){ return [AG.q.x0+Math.min(i,AG.q.shown-1)*AG.q.dx, AG.q.y]; }
function anaTotalTime(){ return anaSteps().reduce((a,s)=>a+s.d,0); }
function anaElapsed(){ const A=ana(); let t=A.t; for(let i=0;i<A.step;i++) t+=anaSteps()[i].d; return t; }
function anaSeek(fr){ const A=ana(), ST=anaSteps(); let t=Math.max(0,Math.min(1,fr))*anaTotalTime();
  for(let i=0;i<ST.length;i++){ if(t<ST[i].d||i===ST.length-1){ A.step=i; A.t=Math.min(t,ST[i].d-0.001); break; } t-=ST[i].d; } }
function anaAt(prog){ const ST=anaSteps(); let t=((prog%1)+1)%1*anaTotalTime();
  for(let i=0;i<ST.length;i++){ if(t<ST[i].d) return {st:i,f:t/ST[i].d}; t-=ST[i].d; }
  return {st:ST.length-1,f:1}; }
function updateAna(dt){ const A=ana(), ST=anaSteps(), sp=S.speed*0.7, cfg=anaCfg();   // slower by default
  if(S.playing){ A.t+=dt*sp;
    if(A.t>=ST[A.step].d){ A.t=0; A.step++;
      if(A.step>=ST.length){ A.step=0; const n=A.offs.length;
        A.cum.glucose+=n; A.cum.atp+=2*n; A.cum.prod+=2*n; A.cum.nad+=2*n; if(cfg.co2) A.cum.co2+=2*n; } } }

function anaLead(){ const A=ana(); return anaAt(anaElapsed()/anaTotalTime()); }
function drawAna(){

function cPath(u,x0,y0,cx,cy,x1,y1){ const t=1-u;
  return [(t*t)*x0+2*t*u*cx+(u*u)*x1, (t*t)*y0+2*t*u*cy+(u*u)*y1]; }
function drawAnaCohort(prog,cfg,I,isP,lead,k){
  const A=ana(), {st,f}=anaAt(prog), L=(p,q,u)=>p+(q-p)*u, O=AG.off, sc=0.78;

    ctx.globalAlpha=fi; drawMol(AG.xGlu,MY,"glucose",sc);
    for(const i of TWO) pill(AG.atpIn[i][0],AG.atpIn[i][1],"ATP",ATP_IN,10);
    ctx.globalAlpha=1;
    for(const i of TWO) pill(AG.nadFrom[i][0],AG.nadFrom[i][1],"NAD",NAD_NEW,10); }   // carried over
  else if(st===I.inv){ const u=ez(f), x=L(AG.xGlu,AG.xHBP,u);
    for(const i of TWO) pill(AG.nadFrom[i][0],AG.nadFrom[i][1],"NAD",NAD_NEW,10);
    drawMol(x,MY, f<0.55?"glucose":"hbp",sc);
    for(const i of TWO){ const s0=AG.atpIn[i], tx=AG.xGlu-36+i*80, ty=MY+28;
      if(f<0.5){ const uu=seg(f,0.04+i*0.08,0.5);             // up and right, touching the glucose
        pill(L(s0[0],tx,uu), L(s0[1],ty,uu), "ATP", ATP_IN, 10); }
      else { const pu=seg(f,0.5,0.7);
        if(pu<1) drawP(L(tx,x,pu), L(ty,MY,pu), 0.9);
        const du=seg(f,0.5,1);                                  // away down-right as ADP, fading
        ctx.globalAlpha=Math.max(0,1-du*0.9);

  else if(st===I.split){ for(const i of TWO) pill(AG.nadFrom[i][0],AG.nadFrom[i][1],"NAD",NAD_NEW,10);
    if(f<0.35) drawMol(AG.xHBP,MY,"hbp",sc);
    else { const u=ez((f-0.35)/0.65);
      for(const d of [-O,O]) drawMol(L(AG.xHBP,AG.xTP,u),L(MY,MY+d,u),"tp3",sc); } }
  else if(st===I.nadPi){                                        // Pi and NAD both arrive from the LEFT
    for(const d of [-O,O]) drawMol(AG.xTP,MY+d, f<0.62?"tp3":"tp3b", sc);
    const u=seg(f,0.05,0.58);
    for(const i of TWO){
      if(f<0.68){ ctx.globalAlpha=f>0.6?Math.max(0,1-(f-0.6)/0.08):1;
        pill(L(AG.piFrom[i][0],AG.piDock[i][0],u), L(AG.piFrom[i][1],AG.piDock[i][1],u), "Pi", PHOS, 10);
        ctx.globalAlpha=1; }
      if(f<0.62) pill(L(AG.nadFrom[i][0],AG.nadDock[i][0],u), L(AG.nadFrom[i][1],AG.nadDock[i][1],u), "NAD", NAD_NEW, 10);
      else { const du=seg(f,0.62,1);                            // reduced, then eases DOWN out of the way

    ctx.textAlign="center";ctx.textBaseline="middle";

    ctx.fillText("SUBSTRATE-LEVEL PHOSPHORYLATION",300,468);ctx.restore();
    for(const i of TWO){ const pk=anaPark(k,i); pill(pk[0],pk[1],"reduced NAD",C_RNAD,10); }

  bo.textContent = S.noO2 ? "↩ Restore oxygen" : "🚫 No oxygen";
  bo.style.background = S.noO2 ? "#7fc7f0" : "#26323a"; bo.style.color = S.noO2 ? "#08202c" : "#cfe2ee";
  bc.textContent = S.cyanide ? "↩ Remove cyanide" : "☠ Add cyanide";
  bc.style.background = S.cyanide ? "#d94848" : "#3a2222"; bc.style.color = S.cyanide ? "#fff" : "#f5b8b8";
  const gb=document.getElementById("btn-glyall");
  gb.style.display = S.sub==="glycolysis" ? "" : "none";
  gb.textContent = S.glyAll ? "▶ Back to the animation" : "🔬 All substrates in position";
  const isGly = S.sub==="glycolysis" && !S.glyAll, isLnk = S.sub==="link", isKrb = S.sub==="krebs";
  const isAna = STAGES[S.sub].type==="anaer";
  document.getElementById("wrap-glytime").style.display = (isGly||isLnk||isKrb||isAna) ? "" : "none";
  syncDarkBtn(); syncCO2Btn();
  document.querySelector(".loc .pin").style.background=st.locColor;
}
function renderTally(){
  const st=STAGES[S.sub];
  const box=document.getElementById("tally");
  if(st.type==="anaer"){
    const A=ana(), isP=anaCfg().co2;
    const rows=[["G","glucose used","#e0a021",A.cum.glucose],
      ["\u26a1","ATP made (net)","#8b5cf6",A.cum.atp],
      [isP?"Et":"La",(isP?"ethanol":"lactate")+" made",anaCfg().prodCol,A.cum.prod],
      ["N","NAD regenerated","#cfc6e6",A.cum.nad]];
    if(isP) rows.push(["C","CO\u2082 made","#7a8a96",A.cum.co2]);
    box.innerHTML=rows.map(([ic,nm,col,v])=>'<div class="trow"><span class="ic" style="background:'+col+'">'+ic+'</span><span class="nm">'+nm+'</span><span class="ct">'+v+'</span></div>').join("");
    return;
  }
  if(st.type==="krebs"){
    const K=krb();
    const rows=[["Ac","acetyl CoA used","#6cbdf0",K.cum.acoa],
      ["\u03a3","turns completed","#e0a021",K.cum.turns],
      ["C","CO\u2082 made","#7a8a96",K.cum.co2],
      ["N","reduced NAD made","#6b21a8",K.cum.rnad],
      ["\u26a1","ATP made","#8b5cf6",K.cum.atp]];
    box.innerHTML=rows.map(([ic,nm,col,v])=>'<div class="trow"><span class="ic" style="background:'+col+'">'+ic+'</span><span class="nm">'+nm+'</span><span class="ct">'+v+'</span></div>').join("");
    return;
  }
  if(st.type==="linkr"){
    const K=lnk(), t=lnkTotals(K.step);
    const rows=[["C","CO\u2082 released","#7a8a96",t.co2],["N","reduced NAD","#6b21a8",t.rnad],
      ["Ac","acetyl CoA","#6d28d9",t.acoa],["\u26a1","ATP","#7d8f9c",0],
      ["\u03a3","pyruvate completed","#e0a021",K.cum.done]];
    box.innerHTML=rows.map(([ic,nm,col,v])=>'<div class="trow"><span class="ic" style="background:'+col+'">'+ic+'</span><span class="nm">'+nm+'</span><span class="ct">'+v+'</span></div>').join("");
    return;
  }
  if(st.type==="glyco"){
    const G=gly(), t=G.tot;
    const rows=[["\u26a1","ATP used","#8098a6",t.used],["\u26a1","ATP made","#8fd3f4",t.made],
      ["=","net ATP gain","#e0a021","+"+(t.made-t.used)],
      ["N","reduced NAD","#4c1d95",t.rnad],["P","pyruvate","#7c3aed",t.pyr]];
    box.innerHTML=rows.map(([ic,nm,col,v])=>'<div class="trow"><span class="ic" style="background:'+col+'">'+ic+'</span><span class="nm">'+nm+'</span><span class="ct">'+v+'</span></div>').join("");
    return;
  }
  if(st.type==="calvin"){
    const C=calvin(), P=C.pools;
    const rows=[["C","CO\u2082 fixed (turns)","#e0a021",C.fixed],
      ["R","RuBP (5C)","#159b8a",P.rubp],["G","GP (3C)","#e0a021",P.gp],
      ["T","triose phosphate","#7c3aed",P.tp],["\u2b50","glucose made","#2f9e5f",P.glucose],
      ["\u26a1","ATP available","#7c3aed",P.atp],["N","reduced NADP available","#4c1d95",P.nadph]];
    box.innerHTML=rows.map(([ic,nm,col,v])=>'<div class="trow"><span class="ic" style="background:'+col+'">'+ic+'</span><span class="nm">'+nm+'</span><span class="ct">'+v+'</span></div>').join("");
    return;
  }
  if(st.type==="chemi"){
    const cfg=CH_CFG[S.sub], C=chemiOf();
    const val={atp:C.totals.atp, term:C.totals.term, byp:C.totals.byp,
               lum:C.protons.filter(p=>p.state==="high").length};
    const ic={atp:"⚡",term:"★",byp:"○",lum:"H⁺"};
    box.innerHTML=cfg.tally.map(([k,nm,col])=>'<div class="trow"><span class="ic" style="background:'+col+'">'+ic[k]+'</span><span class="nm">'+nm+'</span><span class="ct">'+val[k]+'</span></div>').join("");
    return;
  }
  let data;
  if(st.type==="membrane"){
    // fixed theoretical summary
    data = st===STAGES.oxphos
      ? {atp:34,o2:6,h2o:12} // per glucose approx (from 10 NAD + 2 FAD; O2 used, water made) — display-oriented
      : {atp:"ATP",nadp:"✓",o2:"✓"};
  } else {
    data=currentTally();
  }
  // build rows for meta that appear in this stage
  const rows=[];
  const relevant = st.type==="membrane"
     ? (st===STAGES.oxphos?["atp","o2"]:["atp","nadp","o2"])
     : TALLY_META.map(m=>m[0]).filter(k=> st.steps.some(s=> s.yield && (k in s.yield)) );
  for(const [k,name,col] of TALLY_META){
    if(!relevant.includes(k)) continue;
    let v = data[k];
    let spent=false, display;
    if(st.type==="membrane"){
      if(st===STAGES.oxphos){ display = k==="atp" ? "≈34" : "→H₂O"; }
      else { display = k==="o2" ? "released" : "✓"; }
    } else {
      if(v==null) v=0;
      spent = v<0;
      display = (v>0?"+":"")+v;
    }
    const nm = (st===STAGES.calvin && k==="nadp") ? "reduced NADP (used)" :
               (k==="nad" && st.steps && spent) ? "NAD regenerated" : name;
    rows.push('<div class="trow '+(spent?"spent":"")+' '+((st.type!=="membrane"&&(!v))?"zero":"")+'">'
      +'<span class="ic" style="background:'+col+'">'+iconFor(k)+'</span>'
      +'<span class="nm">'+nm+'</span><span class="ct">'+display+'</span></div>');
  }
  box.innerHTML=rows.join("") || '<div class="fact">Watch the animation — this stage is about the mechanism, not a product count.</div>';
}
function iconFor(k){
  return {atp:"⚡",nad:"N",nadp:"N",fad:"F",co2:"C",o2:"O",acetyl:"Ac",pyr:"Py",tp:"TP",lactate:"La",ethanol:"Et",glucose:"G"}[k]||"•";
}

/* =======================================================================
   ANIMATION LOOP
   ======================================================================= */
function curStepIdx(st){
  if(st.type==="glyco") return gly().step;
  if(st.type==="linkr") return lnk().step;
  if(st.type==="krebs") return krb().step;
  if(st.type==="anaer") return ana().step;
  return -1;
}
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000; last=now;
  const st=STAGES[S.sub];
  const ffBefore = S.ff ? curStepIdx(st) : -1;
  if(S.ff) dt*=6;                                   // Step: race through, then stop at the next one
  if(S.playing){
    if(st.type==="path"){
      S.frac += dt*S.speed/1.5;
      if(S.frac>=1){ S.frac=0; S.step++; if(S.step>=st.steps.length){ S.step=0; } }
    } else if(st.type==="membrane"){
      S.t += dt*S.speed;
    }
  }
  if(st.type==="chemi"){
    if(!isGuided() || guidePlaying)updateChemi(dt);
  }
  else if(st.type==="calvin") updateCalvin(dt);
  else if(st.type==="anaer"){ updateAna(dt);
    if(S.playing){ const fr=anaElapsed()/anaTotalTime(), el=document.getElementById("s-glytime");
      if(el){ el.value=Math.round(fr*1000); document.getElementById("r-glytime").textContent=Math.round(fr*100)+"%"; } } }
  else if(st.type==="krebs"){ updateKrb(dt);
    if(S.playing){ const fr=krbElapsed()/krbTotalTime(), el=document.getElementById("s-glytime");
      if(el){ el.value=Math.round(fr*1000); document.getElementById("r-glytime").textContent=Math.round(fr*100)+"%"; } } }
  else if(st.type==="linkr"){ updateLnk(dt);
    if(S.playing){ const fr=lnkElapsed()/lnkTotalTime(), el=document.getElementById("s-glytime");
      if(el){ el.value=Math.round(fr*1000); document.getElementById("r-glytime").textContent=Math.round(fr*100)+"%"; } } }
  else if(st.type==="glyco"){ updateGly(dt);
    if(S.playing && !S.glyAll){ const fr=glyElapsed()/glyTotalTime();
      const el=document.getElementById("s-glytime");
      if(el){ el.value=Math.round(fr*1000); document.getElementById("r-glytime").textContent=Math.round(fr*100)+"%"; } } }
  st.step=S.step; // expose to draw
  enter();
  if(st.type==="chemi") drawChemi();
  else if(st.type==="calvin") drawCalvin();
  else if(st.type==="glyco") drawGly();
  else if(st.type==="linkr") drawLnk();
  else if(st.type==="krebs") drawKrb();
  else if(st.type==="anaer") drawAna();
  else st.draw(S.frac);
  // step bar
  if(st.type==="path"){
    document.getElementById("step-num").textContent="Step "+(S.step+1)+" / "+st.steps.length;
    document.getElementById("step-desc").textContent=st.steps[S.step].desc;
  } else if(st.type==="anaer"){
    const A=ana(), ST=anaSteps();
    document.getElementById("step-num").textContent="Step "+(A.step+1)+" / "+ST.length;
    document.getElementById("step-desc").textContent=ST[A.step].t;
  } else if(st.type==="krebs"){
    const K=krb();
    document.getElementById("step-num").textContent="Step "+(K.step+1)+" / "+KSTEPS.length;
    document.getElementById("step-desc").textContent=KSTEPS[K.step].t;
  } else if(st.type==="linkr"){
    const K=lnk();
    document.getElementById("step-num").textContent="Step "+(K.step+1)+" / "+LSTEPS.length;
    document.getElementById("step-desc").textContent=LSTEPS[K.step].t;
  } else if(st.type==="glyco"){
    const G=gly();
    document.getElementById("step-num").textContent = S.glyAll ? "Reference" : "Step "+(G.step+1)+" / "+GSTEPS.length;
    document.getElementById("step-desc").textContent = S.glyAll
      ? "Triose phosphate is oxidised (hydrogen \u2192 NAD) and takes up an inorganic phosphate, so it now carries two. Both phosphates are then passed straight to ADP, making 2 ATP per triose phosphate and leaving pyruvate."
      : GSTEPS[G.step].t;
  } else if(st.type==="calvin"){
    const P=calvin().pools;
    document.getElementById("step-num").textContent="CO\u2082 fixed: "+calvin().fixed;
    document.getElementById("step-desc").textContent = S.noCO2
      ? "With no CO\u2082, rubisco has nothing to fix, so RuBP is no longer used up. Triose phosphate keeps regenerating it, so RuBP builds up while GP falls to zero \u2014 the mirror image of the dark experiment."
      : S.dark
      ? "No ATP or reduced NADP is arriving. Reduction and regeneration stop; fixation continues until RuBP runs out, so GP builds up and RuBP falls \u2014 the classic dark experiment."
      : "Fixation: rubisco joins CO\u2082 to RuBP \u2192 2 GP.  Reduction: each GP + 1 ATP + 1 reduced NADP \u2192 TP (purple).  Regeneration: 5 TP + 3 ATP \u2192 3 RuBP.  Every 6th TP leaves \u2014 2 TP build one glucose.";
  } else if(st.type==="chemi"){
    document.getElementById("step-num").textContent = S.sub==="ldr" ? "Photophosphorylation" : "Chemiosmosis";
    document.getElementById("step-desc").textContent = S.sub!=="ldr"
      ? (S.cyanide ? "Cyanide is bound in complex IV, so electrons cannot reach oxygen. The chain backs up, H⁺ pumping stops, the gradient collapses and ATP synthesis stops. Reduced NAD cannot be reoxidised, so the Krebs cycle stops too."
        : S.noO2 ? "With no oxygen there is no final electron acceptor. Electrons back up along the chain, H⁺ pumping stops, the gradient collapses and ATP synthesis stops. Reduced NAD cannot be reoxidised, so the Krebs cycle stops too."
        : "Reduced NAD is oxidised to NAD, releasing electrons and H⁺. Complexes I, III and IV pump H⁺ into the intermembrane space; H⁺ diffuse back through ATP synthase (3 H⁺ per ATP). At complex IV, O₂ + 4e⁻ + 4H⁺ → 2H₂O.")
      : (S.dark
      ? "In the dark there is no photoionisation and no photolysis, so no electrons enter the chain. Nothing pumps H⁺, the gradient collapses, and once the lumen empties no more ATP is made. NADP stays bound to the reductase, unreduced."
      : "Press ☀ Shine light to split water. Electrons from photoionised chlorophyll travel the carrier chain, pumping H⁺ into the lumen; H⁺ diffuse and pass back down through ATP synthase (3 H⁺ per ATP). PSI passes electrons to NADP reductase → reduced NADP diffuses to the stroma.");
  } else {
    document.getElementById("step-num").textContent="Chemiosmosis";
    document.getElementById("step-desc").textContent = st===STAGES.ldr
      ? "Electrons from photoionised chlorophyll drive H⁺ into the thylakoid space; H⁺ flow back through ATP synthase to make ATP. Photolysis of water replaces the electrons and releases O₂."
      : "Reduced NAD and FAD feed electrons into the chain, pumping H⁺ into the intermembrane space; H⁺ flow back through ATP synthase to make ATP. Oxygen accepts the electrons, forming water.";
  }
  if(S.ff && curStepIdx(st)!==ffBefore){ S.ff=false; setRun(false); }
  renderTally();
  requestAnimationFrame(frame);
}

/* ---------- controls ---------- */
function setRun(on){ S.playing=on;
  document.getElementById("run-ic").textContent=on?"⏸":"▶";
  document.getElementById("run-tx").textContent=on?"Pause":"Play"; }
document.getElementById("btn-run").addEventListener("click",()=>setRun(!S.playing));
document.getElementById("btn-step").addEventListener("click",()=>{
  const st=STAGES[S.sub];
  if(st.type==="chemi"){ firePhotolysis(); return; }
  // Step: run the rest of this step quickly, then pause at the next one
  if(["glyco","linkr","krebs","anaer"].includes(st.type)){ S.ff=true; setRun(true); return; }
  setRun(false);
  if(st.type==="path"){ S.frac=0; S.step=(S.step+1)%st.steps.length; }
  else { S.t+=0.15; }
});
document.getElementById("btn-light").addEventListener("click",()=>firePhotolysis());
function syncDarkBtn(){
  const b=document.getElementById("btn-dark"), l=document.getElementById("btn-light");
  b.textContent = S.dark ? "☀ Switch to light" : "🌙 Switch to dark";
  b.style.background = S.dark ? "#f0c030" : "#2c3a4a";
  b.style.color = S.dark ? "#3a2e00" : "#dbe7f0";
  l.style.opacity = S.dark ? ".4" : "1";
  l.title = S.dark ? "No light available in the dark" : "";
}
function syncCO2Btn(){
  const b=document.getElementById("btn-co2");
  b.textContent = S.noCO2 ? "↩ Restore CO₂" : "🚫 Remove CO₂";
  b.style.background = S.noCO2 ? "#e0a021" : "#3a3126";
  b.style.color = S.noCO2 ? "#2a2000" : "#f0d7b6";
}
document.getElementById("btn-co2").addEventListener("click",()=>{ S.noCO2=!S.noCO2;
  if(S.noCO2) calvinClearCO2();
  syncCO2Btn(); refreshStatic(); });
document.getElementById("btn-glyall").addEventListener("click",()=>{ S.glyAll=!S.glyAll; refreshStatic(); });
document.getElementById("btn-noo2").addEventListener("click",()=>{ S.noO2=!S.noO2; if(S.noO2) S.cyanide=false; refreshStatic(); });
document.getElementById("btn-cn").addEventListener("click",()=>{ S.cyanide=!S.cyanide; if(S.cyanide) S.noO2=false; refreshStatic(); });
const sGT=document.getElementById("s-glytime");
sGT.addEventListener("input",()=>{ if(STAGES[S.sub].type==="anaer") anaSeek(+sGT.value/1000); else if(S.sub==="krebs") krbSeek(+sGT.value/1000); else if(S.sub==="link") lnkSeek(+sGT.value/1000); else glySeek(+sGT.value/1000);
  document.getElementById("r-glytime").textContent=Math.round(+sGT.value/10)+"%"; });
document.getElementById("btn-dark").addEventListener("click",()=>{
  S.dark=!S.dark; const C=CHEMI[S.sub]; if(S.dark&&C) C.flash=0; syncDarkBtn(); refreshStatic();
});
document.getElementById("btn-reset").addEventListener("click",()=>{ resetStage(); });
const sLit=document.getElementById("s-light");
sLit.addEventListener("input",()=>{S.lightI=(+sLit.value/100)*0.6;   // dimmer scale: 50% now gives the old 30%
  document.getElementById("r-light").textContent=sLit.value+"%";});
const sSpd=document.getElementById("s-speed");
sSpd.addEventListener("input",()=>{S.speed=+sSpd.value/100;document.getElementById("r-speed").textContent=S.speed.toFixed(1)+"×";});
document.querySelectorAll(".toptab").forEach(b=>b.addEventListener("click",()=>selectTop(b.dataset.top)));

guideMode.addEventListener("click",()=>{
  useGuide=!useGuide;
  if(isGuided())guideTo(0);
  else{
    guidePlaying=false;
    setRun(false);
    refreshGuide();
  }
});
guidePlay.addEventListener("click",()=>{
  guidePlaying=!guidePlaying;
  // Pulse light for the first two observations. Repeated pulses build the
  // gradient pupils follow in the third observation.
  setRun(guidePlaying && guideStep===OBSERVATIONS.length-1);
  if(!guideStarted){
    guideStarted=true;
    if(!S.playing)firePhotolysis();
  }
  guidePlay.textContent=guidePlaying?"Pause":"Resume";
  guideAnswer.hidden=false;
  guideNext.hidden=guideStep===OBSERVATIONS.length-1;
});
guideNext.addEventListener("click",()=>{guideTo(guideStep+1);guidePlay.focus();});
guideBack.addEventListener("click",()=>{guideTo(guideStep-1);guidePlay.focus();});
function boot(){
  buildSubtabs();
  guideTo(0);
  new ResizeObserver(size).observe(cv.parentElement);
  requestAnimationFrame(frame);
}
boot();
</script>
</body>
</html>
