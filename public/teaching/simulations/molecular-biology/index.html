<style>
:root{
  --bg:#0b1620; --panel:#122230; --panel2:#0e1c27; --line:#24404f;
  --txt:#dbe8f2; --dim:#8fa8b8; --accent:#e0a021;
  --A:#4ade80; --T:#f87171; --C:#60a5fa; --G:#fbbf24; --U:#c084fc;
  --old:#7fa8c9; --new:#e0954a; --rna:#c084fc;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
.wrap{max-width:1280px;margin:0 auto;padding:14px 16px 28px}
h1{font-size:19px;margin:0 0 2px;letter-spacing:.2px}
.sub{font-size:12.5px;color:var(--dim);margin:0 0 12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  padding:8px 15px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer}
.tab:hover{color:var(--txt)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#12212b}
.main{display:grid;grid-template-columns:1fr 296px;gap:14px}
@media(max-width:1080px){.main{grid-template-columns:1fr}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:10px}
canvas{width:100%;display:block;border-radius:9px}
.side{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 13px}
.card h3{margin:0 0 8px;font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim)}
.stepbar{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;margin-block:9px}
.stepnum{font-size:10.5px;font-weight:800;letter-spacing:.8px;color:var(--accent);text-transform:uppercase}
.stepdesc{font-size:1rem;line-height:1.55;margin:3px 0 0;max-width:60ch}
.step-detail summary,.gx-controls summary{cursor:pointer;font-weight:700;padding-block:.45em}
.gx-controls[hidden],.step-detail[hidden]{display:none}
.gx-controls details{margin-top:.5rem}
.gx-choices{display:flex;flex-wrap:wrap;gap:.45rem}
.gx-choices button{min-height:44px}
.gx-choices button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#12212b}
.gx-controls summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button.act:focus-visible,.tab:focus-visible,.step-detail summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ctrls{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:9px}
button.act{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer}
button.act:hover{border-color:#3c6274}
select.act{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  padding:7px 11px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;max-width:300px}
select.act:hover{border-color:#3c6274}
button.go{background:var(--accent);border-color:var(--accent);color:#12212b}
.ctrl{min-width:150px;flex:1}
.ctrl .head{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);
  font-weight:700;margin-bottom:2px}
input[type=range]{width:100%;accent-color:var(--accent)}
.trow{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12.5px}
.trow .ic{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-size:10px;font-weight:800;color:#0b1620;flex:none}
.trow .nm{flex:1;color:var(--dim)}
.trow .ct{font-weight:800;font-variant-numeric:tabular-nums}
ul.facts{margin:0;padding-left:16px;font-size:12.5px;line-height:1.5;color:var(--txt)}
ul.facts li{margin-bottom:5px}
.key{display:flex;gap:5px;flex-wrap:wrap;font-size:10.5px;font-weight:800}
.key span{padding:3px 7px;border-radius:5px;color:#0b1620}
.note{font-size:11.5px;color:var(--dim);line-height:1.45;margin-top:8px}
.back{display:inline-block;margin:0 0 14px;color:var(--dim);font-size:12.5px;text-decoration:none}
.back:hover{color:var(--txt);text-decoration:underline}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
@media(max-width:600px){.wrap{padding:14px 10px 24px}.tab{padding:7px 10px}.card{padding:10px}.ctrl{min-width:115px}}

<script>
/* =======================================================================
   Shared chassis
   ======================================================================= */
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
const CW=940, CH=560; let DPR=1, VS=1, OX=0, OY=0;
function size(){
  const w=cv.parentElement.clientWidth; DPR=window.devicePixelRatio||1;
  const h=Math.round(w*CH/CW);
  cv.style.height=h+"px"; cv.width=Math.round(w*DPR); cv.height=Math.round(h*DPR);
  VS=w/CW; OX=0; OY=0;
}
window.addEventListener("resize",size);
function enter(){ ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  const g=ctx.createLinearGradient(0,0,0,CH*VS); g.addColorStop(0,"#14252f"); g.addColorStop(1,"#0d1a24");
  ctx.fillStyle=g; ctx.fillRect(0,0,cv.width,cv.height); ctx.scale(VS,VS); }
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(w<2*r)r=w/2; if(h<2*r)r=h/2; this.beginPath();
    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); return this; };
}

const BASE={A:"#4ade80",T:"#f87171",C:"#60a5fa",G:"#fbbf24",U:"#c084fc"};
const RBASE={A:"#2c9159",C:"#2f6fbe",G:"#c08c07",U:"#8f4fc4"};   // RNA: a darker shade of the same
const OLD="#7fa8c9", NEW="#e0954a", RNAC="#c084fc";
function comp(b,rna){ if(b==="A") return rna?"U":"T"; if(b==="T") return "A";
  if(b==="U") return "A"; if(b==="C") return "G"; return "C"; }
function hbonds(b){ return (b==="C"||b==="G")?3:2; }
function ez(f){ f=Math.max(0,Math.min(1,f)); return f*f*(3-2*f); }
function seg(f,a,b){ return ez((f-a)/(b-a)); }
const L=(p,q,u)=>p+(q-p)*u;

/* a base drawn as a tab attached to a backbone */
/* stalkTo: the y of the backbone this nucleotide belongs to. The short bar is
   the sugar linking the base to it — the bars exist before the backbone does,
   and it is their tips that later get joined by phosphodiester bonds.        */
function drawBase(x,y,h,letter,dir,alpha,rna,stalkTo){
  ctx.save(); if(alpha!=null) ctx.globalAlpha=alpha;
  const w=24, top = dir>0 ? y : y-h, bot=top+h;
  if(stalkTo!=null){
    const anchor = Math.abs(stalkTo-top) < Math.abs(stalkTo-bot) ? top : bot;
    ctx.strokeStyle="#9fb4c4"; ctx.lineWidth=4.5; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(x,anchor); ctx.lineTo(x,stalkTo); ctx.stroke();
  }
  ctx.fillStyle=(rna?RBASE[letter]:BASE[letter])||"#7a8a96";
  ctx.strokeStyle="rgba(6,16,24,.55)"; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.roundRect(x-w/2,top,w,h,5); ctx.fill(); ctx.stroke();
  ctx.fillStyle="#0b1620"; ctx.font="800 13px system-ui";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(letter,x,top+h/2);
  ctx.restore();
}
function drawHBonds(x,y0,y1,n,alpha){
  ctx.save(); ctx.globalAlpha=alpha==null?1:alpha;
  ctx.strokeStyle="#8fb4c8"; ctx.lineWidth=1.4; ctx.setLineDash([2.5,2.5]);
  const span=(n-1)*5;
  for(let i=0;i<n;i++){ const xx=x-span/2+i*5;
    ctx.beginPath(); ctx.moveTo(xx,y0); ctx.lineTo(xx,y1); ctx.stroke(); }
  ctx.setLineDash([]); ctx.restore();
}
function drawBackbone(pts,col,lw){
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=lw||7; ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();
  ctx.restore();
}
/* a free nucleotide: phosphate + sugar + base */
function drawFreeNuc(x,y,letter,sc,alpha,rna){
  sc=sc||1; ctx.save(); if(alpha!=null) ctx.globalAlpha=alpha;
  ctx.strokeStyle="rgba(200,220,235,.5)"; ctx.lineWidth=2.4*sc; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(x-15*sc,y); ctx.lineTo(x+4*sc,y); ctx.stroke();
  ctx.beginPath(); ctx.arc(x-19*sc,y,5*sc,0,6.29); ctx.fillStyle="#ef7fa8"; ctx.fill();   // phosphate
  ctx.strokeStyle="rgba(6,16,24,.5)"; ctx.lineWidth=1; ctx.stroke();
  ctx.beginPath(); ctx.arc(x-6*sc,y,5.5*sc,0,6.29); ctx.fillStyle="#9fb4c4"; ctx.fill(); ctx.stroke();  // sugar
  ctx.fillStyle=(rna?RBASE[letter]:BASE[letter])||"#7a8a96";
  ctx.beginPath(); ctx.roundRect(x+3*sc,y-9*sc,20*sc,18*sc,4*sc); ctx.fill(); ctx.stroke();
  ctx.fillStyle="#0b1620"; ctx.font="800 "+(11*sc)+"px system-ui";
  ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(letter,x+13*sc,y);
  ctx.restore();
}
function enzyme(x,y,w,h,col,label,fs){
  // always fully opaque, whatever alpha the caller happened to leave set
  ctx.save(); ctx.globalAlpha=1; ctx.fillStyle=col; ctx.strokeStyle="#dbe7ef"; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.roundRect(x-w/2,y-h/2,w,h,11); ctx.fill(); ctx.stroke();
  ctx.fillStyle="#0b1620"; ctx.font="800 "+(fs||11)+"px system-ui";
  ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(label,x,y); ctx.restore();
}
function pill(x,y,txt,col,fs){
  fs=fs||10; ctx.save(); ctx.font="800 "+fs+"px system-ui";
  const w=ctx.measureText(txt).width+16, h=fs*2;
  ctx.fillStyle=col; ctx.strokeStyle="rgba(6,16,24,.5)"; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.roundRect(x-w/2,y-h/2,w,h,h/2); ctx.fill(); ctx.stroke();
  ctx.fillStyle="#0b1620"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(txt,x,y+0.5); ctx.restore();
}
function label(x,y,txt,col,fs,al){
  ctx.save(); ctx.font="800 "+(fs||11.5)+"px system-ui";
  ctx.textAlign=al||"center"; ctx.textBaseline="middle"; ctx.fillStyle=col; ctx.fillText(txt,x,y); ctx.restore();
}
function title(t,s){
  ctx.save(); ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle="#e9f3fa"; ctx.font="800 19px system-ui"; ctx.fillText(t,470,32);
  ctx.fillStyle="#8fa8b8"; ctx.font="700 12px system-ui"; ctx.fillText(s,470,54); ctx.restore();
}
function curl(x,y,age){
  ctx.save(); ctx.globalAlpha=Math.max(0,1-age); ctx.strokeStyle="#ffe14d"; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.arc(x,y,10+age*12,-0.9,1.5); ctx.stroke(); ctx.restore();
}

/* =======================================================================
   The gene used throughout
   ======================================================================= */
const GENE={
  //        exon 1   intron 1  exon 2   intron 2  exon 3
  tmpl:"TACGGA"+"TTTAAA"+"CGACTT"+"AAATTT"+"GCAATT",
  introns:[[6,12],[18,24]]
};
GENE.isIn=i=>GENE.introns.some(r=>i>=r[0]&&i<r[1]);
GENE.regions=(()=>{ const out=[]; let a=0;
  for(const r of GENE.introns){ out.push({a,b:r[0]-1,ex:1}); out.push({a:r[0],b:r[1]-1,ex:0}); a=r[1]; }
  out.push({a,b:24-1+6,ex:1}); return out; })();
GENE.coding=[...GENE.tmpl].map(b=>comp(b)).join("");
GENE.pre   =[...GENE.tmpl].map(b=>comp(b,true)).join("");
GENE.mrna  = [...GENE.pre].filter((_,i)=>!GENE.isIn(i)).join("");

/* =======================================================================
   TAB 1 — DNA REPLICATION
   ======================================================================= */
const RP={ n:12, x0:250, dx:52, bbX:210,
  yTopBB:130, yTopBase:[136,162], yNewTopBase:[178,204], yNewTopBB:210,
  // the two original strands sit further apart in the duplex, leaving a clear
  // channel for DNA helicase that does not cover either set of bases
  yDupTop:244, yDupTopBase:[250,276], yDupBotBase:[326,352], yDupBot:358,
  yNewBotBB:392, yNewBotBase:[398,424], yBotBase:[440,466], yBotBB:472,
  poolTop:[78,100], poolBot:[492,508] };
RP.top=GENE.tmpl.slice(0,RP.n);
RP.bot=[...RP.top].map(b=>comp(b)).join("");
RP.X=i=>RP.x0+i*RP.dx;
const RSTEPS=[
  {d:2.6,cue:"Find the base pairs that hold the two strands together.",t:"A section of a DNA molecule. The two strands are held together by hydrogen bonds between complementary base pairs \u2014 2 between A and T, 3 between C and G."},
  {d:4.4,cue:"Watch the two DNA strands separate at helicase.",t:"DNA helicase attaches. First it unwinds the double helix, then it breaks the hydrogen bonds so the two strands separate."},
  {d:6.0,cue:"Look for the free nucleotide that fits an exposed base.",t:"Free DNA nucleotides move about at random. One only binds when it happens to collide with an exposed base it is complementary to \u2014 the others bounce away. They are held on by hydrogen bonds, but are NOT yet joined to one another."},
  {d:8.0,cue:"Watch DNA polymerase join adjacent nucleotides.",t:"Only now does DNA polymerase act. It joins the nucleotides that are already base-paired, forming phosphodiester bonds between the sugar of one and the phosphate of the next, so a continuous new strand appears behind it."},
  {d:4.0,cue:"Watch the two DNA molecules separate.",t:"The two new molecules move apart and rewind into double helices. Two complete DNA molecules now exist where there was one."},
  {d:3.4,cue:"Find one original strand in each new DNA molecule.",t:"Each new molecule contains one original strand and one newly made strand \u2014 this is semi-conservative replication."}
];
let RPS=null;
function rp(){ if(!RPS) RPS={step:0,t:0,curls:[],cum:{bp:0,hb:0,nuc:0}}; return RPS; }
function rpTotal(){ return RSTEPS.reduce((a,s)=>a+s.d,0); }
function rpElapsed(){ const R=rp(); let t=R.t; for(let i=0;i<R.step;i++) t+=RSTEPS[i].d; return t; }
function rpSeek(fr){ const R=rp(); let t=Math.max(0,Math.min(1,fr))*rpTotal();
  for(let i=0;i<RSTEPS.length;i++){ if(t<RSTEPS[i].d||i===RSTEPS.length-1){ R.step=i; R.t=Math.min(t,RSTEPS[i].d-0.001); break; } t-=RSTEPS[i].d; } }
/* how far the fork has opened, and how many new nucleotides are in place */
/* made   = nucleotides hydrogen-bonded to the template
   joined = nucleotides linked by phosphodiester bonds, i.e. an actual strand.
   Nothing is ever joined before DNA polymerase is on the scene.            */
/* holds on each whole nucleotide, then snaps to the next: the new strand
   grows one phosphodiester bond at a time rather than creeping smoothly */
function stair(v){ const i=Math.floor(v); return i+ez(Math.min(1,(v-i)/0.32)); }
function rpProgress(st,f){
  if(st===0) return {open:0,made:0,joined:0};
  if(st===1) return {open:3*ez(Math.max(0,(f-0.62)/0.38)),made:0,joined:0};
  if(st===2) return {open:3,made:f<0.66?0:(f<0.92?1:2),joined:0};   // binds only on arrival
  if(st===3){ const u=ez(f), made=L(2,RP.n,Math.max(0,(u-0.06)/0.94));
    const jr=L(0,RP.n,Math.max(0,(u-0.14)/0.86));
    return {open:L(3,RP.n,u), made, joined:Math.min(made,stair(jr)) }; }
  return {open:RP.n,made:RP.n,joined:RP.n};
}
function updateRP(dt){ const R=rp();
  if(S.playing){ R.t+=dt*S.speed;
    if(R.t>=RSTEPS[R.step].d){ R.t=0; R.step++;
      if(R.step>=RSTEPS.length){ R.step=0; R.cum.bp+=RP.n; R.cum.hb+=[...RP.top].reduce((a,b)=>a+hbonds(b),0); R.cum.nuc+=2*RP.n; } } }
  for(const c of R.curls) c.age+=dt*S.speed*1.5; R.curls=R.curls.filter(c=>c.age<1);
}
/* deterministic wander so scrubbing the timeline stays stable */
/* Each nucleotide jitters gently about its own spot rather than sweeping the
   screen: still undirected, but calm enough to watch. */
function wander(k,t,box,n){
  n=n||8;
  const hx=box[0]+(box[2]-box[0])*((k+0.5)/n), hy=(box[1]+box[3])/2;
  const amp=(box[3]-box[1])*0.30;
  return [ hx + 11*Math.sin(t*0.42+k*1.9) + 5*Math.sin(t*0.25+k*3.1),
           hy + amp*Math.sin(t*0.33+k*2.4) ];
}
/* one duplex, tw=0 straight and tw=1 wound into a helix */
function duplexPair(x0,x1,yA,yB,colA,colB,tw){
  const mid=(yA+yB)/2, half=(yB-yA)/2, k=0.030, pa=[], pb=[];
  for(let x=x0;x<=x1;x+=5){ const c=tw*Math.cos(x*k)+(1-tw);
    pa.push([x,mid-half*c]); pb.push([x,mid+half*c]); }
  drawBackbone(pa,colA); drawBackbone(pb,colB);
  if(tw>0.03){ ctx.save(); ctx.globalAlpha=Math.min(1,tw*1.5);
    ctx.strokeStyle="#8fb4c8"; ctx.lineWidth=1.3;
    for(let x=x0+12;x<x1;x+=17){ const c=tw*Math.cos(x*k)+(1-tw);
      ctx.beginPath(); ctx.moveTo(x,mid-half*c); ctx.lineTo(x,mid+half*c); ctx.stroke(); }
    ctx.restore(); }
}
const FRAG=3, CYCLE=FRAG+1;      // 3 units of synthesis, then 1 unit jumping back
/* The lagging strand: DNA polymerase runs RIGHT to LEFT, away from the fork,
   then detaches and jumps back to the newly exposed template near the fork. */
function lagState(made,full,n){
  const nFrag=Math.ceil(n/FRAG);
  const units = full ? CYCLE*nFrag : Math.max(0,made-FRAG)*(CYCLE/FRAG);
  const complete = units >= CYCLE*nFrag;
  const frag = Math.min(Math.floor(units/CYCLE), nFrag-1);
  const s = complete ? CYCLE : Math.min(CYCLE-0.0001, units-frag*CYCLE);
  const start=frag*FRAG, end=Math.min(n-1,start+FRAG-1);
  const jumping = s>=FRAG && !complete;
  const laid = Math.min(end-start+1, Math.floor(s)+1);
  return {frag,s,start,end,jumping,laid,complete,nFrag};
}
function lagHas(i,LS){
  if(LS.complete) return true;
  if(i<LS.start) return true;                 // fragments already finished, further left
  if(i>LS.end) return false;                  // template not reached yet
  if(LS.jumping) return true;                 // this fragment is done
  return i >= LS.end-LS.laid+1;               // filled from the RIGHT end leftwards
}
function lagBasesDone(LS,n){ return LS.complete ? n : LS.start + (LS.jumping?(LS.end-LS.start+1):LS.laid); }
/* Beyond the AQA specification: leading and lagging strands. */
/* the gaps between Okazaki fragments: drawn BEFORE the enzymes so the dark
   blot never sits on top of the DNA polymerase or ligase */
function sealedFragsOf(LS){ return LS.complete ? LS.nFrag : Math.max(0,LS.frag-3); }
function drawOkazakiGaps(made,LS){
  if(made<=0.5) return;
  const sealedFrags=sealedFragsOf(LS);
  for(let j=1;j<=LS.frag;j++){ if(j<=sealedFrags) continue;
    const x=(RP.X(j*FRAG-1)+RP.X(j*FRAG))/2;
    ctx.save(); ctx.strokeStyle="#0f1d27"; ctx.lineWidth=9;
    ctx.beginPath(); ctx.moveTo(x-6,RP.yNewBotBB); ctx.lineTo(x+6,RP.yNewBotBB); ctx.stroke(); ctx.restore(); }
}
function drawOkazakiExtras(open,made,st,LS){
  ctx.save();
  ctx.fillStyle="rgba(90,40,110,.5)"; ctx.strokeStyle="#c07ad8"; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.roundRect(620,48,296,40,9); ctx.fill(); ctx.stroke();
  ctx.fillStyle="#e6c6f5"; ctx.font="800 10.5px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("BEYOND THE AQA SPECIFICATION",768,62);
  ctx.font="600 9.5px system-ui"; ctx.fillStyle="#cbb0dd";
  ctx.fillText("leading / lagging strands are not examinable on 7402",768,78);
  ctx.restore();
  if(made<=0.5) return;
  const sealedFrags=sealedFragsOf(LS);
  // one DNA ligase on each nick that has not yet been sealed
  for(let j=1;j<=LS.frag;j++){ if(j<=sealedFrags) continue;
    const x=(RP.X(j*FRAG-1)+RP.X(j*FRAG))/2;
    enzyme(x,RP.yNewBotBB-42,74,24,"#3fae8f","DNA ligase",9.5); }
  if(st<=3) label(470,532,"DNA polymerase works right \u2192 left on the lagging strand, then detaches and jumps back towards the fork","#e6c6f5",11.5);
}
/* antiparallel ends, top to bottom on the left: 3′ 5′ 3′ 5′ (reversed on the right) */
function drawPrimes(ys, rights){
  const P=["3′","5′","3′","5′"];
  for(let i=0;i<4;i++){ if(ys[i]==null) continue;
    label(190,ys[i],P[i],"#c3d4e0",11,"right");
    if(rights[i]!=null) label(rights[i]+20,ys[i],P[i]==="3′"?"5′":"3′","#c3d4e0",11,"left"); }
}
function drawRP(){
  const R=rp(), st=R.step, f=Math.min(1,R.t/RSTEPS[st].d), t=rpElapsed();
  const {open,made,joined}=rpProgress(st,f);
  const oi=Math.floor(open), mi=Math.floor(made);
  const forkX = RP.X(Math.min(open,RP.n-0.001)) - 8;
  const LS = lagState(made, st>=4, RP.n);
  const useOka = S.okazaki && st>=3;
  const finished = st>=4;                          // the two molecules have parted
  const split = finished ? (st===4?ez(f):1) : 0, shift = split*28;
  const wind = finished ? Math.max(0,(split-0.42)/0.58) : 0;   // winds only once the bases have gone
  const tw = st===0 ? 1 : (st===1 ? 1-ez(Math.min(1,f/0.42)) : 0);  // helicase unwinds first
  const intact = tw>0.02 || open<0.01;
  title("DNA replication","Nucleus \u00b7 semi-conservative");

  // free nucleotides drifting about, in both pools
  const poolAl = finished ? Math.max(0,1-split*2.6) : 1;   // clear away as the helices reform
  if(poolAl>0.02){
    const pools=[[276,RP.poolTop[0],632,RP.poolTop[1]],[300,RP.poolBot[0],836,RP.poolBot[1]]];
    const letters="ATCGTAGC";
    for(let k=0;k<5;k++){ const p=wander(k,t,pools[0],5); drawFreeNuc(p[0],p[1],letters[k],0.74,0.85*poolAl); }
    for(let k=0;k<5;k++){ const p=wander(k,t,pools[1],5); drawFreeNuc(p[0],p[1],letters[7-k],0.74,0.85*poolAl); }
    ctx.save(); ctx.globalAlpha=poolAl;
    label(126,92,"free DNA nucleotides","#7f97a8",10.5,"right"); ctx.restore(); }

  // ---- a nucleotide arriving for each new base as the fork advances ----
  if(st===3){ const nx=Math.floor(made);
    if(nx<RP.n){ const u=ez(Math.max(0,Math.min(1,made-nx)));
      const ty=L(RP.poolTop[1],RP.yNewTopBase[0]-4,u);
      const tv=Math.max(0,Math.min(1,(ty-RP.yTopBase[1]-4)/12));   // emerges below the template row
      drawFreeNuc(L(RP.X(nx)-30,RP.X(nx)-16,u), ty, comp(RP.top[nx]), 0.82, tv);
      if(!useOka){ const by2=L(RP.poolBot[0],RP.yNewBotBase[1]+4,u);
        const bv=Math.max(0,Math.min(1,(RP.yBotBase[0]-4-by2)/12));
        drawFreeNuc(L(RP.X(nx)-54,RP.X(nx)-16,u), by2, comp(RP.bot[nx]), 0.82, bv); } } }
  // ---- parent backbones: intact on the right, opened on the left ----
  if(finished){                                    // two complete molecules, moving apart and rewinding
    duplexPair(RP.bbX,905,RP.yTopBB-shift,RP.yNewTopBB-shift,OLD,NEW,wind);
    duplexPair(RP.bbX,905,RP.yNewBotBB+shift,RP.yBotBB+shift,NEW,OLD,wind);
  } else if(intact){                                // still one molecule: a helix that unwinds
    duplexPair(RP.bbX,905,RP.yDupTop,RP.yDupBot,OLD,OLD,tw);
  } else {
    drawBackbone([[RP.bbX,RP.yTopBB],[forkX-22,RP.yTopBB],[forkX,RP.yDupTop],[905,RP.yDupTop]],OLD);
    drawBackbone([[RP.bbX,RP.yBotBB],[forkX-22,RP.yBotBB],[forkX,RP.yDupBot],[905,RP.yDupBot]],OLD);
  }
  // ---- new backbones, only where nucleotides have been joined ----
  const jN=Math.floor(Math.min(joined,RP.n));         // whole nucleotides only
  if(jN>0 && !finished){ const endX=RP.X(jN-1)+14;
    drawBackbone([[RP.bbX,RP.yNewTopBB],[endX,RP.yNewTopBB]],NEW,6);
    if(st===3&&jN>1){ ctx.save(); ctx.globalAlpha=Math.max(0,1-(joined-jN)/0.32);
      ctx.strokeStyle="#ffe6b8"; ctx.lineWidth=7; ctx.lineCap="round";   // the newest bond, flashing
      ctx.beginPath(); ctx.moveTo(RP.X(jN-2),RP.yNewTopBB); ctx.lineTo(RP.X(jN-1),RP.yNewTopBB); ctx.stroke();
      if(!useOka){ ctx.beginPath(); ctx.moveTo(RP.X(jN-2),RP.yNewBotBB); ctx.lineTo(RP.X(jN-1),RP.yNewBotBB); ctx.stroke(); }
      ctx.restore(); }
    if(!useOka) drawBackbone([[RP.bbX,RP.yNewBotBB],[endX,RP.yNewBotBB]],NEW,6);
    else { // one continuous strand behind, plus the fragment being built
      let last=-1; for(let i=0;i<RP.n;i++) if(lagHas(i,LS)) last=i;
      const done=LS.complete?RP.n:LS.frag*FRAG;                  // bases in completed fragments
      if(done>0) drawBackbone([[RP.bbX,RP.yNewBotBB],[RP.X(Math.min(done,RP.n)-1)+16,RP.yNewBotBB]],NEW,6);
      if(!LS.complete && last>=done){ let lo=null;
        for(let i=done;i<=last;i++) if(lagHas(i,LS)&&lo===null) lo=i;
        if(lo!==null) drawBackbone([[RP.X(lo)-16,RP.yNewBotBB],[RP.X(last)+16,RP.yNewBotBB]],NEW,6); } } }

  const baseAl = st===0 ? 0 : (st===1 ? ez(Math.max(0,(f-0.44)/0.16)) : 1);
  const splitAl = finished ? Math.max(0,1-split/0.38) : 1;
  for(let i=0;i<RP.n;i++){
    const x=RP.X(i), tb=RP.top[i], bb=RP.bot[i];
    if(finished){                                       // bases fade as the molecules rewind
      if(splitAl>0.02){ ctx.save(); ctx.globalAlpha=splitAl;
        drawBase(x,RP.yTopBase[0]-shift,26,tb,1,1,false,RP.yTopBB-shift);
        drawBase(x,RP.yNewTopBase[1]-shift,26,comp(tb),-1,1,false,RP.yNewTopBB-shift);
        drawBase(x,RP.yNewBotBase[0]+shift,26,comp(bb),1,1,false,RP.yNewBotBB+shift);
        drawBase(x,RP.yBotBase[1]+shift,26,bb,-1,1,false,RP.yBotBB+shift);
        drawHBonds(x,RP.yTopBase[1]-shift,RP.yNewTopBase[0]-shift,hbonds(tb));
        drawHBonds(x,RP.yNewBotBase[1]+shift,RP.yBotBase[0]+shift,hbonds(bb)); ctx.restore(); }
      continue;
    }
    if(i>=open-0.5){                                    // still a double helix
      if(baseAl>0.02){ drawBase(x,RP.yDupTopBase[0],26,tb,1,baseAl,false,RP.yDupTop);
        drawBase(x,RP.yDupBotBase[1],26,bb,-1,baseAl,false,RP.yDupBot);
        drawHBonds(x,RP.yDupTopBase[1],RP.yDupBotBase[0],hbonds(tb),baseAl); }
    } else {                                            // separated: two templates
      drawBase(x,RP.yTopBase[0],26,tb,1,1,false,RP.yTopBB);
      drawBase(x,RP.yBotBase[1],26,bb,-1,1,false,RP.yBotBB);
      if(i<Math.floor(made)){                           // appears exactly when its nucleotide lands
        drawBase(x,RP.yNewTopBase[1],26,comp(tb),-1,1,false,RP.yNewTopBB);
        drawHBonds(x,RP.yTopBase[1],RP.yNewTopBase[0],hbonds(tb));
      }
      const hasLag = useOka ? lagHas(i,LS) : (i<Math.floor(made));
      if(hasLag){                                       // lagging strand: fragment by fragment
        drawBase(x,RP.yNewBotBase[0],26,comp(bb),1,1,false,RP.yNewBotBB);
        drawHBonds(x,RP.yNewBotBase[1],RP.yBotBase[0],hbonds(bb));
      }
    }
  }
  // ---- the rejection moment: a wrong nucleotide arrives, then the right one ----
  if(st===2){ const x=RP.X(0), need=comp(RP.top[0]);
    const wrong = need==="A" ? "G" : "A";
    if(f<0.38){ const u=seg(f,0.04,0.24), bk=f>0.24?seg(f,0.24,0.38):0;
      // one opacity for the nucleotide AND its caption: they fade in and out together
      const a=Math.min(seg(f,0.03,0.13), Math.max(0,1-bk*1.25));
      const yy=L(RP.yNewTopBase[0]-4,RP.yNewTopBase[0]-4,u)+bk*56;
      drawFreeNuc(L(x-168,x-16,u)+bk*136, yy, wrong, 0.9, a);
      if(a>0.02){ ctx.save(); ctx.globalAlpha=a;
        label(250,220,"not complementary","#ff9d95",11);
        label(250,233,"\u2014 it bounces off","#ff9d95",11); ctx.restore(); }
      if(f>0.22&&f<0.25) R.curls.push({x:x,y:RP.yNewTopBase[0]-6,age:0.4}); }
    else if(f<0.66){ const u=seg(f,0.40,0.99);                    // arrives, THEN binds at f = 0.66
      const cy1=L(RP.poolTop[1],RP.yNewTopBase[0]-4,u);
      drawFreeNuc(L(x-30,x-16,u), cy1, need, 0.9, Math.max(0,Math.min(1,(cy1-RP.yTopBase[1]-4)/12)));
      if(f>0.58){ label(250,220,"complementary \u2014 hydrogen bonds form","#9fe8bd",11);
        label(250,233,"but not yet joined to each other","#9fe8bd",11); } }
    else if(f<0.92){ const x2=RP.X(1), u=seg(f,0.68,0.99);        // and again for the next base
      const cy2=L(RP.poolTop[1],RP.yNewTopBase[0]-4,u);
      drawFreeNuc(L(x2-30,x2-16,u), cy2, comp(RP.top[1]), 0.9, Math.max(0,Math.min(1,(cy2-RP.yTopBase[1]-4)/12)));
      label(250,220,"complementary \u2014 hydrogen bonds form","#9fe8bd",11);
      label(250,233,"but not yet joined to each other","#9fe8bd",11); } }

  if(useOka) drawOkazakiGaps(made,LS);      // under the enzymes
  // ---- enzymes ----
  if(st>=1&&st<=3&&!intact||st===1&&tw<0.55){ const my=(RP.yDupTop+RP.yDupBot)/2;
    enzyme(forkX+4,my,90,36,"#3fae8f","");
    ctx.save();ctx.fillStyle="#0b1620";ctx.font="800 10.5px system-ui";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("DNA",forkX+4,my-8); ctx.fillText("helicase",forkX+4,my+7); ctx.restore(); }
  if(st===3){ const px=RP.X(Math.max(0,jN-1))+18;           // sits on the base it has just joined
    enzyme(px,RP.yNewTopBB+2,104,30,"#c07ad8","DNA polymerase \u2192",10);
    if(!S.okazaki) enzyme(px,RP.yNewBotBB-2,96,30,"#c07ad8","DNA polymerase",10);
    else if(!LS.complete){
      if(LS.jumping){                                    // detached, travelling back to the fork
        const nxtEnd=Math.min(RP.n-1,LS.start+2*FRAG-1), u=ez(LS.s-FRAG);
        const jx=L(RP.X(LS.start),RP.X(nxtEnd),u);
        enzyme(jx,RP.yNewBotBB-30,104,30,"#c07ad8","DNA polymerase",10);
        ctx.save(); ctx.strokeStyle="#c07ad8"; ctx.lineWidth=2; ctx.setLineDash([5,5]);
        ctx.beginPath(); ctx.moveTo(RP.X(LS.start),RP.yNewBotBB-46); ctx.lineTo(RP.X(nxtEnd),RP.yNewBotBB-46);
        ctx.stroke(); ctx.setLineDash([]); ctx.restore();
        label((RP.X(LS.start)+RP.X(nxtEnd))/2,RP.yNewBotBB-60,"detaches, jumps back","#e6c6f5",10);
      } else {
        const lx=RP.X(LS.end)-Math.min(LS.s,FRAG-1)*RP.dx;
        enzyme(lx,RP.yNewBotBB-2,104,30,"#c07ad8","\u2190 DNA polymerase",10);
      } } }

  if(st===3){ const jf=Math.floor(joined);
    if(R.lastJ!=null && jf===R.lastJ+1 && jf>0){
      R.curls.push({x:RP.X(jf-1)-14,y:RP.yNewTopBB-12,age:0});
      R.curls.push({x:RP.X(jf-1)-14,y:RP.yNewBotBB+12,age:0}); }
    R.lastJ=jf;
  } else R.lastJ=null;
  if(S.okazaki) drawOkazakiExtras(open,made,st,LS);
  // ---- labels ----
  const lblX = S.okazaki?168:200;
  label(lblX,finished?RP.yTopBB-shift:RP.yTopBB,"original strand",OLD,11,"right");
  label(lblX,finished?RP.yBotBB+shift:RP.yBotBB,"original strand",OLD,11,"right");
  if(joined>0.5){ label(lblX,finished?RP.yNewTopBB-shift:RP.yNewTopBB,S.okazaki?"leading strand":"new strand",NEW,11,"right");
    label(lblX,finished?RP.yNewBotBB+shift:RP.yNewBotBB,S.okazaki?"lagging strand":"new strand",NEW,11,"right"); }
  if(S.okazaki){ const nx = joined>0.5 ? RP.X(Math.min(joined,RP.n)-1)+14 : null;
    drawPrimes(
      finished ? [RP.yTopBB-shift,RP.yNewTopBB-shift,RP.yNewBotBB+shift,RP.yBotBB+shift]
               : [RP.yTopBB, joined>0.5?RP.yNewTopBB:null, joined>0.5?RP.yNewBotBB:null, RP.yBotBB],
      finished ? [905,905,905,905] : [905,null,null,905]); }   // growing ends get no 3\u2032 label
  if(st===4&&f>0.5) label(470,532,"the two molecules separate \u2014 one has become two","#ffd98a",12.5);
  if(st>=5) label(470,532,"each molecule has ONE original strand and ONE new strand \u2014 semi-conservative","#ffd98a",12.5);

  for(const c of R.curls) curl(c.x,c.y,c.age);
  ctx.save(); ctx.textAlign="left"; ctx.textBaseline="middle"; ctx.font="700 11px system-ui";
  ctx.fillStyle="#c3d4e0";
  ctx.fillText("base pairs opened "+Math.floor(open)+"    nucleotides added "+(2*Math.floor(made))+
    "    joined into a strand "+(2*Math.floor(joined))+"    molecules completed "+Math.round(R.cum.bp/RP.n), 76, 550);
  ctx.restore();
}

/* =======================================================================
   TAB 2 — TRANSCRIPTION
   ======================================================================= */
const TR={ n:GENE.tmpl.length, x0:146, dx:25, bbX:132, lblX:122,
  yTmplBB:134, yTmplBase:[140,164],
  yRnaBase:[174,198], yRnaBB:206,          // the RNA forms right against the template
  yPairBase:[232,256], yPairBB:264,        // 68px of hydrogen bonds \u2014 30% wider than before
  yOpenBB:424, yOpenBase:[390,414],        // and further still once pushed aside
  yTrailBB:474, yBracket:492,
  poolY:[72,86], polY:226 };               // polymerase sits beside the nascent strand
TR.X=i=>TR.x0+i*TR.dx;
const T_BASE=[
  {p:"intro", d:2.8,cue:"Find the template strand that will be copied.",t:"A gene on a DNA molecule. Only one of the two strands \u2014 the template strand \u2014 will be copied."},
  {p:"unwind",d:3.4,cue:"Look for the exposed bases on the template strand.",t:"The DNA opens locally as hydrogen bonds between the paired bases break. This exposes the bases on one strand, which acts as the template for RNA."},
  {p:"grow",  d:17.0,cue:"Follow the growing RNA strand behind RNA polymerase.",t:"RNA polymerase moves along the template strand. Four things are happening at once behind it: free RNA nucleotides hydrogen-bond to their complementary bases; a little further back they have been joined by phosphodiester bonds; further back the pre-mRNA has peeled off the template; and behind that the DNA has rewound."},
  {p:"finish",d:4.6,cue:"Watch pre-mRNA separate from DNA.",t:"Transcription is complete. The pre-mRNA separates fully from the DNA, and the DNA rewinds into a double helix. It still contains its introns \u2014 removing them is the next stage, on the splicing tab."}
];

function TS(){ return T_BASE; }
let TRS=null;
function tr(){ if(!TRS) TRS={step:0,t:0,curls:[],cum:{mrna:0,pre:0}}; return TRS; }
function trTotal(){ return TS().reduce((a,z)=>a+z.d,0); }
function trElapsed(){ const R=tr(), A=TS(); let t=R.t; for(let i=0;i<R.step;i++) t+=A[i].d; return t; }
function trSeek(fr){ const R=tr(), A=TS(); let t=Math.max(0,Math.min(1,fr))*trTotal();
  for(let i=0;i<A.length;i++){ if(t<A[i].d||i===A.length-1){ R.step=i; R.t=Math.min(t,A[i].d-0.001); break; } t-=A[i].d; } }
function trProgress(ph,f){
  if(ph==="intro")  return {pol:-1, open:0};
  if(ph==="unwind") return {pol:-1, open:ez(f)};        // opens in place, then travels
  if(ph==="grow")   return {pol:L(-1,TR.n+8,ez(f)), open:1};
  return {pol:TR.n+8, open:0};
}
function updateTR(dt){ const R=tr(), A=TS();
  if(S.playing){ R.t+=dt*S.speed;
    if(R.t>=A[R.step].d){ R.t=0; R.step++;
      if(R.step>=A.length){ R.step=0; R.cum.pre++;  } } }
  for(const c of R.curls) c.age+=dt*S.speed*1.5; R.curls=R.curls.filter(c=>c.age<1);
}
function isIntron(i){ return GENE.isIn(i); }
function bracket(x0,x1,y,txt,col,dir){
  dir=dir||1;                                  // dir -1 puts the bracket above the strand
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(x0,y-6*dir); ctx.lineTo(x0,y); ctx.lineTo(x1,y); ctx.lineTo(x1,y-6*dir);
  ctx.stroke(); ctx.restore(); label((x0+x1)/2,y+16*dir,txt,col,11);
}
function drawTR(){
  const R=tr(), A=TS(), st=R.step, ph=A[st].p, f=Math.min(1,R.t/A[st].d), t=trElapsed();
  const {pol,open}=trProgress(ph,f);
  const growing=(ph==="intro"||ph==="unwind"||ph==="grow");
  const finish=(ph==="finish");
  const done=!growing;
  const rew = finish ? ez(f) : (done?1:0);
  const wind = Math.max(0,(rew-0.42)/0.58);
  if(!S.bare) title("Transcription","Nucleus \u00b7 DNA \u2192 pre-mRNA");

  // free RNA nucleotides, cleared away once transcription has finished
  const poolAl = done ? Math.max(0,1-rew*1.8) : 1;
  if(poolAl>0.02){ const letters="AUCGUACG";
    for(let k=0;k<5;k++){ const q=wander(k,t,[286,TR.poolY[0],664,TR.poolY[1]],5);
      drawFreeNuc(q[0],q[1],letters[k],0.70,0.85*poolAl,true); }
    ctx.save(); ctx.globalAlpha=poolAl;
    if(!S.bare) label(TR.lblX,92,"free RNA nucleotides","#7f97a8",10.5,"right"); ctx.restore(); }

  // ---- zones trailing the polymerase ----
  const run0 = Math.max(2,46*open+2);     // a long shoulder, so a base descends gently
  const rawL = TR.X(pol-7*open)-15-run0, rawR = TR.X(pol+2*open)+15+run0;
  const bubL = Math.max(TR.bbX,rawL), bubR = Math.min(900,rawR);
  // the bubble disappears once it has run off either end, and the two shoulders
  // are never allowed to cross — which is what produced a figure-of-8
  const bub = !done && open>0.02 && rawL<898 && rawR>TR.bbX+2 && (bubR-bubL)>14;
  const run = bub?Math.max(2,Math.min(run0,(bubR-bubL)/2-1)):run0;
  const yLo = TR.yPairBB+(TR.yOpenBB-TR.yPairBB)*open;
  /* the y of the coding-strand backbone at any x — the single source of truth
     for both the drawn backbone and where each of its bases sits */
  const codY = x => { if(!bub||x<=bubL||x>=bubR) return TR.yPairBB;
    if(x<bubL+run) return TR.yPairBB+(yLo-TR.yPairBB)*(x-bubL)/run;
    if(x>bubR-run) return TR.yPairBB+(yLo-TR.yPairBB)*(bubR-x)/run;
    return yLo; };
  const sep      = i => bub && i>pol-7*open && i<=pol+2*open;
  const hasRNA   = i => done || i<=pol;
  const rnaJoined= i => done || i<=Math.floor(pol)-2;
  const peeled   = i => done || i<=pol-9.2;
  /* it only starts to dive once the bubble has closed behind it, so it never
     descends through the displaced coding strand */
  const rnaY = i => { if(done) return TR.yTrailBB;
    const d=(pol-9.2)-i; if(d<=0) return TR.yRnaBB;
    const u=Math.min(1,d/1.6); return TR.yRnaBB+(TR.yTrailBB-TR.yRnaBB)*(u*u*(3-2*u)); };

  // ---- DNA ----
  if(done){ duplexPair(TR.bbX,900,TR.yTmplBB,TR.yPairBB,"#a8cfe4",OLD,wind); }
  else {
    drawBackbone([[TR.bbX,TR.yTmplBB],[900,TR.yTmplBB]],"#a8cfe4");
    if(bub){ drawBackbone([[TR.bbX,TR.yPairBB],[bubL,TR.yPairBB],[bubL+run,yLo],
                    [bubR-run,yLo],[bubR,TR.yPairBB],[900,TR.yPairBB]],OLD); }

  ctx.fillStyle="#c3d4e0";

let MSS=null;

  let pairs; const St=(x,col,t,grow)=>({x,col,t,grow});

  else if(ph<0.20){ const u=ez(seg(ph,0.08,0.20));
    pairs=[[St(L(g1t[0][0],g1t[0][1],u),O,0),St(L(g1t[1][0],g1t[1][1],u),O,0)]]; }
  else if(ph<0.34){ const g=seg(ph,0.20,0.34);
    pairs=[[St(X1[0]-off,O,0),St(X1[0]+off,N2,0,g)],[St(X1[1]-off,N2,0,g),St(X1[1]+off,O,0)]]; }
  else if(ph<0.46) pairs=[[St(X1[0]-off,O,-1),St(X1[0]+off,N2,1)],[St(X1[1]-off,N2,-1),St(X1[1]+off,O,1)]];

/* chain   = amino acids joined so far

function tlProgress(st,f){
  if(st===0) return {p:0, chain:0, slide:1, from:-1, newestC:0, anchorC:0, pC:0, aC:1, arrive:1};
  if(st===1) return {p:0, chain:f>=0.82?1:0, slide:1, from:-1, newestC:0, anchorC:0, pC:0, aC:1, arrive:1};
  if(st===2) return {p:0, chain:1, slide:1, from:-1, newestC:0, anchorC:0, pC:0, aC:1, arrive:1};
  if(st===3) return {p:0, chain:2, slide:seg(f,0.26,0.78), from:0, newestC:1, anchorC:1, pC:0, aC:1, arrive:1};
  if(st===4) return {p:ez(f), chain:2, slide:1, from:0, newestC:1, anchorC:1, pC:0, aC:1, arrive:1};
  if(st===5){ const u=ez(f), bf=u*(TL.nc-3), k=Math.floor(bf), q=bf-k;
    // each cycle: the tRNA docks, THEN the bond forms, THEN the ribosome moves on
    const on=q>0.40, cap=c=>Math.min(TL.nc-2,c);
    return {p:L(1,TL.nc-2,u), chain:Math.min(TL.nc-1,2+k+(on?1:0)),
      slide:on?seg(q,0.40,0.78):1, from:1+k, newestC:cap(on?2+k:1+k),
      anchorC:cap(1+k+seg(q,0.72,1.0)), bond:bf,
      pC:cap(1+k), aC:Math.min(TL.nc-1,2+k), arrive:seg(q,0.02,0.38)}; }
  return {p:TL.nc-2, chain:TL.nc-1, slide:1, from:TL.nc-3, newestC:TL.nc-2, anchorC:TL.nc-2,
    pC:TL.nc-2, aC:TL.nc-1, arrive:1};

function drawTL(){
  const T2=tl(), st=T2.step, f=Math.min(1,T2.t/LSTEPS[st].d);

  const pSiteAA=[TL.cx(newestC),aaY];
  const rel = st===6 ? seg(f,0.52,1) : 0, relX=-rel*306, relY=-rel*32;   // floats clear, stays fully visible
  const nAA=Math.max(0,Math.min(chain,TL.nc-1)), nDrawn=Math.max(0,nAA-1);

    else if(f<0.82){ const u=seg(f,0.52,0.80);

    if(nDrawn>0 && !S.dirs){ const lx=Math.max(80,pts[0][0]-18);

    if(rel>0) ctx.restore();

  label(924,90,"free tRNA, each carrying its amino acid","#7f97a8",10.5,"right");
  label(TL.X(0)-74,TL.yMrnaBB,"mRNA",RNAC,11,"right");

function spSetView(v){
  const was={cap:S.spCap,alt:S.spAlt};
  S.spView=v; S.spCap=!!SPVIEWS[v-1].cap; S.spAlt=!!SPVIEWS[v-1].alt;
  const R=sp(), A=spSteps();
  const jump = (S.spAlt&&!was.alt) ? "alt" : (S.spCap&&!was.cap) ? "cap" : null;
  if(jump){ const i=A.findIndex(z=>z.p===jump); if(i>=0){ R.step=i; R.t=0; } setRun(false); }
  else if(R.step>=A.length){ R.step=A.length-1; R.t=0; }

function spDrawStrand(y,q,alt,scale,lab){
  scale=scale==null?1:scale; lab=lab!==false;
  // how many intron bases lie before base i — the exons close up over them
  const before=i=>{ let n=0; for(let k=0;k<i;k++) if(alt? spAltOut(k) : isIntron(k)) n++; return n; };
  const out = alt ? spAltOut : isIntron;
  const segs=[];
  for(const r of GENE.regions){
    const rem = alt ? out(r.a) : !r.ex;
    segs.push({a:r.a,b:r.b,rem}); }
  // backbone, coloured by region
  for(const g of segs){
    const off = -q.join*before(g.a)*TR.dx;
    const up  = g.rem ? -(q.cut*36 + q.rel*76)*scale : 0;   // excised pieces drop away below
    const al  = g.rem ? Math.max(0,1-q.rel*1.3) : 1;
    if(al<0.02) continue;
    const col = q.lift>0.45 ? (g.rem?INC:EXC) : RNAC;
    ctx.save(); ctx.globalAlpha=al; ctx.strokeStyle=col; ctx.lineWidth=7; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(TR.X(g.a)-13+off,y-up); ctx.lineTo(TR.X(g.b)+13+off,y-up); ctx.stroke(); ctx.restore();
    for(let i=g.a;i<=g.b;i++) drawBase(TR.X(i)+off, y-up-8, 24, GENE.pre[i], -1, al, true, y-up);
    if(q.lift>0.45 && (!g.rem||q.rel<0.9) && lab){
      const cx2=(TR.X(g.a)+TR.X(g.b))/2+off;
      label(cx2, y-up+30, g.rem?"intron":"exon", g.rem?INC:"#c9b6f5", 10.5);
      if(g.rem&&q.rel<0.5) label(cx2, y-up+44, "to be removed", INC, 9.5); }
  }
  // the cuts
  if(q.cut>0.02&&q.rel<0.15){ ctx.save(); ctx.strokeStyle="#ffd98a"; ctx.lineWidth=2.4;
    for(const g of segs){ if(!g.rem) continue;
      for(const xx of [TR.X(g.a)-14,TR.X(g.b)+14]){
        ctx.beginPath(); ctx.moveTo(xx,y-26); ctx.lineTo(xx,y+22); ctx.stroke(); } }
    ctx.restore(); }
}

/* A nucleosome. The DNA is drawn as a spiral that drifts sideways as it turns, so the
   two turns can be told apart, and the front of the coil is semi-transparent so the
   charge on the histone core still shows through.                                   */
/* ONE continuous DNA molecule threaded through a whole row of nucleosomes: it wraps
   around each histone core and runs straight between them, so the strand is never
   broken.  wrap 0 = the same molecule, still straight.                              */
function gxFibrePath(P,R,wrap,turns){
  turns=turns||1.5;
  const A=R*0.95, B=R*0.82, D=R*0.42, steps=54, tail=R*1.3;
  const pts=[];
  for(let k=0;k<P.length;k++){
    const bx=P[k][0], by=P[k][1];
    if(k===0) pts.push({x:bx-D-A-tail,y:by,f:false});
    else pts.push({x:P[k-1][0]+D+A,y:P[k-1][1],f:false});
    for(let i=0;i<=steps;i++){
      const s2=i/steps, ang=Math.PI+s2*turns*2*Math.PI;
      pts.push({x:bx-D+2*D*s2+A*Math.cos(ang), y:by+B*Math.sin(ang), f:Math.sin(ang)>0}); } }
  const lb=P[P.length-1];
  pts.push({x:lb[0]+D+A+tail,y:lb[1],f:false});
  const x0=pts[0].x, x1=pts[pts.length-1].x, y0=P[0][1], y1=lb[1];
  return pts.map((q,i)=>{ const s2=i/(pts.length-1);
    return {x:L(x0+(x1-x0)*s2,q.x,wrap), y:L(y0+(y1-y0)*s2,q.y,wrap), f:q.f}; });
}

/* ---------- view 3: epigenetics ---------- */
function gxMinus(P,gap,al){
  ctx.save(); ctx.globalAlpha=al==null?1:al;
  ctx.fillStyle="#8fd0f0"; ctx.font="800 13px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("\u2013",P[0][0]-gap*0.62,P[0][1]-14);
  ctx.fillText("\u2013",P[P.length-1][0]+gap*0.62,P[P.length-1][1]-14);
  ctx.restore();
}
function gxDrawEpi(st,f,t){
  title("Epigenetic control","Histone acetylation and DNA methylation \u00b7 AQA 3.8.2.2");
  const cx=430;
  if(st<=1){                                    // build one nucleosome
    const core = st===0 ? 0 : Math.min(1,f/0.22);
    const wrap = st===0 ? 0 : ez(Math.max(0,Math.min(1,(f-0.22)/0.62)));
    gxNuc(cx,286,76,wrap,{len:520,lw:6,charge:1,coreAl:core});
    label(cx,150,st===0?"a DNA double helix":(core<0.99?"a core of eight histone proteins":"the DNA winds almost twice around it"),"#a8cfe4",12.5);
    if(st===0) label(cx,410,"negatively charged, because of its phosphate groups","#8fd0f0",11.5);
    else { if(core>0.6) label(cx,404,"the histones are positively charged","#c9a6f0",11.5);
      if(wrap>0.8){ label(cx,432,"opposite charges attract, so the DNA is held on","#a8cfe4",11.5);
        label(cx,460,"DNA + histones = a NUCLEOSOME","#ffd98a",13); } }
    gxRate(1,"high"); return; }
  if(st===2){                                   // repeat into chromatin
    const u=ez(Math.min(1,f/0.62));
    const nb=u<0.34?1:u<0.68?3:5;
    gxBeadString(cx,282,nb,L(210,118,u),L(76,30,u),{lw:5,charge:1});
    label(cx,158,"nucleosomes repeat all along the DNA","#a8cfe4",12.5);
    if(u>0.72){ label(cx,378,"the DNA between them is linker DNA","#a8cfe4",11.5);
      label(cx,406,"DNA + histones together = CHROMATIN","#ffd98a",13); }
    gxRate(1,"high"); return; }
  // ---- the two routes ----
  const meC = st===6 ? ez(Math.min(1,f/0.40)) : 0;               // methyl groups going on
  const acet = st===4 ? 1-ez(Math.min(1,f/0.42)) : 1;            // acetyl groups coming off
  const coil = st===4 ? ez(Math.max(0,seg(f,0.46,0.90)))
             : st===5 ? 1-ez(Math.min(1,f/0.7))
             : st===6 ? ez(Math.max(0,seg(f,0.34,0.88))) : (st===7?1:0);
  const n=5, y=292, gap=100, r=26;
  const P=gxBeadPos(cx,y,n,gap,r,coil);
  const spread=51*(1-coil);
  for(let i=0;i<n;i++) P[i][0]+= i<=2 ? -spread : spread;
  const pm=[(P[2][0]+P[3][0])/2,(P[2][1]+P[3][1])/2];
  const eL=P[2][0]+r*1.37, eR=P[3][0]-r*1.37;                   // the linker carrying the promoter
  gxDrawFibre(P,r,1,{lw:4.5,cond:acet<0.5,charge:1,acet:acet*Math.max(0,1-coil*2.2),
    mid:()=>{
      ctx.save(); ctx.strokeStyle="#e0a021"; ctx.lineWidth=4.5; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(eL,P[2][1]); ctx.lineTo(eR,P[3][1]); ctx.stroke(); ctx.restore();
      if(meC>0.04){ ctx.save(); ctx.globalAlpha=meC;
        const w2=eR-eL, nMe=Math.max(1,Math.min(5,Math.floor(w2/17)));
        for(let k=0;k<nMe;k++) gxTag(eL+w2*(k+0.5)/nMe,(P[2][1]+P[3][1])/2-15,"Me","#ffd98a",6.2);
        ctx.restore(); }
      if(coil<0.5) gxMinus(P,gap,0.9*(1-coil*2)); } });
  if(coil<0.4) label(pm[0],y+56,"promoter region","#e0a021",11);
  label(cx,y+96,"the DNA is negatively charged \u2013   the histones are positively charged +","#9fb8c9",11);
  if(st===3||st===4) label(cx,y+118, acet>0.5
    ? "acetyl groups (Ac) reduce the positive charge, so the DNA is held less tightly"
    : "no acetyl groups \u2014 the histones are more positive and hold the DNA tightly",
    acet>0.5?"#7ef2b0":"#ff9d95",11);
  if(st===6||st===7) label(cx,y+118,"methyl groups (Me) are added to cytosine bases in the DNA","#ffd98a",11);
  if(coil>0.55) label(cx,y+140,"the chromatin condenses and supercoils","#ff9d95",11);
  // one transcription factor, always the right shape: it can reach the promoter or it cannot
  const cyc=(t*0.40)%1, appr=ez(Math.min(1,cyc/0.5)), away=cyc>0.55?ez(seg(cyc,0.55,1)):0;
  const open2 = coil<0.4 && meC<0.25;
  const reach = open2 ? pm[1]-46 : pm[1]-116;
  const d=wander(0,t,[178,128,318,152],2);
  const fx=L(d[0],pm[0],appr), fy=L(L(d[1],reach,appr),140,away);
  gxFactor(fx,fy,true,false,false,"#e0a021");
  if(st===3){ label(760,160,"its binding site and the promoter","#e0a021",11);
    label(760,175,"region are the same colour","#e0a021",11); }
  if(cyc>0.5&&cyc<0.9){
    if(open2) gxYes(760,206,"it binds the promoter region","transcription is activated");
    else gxNo(760,206,"it cannot bind to the promoter region,","so transcription is not activated"); }
  const rate = 1-0.85*coil;
  gxRate(rate, rate>0.75?"high":rate>0.4?"reduced":"low");
  if(st===7) label(470,528,"the base sequence has not changed \u2014 both changes are epigenetic","#e6c6f5",12);
}

const GXSI={ x0:196, dx:31, mY:242, sY:364 };
GXSI.seq=GENE.mrna; GXSI.a=5; GXSI.b=12;
GXSI.si=[...GENE.mrna.slice(5,13)].map(b=>comp(b,true)).join("");
GXSI.X=i=>GXSI.x0+i*GXSI.dx;
function gxDrawSi(st,f,t){
  title("Post-transcriptional control \u2014 RNA interference","RNAi \u00b7 AQA 3.8.2.2");
  const n=GXSI.seq.length;
  const cut = st>=5 ? (st===5?ez(Math.max(0,seg(f,0.45,1))):1) : 0;
  const bound = st>=4 ? ez(Math.min(1,f/0.72)) : 0;
  const shift = i => cut*( i<GXSI.a ? -44 : i>GXSI.b ? 44 : (i<9?-14:14) );
  ctx.save(); ctx.strokeStyle=RNAC; ctx.lineWidth=7; ctx.lineCap="round";
  const runs = cut>0.02 ? [[0,GXSI.a-1],[GXSI.a,8],[9,GXSI.b],[GXSI.b+1,n-1]] : [[0,n-1]];
  for(const [a,b] of runs){ ctx.beginPath();
    ctx.moveTo(GXSI.X(a)-14+shift(a),GXSI.mY); ctx.lineTo(GXSI.X(b)+14+shift(b),GXSI.mY); ctx.stroke(); }
  ctx.restore();
  for(let i=0;i<n;i++) drawBase(GXSI.X(i)+shift(i),GXSI.mY+8,24,GXSI.seq[i],1,1,true,GXSI.mY);
  label(GXSI.x0-24,GXSI.mY-30,"mRNA",RNAC,11.5,"right");
  const drawSi=(y2,dbl)=>{ ctx.save(); ctx.strokeStyle="#f0a3c8"; ctx.lineWidth=6; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(GXSI.X(GXSI.a)-14,y2); ctx.lineTo(GXSI.X(GXSI.b)+14,y2); ctx.stroke();
    if(dbl){ ctx.beginPath(); ctx.moveTo(GXSI.X(GXSI.a)-14,y2+26); ctx.lineTo(GXSI.X(GXSI.b)+14,y2+26); ctx.stroke(); }
    ctx.restore();
    label(GXSI.X(GXSI.a)-26,y2+(dbl?13:0),dbl?"siRNA (double-stranded)":"siRNA","#f0a3c8",11,"right"); };
  if(st===1){ const d=wander(4,t,[300,452,660,486],3); drawSi(d[1],true); }
  else if(st===2){ const u=ez(Math.min(1,f/0.66)), d=wander(4,t,[300,452,660,486],3);
    drawSi(470,true);
    enzyme(L(886,GXSI.X(GXSI.b)+118,u),483,128,34,"#3fae8f","interference",11);
    if(u>0.96) gxYes(470,410,"the protein binds the siRNA","");
  } else if(st===3){ const y2=L(470,GXSI.sY+70,ez(f));
    drawSi(y2,f<0.5); enzyme(GXSI.X(GXSI.b)+118,y2+(f<0.5?13:0),128,34,"#3fae8f","interference",11); }
  else if(st>=4){ const y2=L(GXSI.sY+70,GXSI.sY,bound);
    drawSi(y2,false);
    for(let i=0;i<GXSI.si.length;i++) drawBase(GXSI.X(GXSI.a+i),y2-8,24,GXSI.si[i],-1,1,true,y2);
    if(bound>0.94) for(let i=0;i<GXSI.si.length;i++)
      drawHBonds(GXSI.X(GXSI.a+i)+shift(GXSI.a+i),GXSI.mY+32,y2-32,2);
    enzyme(GXSI.X(GXSI.b)+118,y2,128,34,"#3fae8f","interference",11); }
  if(st===4&&bound>0.94) gxYes(470,150,"complementary base pairing holds it on the mRNA","");
  if(st===5){ const u=ez(Math.min(1,f/0.4));
    enzyme(L(872,GXSI.X(9),u),GXSI.mY-64,130,32,"#e0743f","RNA hydrolase",10.5);
    if(u>0.96) label(470,150,"the mRNA is cut into fragments","#ff9d95",11.5); }
  if(st>=6) label(470,150,"the mRNA is cut into fragments","#ff9d95",11.5);
  if(st>=6) label(470,186,"no polypeptide is made \u2014 the gene has been silenced","#ff9d95",12.5);
  gxRate(cut>0.5?0.02:1, cut>0.5?"translation blocked":"can be translated");
}

/* =======================================================================

const STAGES={
  replication:{ name:"DNA replication", type:"rp",
    facts:["DNA helicase breaks the hydrogen bonds between complementary bases.",
      "Each original strand acts as a template.",
      "Free nucleotides bind only where they are complementary \u2014 A with T, C with G.",
      "DNA polymerase joins adjacent nucleotides with phosphodiester bonds.",
      "Each new molecule has one original and one new strand: semi-conservative."],
    note:"AQA does not require leading and lagging strands, so both new strands are shown being built continuously." },
  meselson:{ name:"Meselson\u2013Stahl", type:"ms",
    facts:["Bacteria are grown so that all their DNA contains one isotope of nitrogen.",
      "They are then moved to a medium containing only the other isotope.",
      "After one generation all the DNA is intermediate in density.",
      "After that, only two molecules ever contain an original strand.",
      "Denser DNA settles lower down; less dense DNA settles higher up."],
    note:"Use the toggle to start the bacteria on either isotope \u2014 the pattern mirrors." },
  splicing:{ name:"Splicing", type:"sp",
    facts:["Eukaryotic transcription makes pre-mRNA, which contains introns.",
      "Introns are cut out at both ends and released.",
      "The exons left behind are joined to form mature mRNA.",
      "Only the exons code for part of the polypeptide.",
      "Prokaryotes have no introns, so no splicing is needed."],
    note:"Four views: splicing alone, or with the 5\u2032 cap and poly(A) tail, alternative splicing, or both." },
  genex:{ name:"Gene expression", type:"gx",
    facts:["A transcription factor binds the promoter region so RNA polymerase can start transcription.",
      "Oestrogen is lipid-soluble; it binds a receptor site on a transcription factor.",
      "Increased DNA methylation or decreased histone acetylation switches a gene off.",
      "Epigenetic changes do not alter the base sequence of the DNA.",
      "siRNA binds a protein, then guides it to a matching mRNA, which is cut up so it cannot be translated."],
    note:"Four views: transcription factors, oestrogen, epigenetics, and siRNA." },
  translation:{ name:"Translation", type:"tl",
    facts:["mRNA binds to a ribosome, which holds two codons at a time.",
      "Each tRNA has an anticodon and carries one specific amino acid.",
      "A tRNA only binds if its anticodon is complementary to the codon.",
      "ATP supplies energy to attach an amino acid to its matching tRNA. The ribosome then catalyses peptide-bond formation.",
      "At a stop codon no tRNA binds, so the polypeptide is released."],
    note:"ATP is used to attach amino acids to tRNAs before they enter the ribosome." },
  transcription:{ name:"Transcription", type:"tr",
    facts:["Only the template strand is copied; the coding strand is not.",
      "RNA polymerase joins the RNA nucleotides together with phosphodiester bonds.",
      "In RNA, uracil pairs with adenine instead of thymine.",
      "Eukaryotes make pre-mRNA, which is spliced to remove introns.",
      "Splicing joins the exons together to form mature mRNA."],
    note:"The RNA is shown forming on the template strand, then peeling away behind the polymerase." }
};
const ORDER=["replication","meselson","transcription","splicing","translation","genex"];
const S={ sub:"replication", playing:false, speed:1.0, okazaki:false, msHeavy:true, dirs:false,
  spView:1, spCap:false, spAlt:false, gxView:1, bare:false, ff:false };

const tabsEl=document.getElementById("tabs");
ORDER.forEach(k=>{ const b=document.createElement("button");
  b.className="tab"; b.textContent=STAGES[k].name; b.dataset.k=k;
  b.addEventListener("click",()=>select(k)); tabsEl.appendChild(b); });

function select(k){ S.sub=k;
  [...tabsEl.children].forEach(b=>b.classList.toggle("on",b.dataset.k===k));
  if(k==="replication") RPS=null; else if(k==="transcription") TRS=null;
  else if(k==="translation") TLS=null; else if(k==="splicing") SPS=null;
  else if(k==="genex") GXS=null; else MSS=null;
  setRun(false); refresh();
}
function STEPS(){ return S.sub==="replication"?RSTEPS : S.sub==="transcription"?TS() : S.sub==="translation"?LSTEPS : S.sub==="splicing"?spSteps() : S.sub==="genex"?gxSteps() : MSTEPS; }
function STATE(){ return S.sub==="replication"?rp()   : S.sub==="transcription"?tr() : S.sub==="translation"?tl() : S.sub==="splicing"?sp() : S.sub==="genex"?gx() : ms_(); }
function TOTAL(){ return STEPS().reduce((a,z)=>a+z.d,0); }
function curStep(){ return STATE().step; }
function nSteps(){ return STEPS().length; }
function stepText(){ return STEPS()[STATE().step].t; }
function elapsedFrac(){ const R=STATE(),A=STEPS(); let t=R.t; for(let i=0;i<R.step;i++) t+=A[i].d; return t/TOTAL(); }
function seekTo(fr){ const R=STATE(),A=STEPS(); let t=Math.max(0,Math.min(1,fr))*TOTAL();
  for(let i=0;i<A.length;i++){ if(t<A[i].d||i===A.length-1){ R.step=i; R.t=Math.min(t,A[i].d-0.001); break; } t-=A[i].d; } }

function refresh(){
  const st=STAGES[S.sub];

  document.getElementById("keynote").textContent = st.note;

  document.getElementById("wrap-time").style.display  = flat ? "none" : "";
  document.getElementById("btn-step").style.display   = flat ? "none" : "";

  } else { const R=tr(), A=TS(), st=R.step, f=Math.min(1,R.t/A[st].d);

    const rows=[["R","RNA nucleotides joined",RNAC,Math.max(0,Math.min(TR.n,Math.floor(pol)-1))],
      ["I","intron bases removed","#f87171",(A[st].p==="mature"?GENE.intron[1]-GENE.intron[0]:0)],
      ["M","pre-mRNA molecules made","#e0a021",R.cum.pre]];

  S.ff=true; setRun(true); });
const sSp=document.getElementById("s-speed");
sSp.addEventListener("input",()=>{ S.speed=+sSp.value/100;
  document.getElementById("r-speed").textContent=(S.speed).toFixed(1)+"\u00d7"; });
const sT=document.getElementById("s-time");
sT.addEventListener("input",()=>{ seekTo(+sT.value/1000);
  document.getElementById("r-time").textContent=Math.round(+sT.value/10)+"%"; });

function gxPick(e){
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)/VS, y=(e.clientY-r.top)/VS;
  for(let i=GXHIT.length-1;i>=0;i--){ const h=GXHIT[i];
    if(x>=h.x0&&x<=h.x1&&y>=h.y0&&y<=h.y1) return h.k; }
  return null;
}
cv.addEventListener("click",e=>{
  if(S.sub!=="genex"||S.gxView!==1) return;
  const k=gxPick(e); if(k!==null) selectGenePart(k);
});
cv.addEventListener("mousemove",e=>{
  if(S.sub!=="genex"||S.gxView!==1){ cv.style.cursor=""; return; }
  cv.style.cursor = gxPick(e)!==null ? "pointer" : "";
});
function showStepText(id,value){
  const element=document.getElementById(id);
  if(element.textContent!==value)element.textContent=value;
}
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.12) dt=0.12;
  dt*=0.5;                                  // everything runs at half the old pace
  const before = S.ff ? curStep() : -1;
  if(S.ff) dt*=12;                           // keep the step button as quick as it was
  size(); enter();
  if(S.sub==="replication"){ updateRP(dt); drawRP(); }
  else if(S.sub==="transcription"){ updateTR(dt); drawTR(); }
  else if(S.sub==="translation"){ updateTL(dt); drawTL(); }
  else if(S.sub==="splicing"){ updateSP(dt); drawSP(); }
  else if(S.sub==="genex"){ updateGX(dt); drawGX(); }
  else { updateMS(dt); drawMS(); }
  if(S.ff && (curStep()!==before || (S.sub==="genex"&&S.gxView===1))){ S.ff=false; setRun(false); }
  if(S.playing){ const fr=elapsedFrac();
    sT.value=Math.round(fr*1000); document.getElementById("r-time").textContent=Math.round(fr*100)+"%"; }
  const number=S.sub==="genex"&&S.gxView===1?"Overview":"Step "+(curStep()+1)+" / "+nSteps();
  const cue=STEPS()[curStep()].cue||"Choose a labelled part of the gene expression model.";
  const details=stepText();
  showStepText("step-num",number);
  showStepText("step-cue",cue);
  showStepText("step-desc",details);
  renderTally();
  requestAnimationFrame(frame);
}
select("replication");
size();
requestAnimationFrame(frame);
</script>
</body>
</html>
