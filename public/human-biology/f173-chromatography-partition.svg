<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 390" width="280" height="390" role="img" aria-labelledby="title desc">
<title id="title">Movement between chromatography phases</title><desc id="desc">Two schematic rows compare where substances spend their time. In the A row three A symbols are in mobile solvent and one is associated with stationary paper. In the B row one B symbol is in solvent and three are on paper. Opposing arrows show both substances moving between phases. A tends to travel further. Symbols are qualitative, not measurements.</desc>
<style>text{font:17px system-ui,sans-serif;fill:#203c49}.head{font-weight:700}.small{font-size:16px}.symbol{font-weight:700;font-size:14px}.arrow{stroke:#286d70;stroke-width:2;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0v6l6-3z" fill="#286d70"/></marker></defs>
<text x="140" y="24" text-anchor="middle" class="head">Moving between phases</text>
<text x="72" y="51" text-anchor="middle" class="head">Solvent ↑</text><text x="208" y="51" text-anchor="middle" class="head">Paper</text>
<path d="M12 65h124v165H12z" fill="#e7f3f7" stroke="#7aa1b2" stroke-width="2"/><path d="M144 65h124v165H144z" fill="#fff9e8" stroke="#ae9e78" stroke-width="2"/>
<path d="M12 147h256" stroke="#adbdbe" stroke-width="1"/>
<g fill="#edcbb8" stroke="#a55b32" stroke-width="2"><circle cx="34" cy="105" r="11"/><circle cx="66" cy="105" r="11"/><circle cx="98" cy="105" r="11"/><circle cx="210" cy="105" r="11"/></g>
<g class="symbol" text-anchor="middle"><text x="34" y="110">A</text><text x="66" y="110">A</text><text x="98" y="110">A</text><text x="210" y="110">A</text></g>
<g fill="#c4deea" stroke="#39718b" stroke-width="2"><circle cx="66" cy="187" r="11"/><circle cx="182" cy="187" r="11"/><circle cx="214" cy="187" r="11"/><circle cx="246" cy="187" r="11"/></g>
<g class="symbol" text-anchor="middle"><text x="66" y="192">B</text><text x="182" y="192">B</text><text x="214" y="192">B</text><text x="246" y="192">B</text></g>
<path class="arrow" d="M117 98h46"/><path class="arrow" d="M163 113h-46"/><path class="arrow" d="M117 180h46"/><path class="arrow" d="M163 195h-46"/>
<text x="140" y="259" text-anchor="middle" class="small">Both move between the phases.</text>
<text x="140" y="288" text-anchor="middle">A spends more time in solvent;</text><text x="140" y="313" text-anchor="middle">B spends more time on paper.</text>
<text x="140" y="345" text-anchor="middle" class="head">A tends to travel farther.</text><text x="140" y="371" text-anchor="middle" class="small">Symbols are illustrative, not counts.</text>
</svg>
