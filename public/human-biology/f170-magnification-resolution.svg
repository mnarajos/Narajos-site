<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 310" role="img" aria-labelledby="title desc">
<title id="title">Enlarging an unresolved image</title><desc id="desc">A blurred spot is compared with a larger copy of the same blurred spot. The enlarged copy is larger, but still does not show two points as separate. Magnification is image size divided by actual size.</desc>
<defs><filter id="blur"><feGaussianBlur stdDeviation="3"/></filter></defs><rect width="280" height="310" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="26" font-weight="700">Enlarge the same image</text>
<rect x="25" y="50" width="92" height="90" fill="#fff" stroke="#a9bab9"/><circle cx="71" cy="95" r="10" fill="#69447f" filter="url(#blur)"/>
<rect x="163" y="50" width="92" height="90" fill="#fff" stroke="#a9bab9"/><g transform="translate(209 95) scale(2)"><circle r="10" fill="#69447f" filter="url(#blur)"/></g>
<path d="M125 95h30m-7-6 7 6-7 6" fill="none" stroke="#23656c" stroke-width="2.5"/>
<text x="140" y="173">Larger does not mean</text><text x="140" y="196">more detail resolved.</text>
<text x="140" y="239">Magnification = image size</text><text x="140" y="262">÷ actual size</text><text x="140" y="293">Use the same units.</text>
</g></svg>
