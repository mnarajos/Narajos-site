<svg xmlns="http://www.w3.org/2000/svg" width="280" height="330" viewBox="0 0 280 330" role="img" aria-labelledby="t d"><title id="t">Many placental villi increase exchange area</title><desc id="d">Several branching chorionic villi extend into maternal blood. Fetal vessels are within the villi, separated from the surrounding maternal blood by a barrier. Their many branches provide a large exchange surface; the image is schematic and not to scale.</desc><rect width="280" height="330" rx="12" fill="#f8eeee"/><g font-family="system-ui,sans-serif" fill="#233e4c" text-anchor="middle" font-size="16"><text x="140" y="25" font-weight="700">Many branching villi</text><text x="140" y="53">Maternal blood surrounds villi</text><path d="M0 285h280v45H0z" fill="#d8e8f0"/><path d="M24 285V147q0-40 22-40t22 40v55q0 20 12 20t12-20v-94q0-38 23-38t23 38v108q0 18 12 18t12-18v-93q0-38 23-38t23 38v72q0 18 11 18t11-18v-46q0-38 23-38t23 38v136" fill="#fff" stroke="#a96373" stroke-width="3"/><g fill="none" stroke="#537a94" stroke-width="4"><path d="M40 285V139q0-12 6-12t6 12v146M109 285V100q0-12 6-12t6 12v185M179 285V115q0-12 6-12t6 12v170M247 285V141q0-12 6-12t6 12v144"/></g><text x="140" y="308">Fetal vessels inside villi</text></g></svg>
