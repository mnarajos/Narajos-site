<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 380" role="img" aria-labelledby="title desc">
<title id="title">Sampling site and contamination</title><desc id="desc">A sample can contain material from the intended site and, if contamination occurs, from an unintended surface. The result may not reflect only the intended site. Unknown organisms can also present unknown risks.</desc>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#23656c"/></marker></defs><rect width="280" height="380" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">Where did material come from?</text><circle cx="66" cy="77" r="25" fill="#f9dfc8" stroke="#98451e" stroke-width="2"/><circle cx="214" cy="77" r="25" fill="#e5d9ec" stroke="#69447f" stroke-width="2"/>
<text x="66" y="120">Intended site</text><text x="214" y="120">Other surface</text>
<g fill="none" stroke="#23656c" stroke-width="2" marker-end="url(#a)"><path d="M72 133l44 42"/><path d="M208 133l-44 42"/></g>
<path d="M111 187h58v18l-8 53h-42l-8-53z" fill="#fff" stroke="#69447f" stroke-width="2"/><circle cx="130" cy="232" r="4" fill="#98451e"/><circle cx="150" cy="232" r="4" fill="#69447f"/>
<text x="140" y="286">Contamination can obscure</text><text x="140" y="309">what was present at the site.</text><text x="140" y="340">Unknown samples require</text><text x="140" y="364">risk assessment.</text>
</g></svg>
