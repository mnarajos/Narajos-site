<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 365" role="img" aria-labelledby="title description">
<title id="title">Numbered membrane cross-section</title>
<desc id="description">In a phospholipid bilayer, heads face the fluids and tails face inward. Number 1 marks a head. Number 2 marks cholesterol among tails. Number 3 marks an outside carbohydrate chain on a spanning glycoprotein. Number 4 marks a peripheral protein on the cytoplasmic face. An oxygen arrow crosses the lipid core; a sideways arrow indicates lateral movement.</desc>
