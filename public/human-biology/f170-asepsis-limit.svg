<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 335" role="img" aria-labelledby="title desc">
<title id="title">Asepsis and unknown samples</title><desc id="desc">A schematic sample container is shown between an inward arrow for accidental contamination and an outward arrow for escape. Aseptic technique aims to reduce both; it does not establish that the original unknown sample is safe.</desc>
<rect width="280" height="335" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">Aseptic technique aims to limit</text><text x="140" y="49">unintended transfer</text>
<path d="M111 82h58v18l-8 87h-42l-8-87z" fill="#fff" stroke="#69447f" stroke-width="2"/><circle cx="130" cy="145" r="6" fill="#98451e"/><circle cx="151" cy="160" r="5" fill="#98451e"/>
<path d="M28 130h68m-8-6 8 6-8 6M185 130h68m-8-6 8 6-8 6" fill="none" stroke="#23656c" stroke-width="2"/><path d="M100 117v26M180 117v26" stroke="#98451e" stroke-width="4"/>
<text x="60" y="214">Entry</text><text x="220" y="214">Escape</text><text x="140" y="251">The sample may still</text><text x="140" y="275">contain harmful organisms.</text><text x="140" y="310">Bars: reduced risk, not zero.</text>
</g></svg>
