<path d="M55 70h164m-9-6 9 6-9 6" fill="none" stroke="#98451e" stroke-width="3"/><text x="140" y="96">towards throat</text>
<path d="M47 137v-28m24 28v-28m24 28v-28m24 28v-28m24 28v-28m24 28v-28m24 28v-28m24 28v-28m24 28v-28" stroke="#23656c" stroke-width="3"/>
<path d="M42 138h196v24H42z" fill="#d8ece7" stroke="#23656c" stroke-width="2"/>
<text x="140" y="202" font-weight="700">Oviduct</text><text x="140" y="226">Oocyte towards uterus</text>
<circle cx="70" cy="250" r="11" fill="#e5d9ec" stroke="#69447f" stroke-width="2"/><path d="M92 250h126m-9-6 9 6-9 6" fill="none" stroke="#98451e" stroke-width="3"/>
<path d="M47 293v-28m24 28v-28m24 28v-28m24 28v-28m24 28v-28m24 28v-28m24 28v-28m24 28v-28m24 28v-28" stroke="#23656c" stroke-width="3"/>
<path d="M42 294h196v24H42z" fill="#d8ece7" stroke="#23656c" stroke-width="2"/>
