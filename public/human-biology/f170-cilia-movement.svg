<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 330" role="img" aria-labelledby="title desc">
<title id="title">Cilia move material along linings</title><desc id="desc">Motile cilia on the tracheal lining move mucus and trapped particles towards the throat. In the oviduct, cilia help move an oocyte towards the uterus; muscular contractions also contribute.</desc>
<rect width="280" height="330" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
