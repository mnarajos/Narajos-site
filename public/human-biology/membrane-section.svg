<svg xmlns="http://www.w3.org/2000/svg" width="384" height="232" viewBox="0 0 384 232" role="img" aria-labelledby="title description">
  <title id="title">Cross-section of a cell surface membrane</title>
  <desc id="description">Two rows of round heads face the fluids. Their tails meet inside. A carbohydrate chain projects outside from a spanning protein. Small cholesterol molecules sit between tails. A peripheral protein attaches on the cytoplasmic surface.</desc>
