<svg xmlns="http://www.w3.org/2000/svg" width="280" height="430" viewBox="0 0 280 430" role="img" aria-labelledby="t d"><title id="t">Compare ways vaccines deliver antigen or instructions</title><desc id="d">An mRNA vaccine delivers mRNA instructions into a recipient cell, which makes an antigen. A modified viral vector delivers genetic instructions to a recipient cell, which can make an antigen. A subunit vaccine supplies selected antigenic components directly. The drawings are schematic and do not show all steps.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#32776d"/></marker></defs><rect width="280" height="430" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" text-anchor="middle" font-size="16"><text x="140" y="26" font-weight="700">How antigen is supplied</text><text x="140" y="59">mRNA vaccine</text><path d="M28 91q8-12 16 0t16 0t16 0" fill="none" stroke="#a76125" stroke-width="3"/><path d="M86 93h35" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><circle cx="150" cy="93" r="30" fill="#e0edf0" stroke="#537a94" stroke-width="2"/><path d="M144 86l8-12 8 12Z" fill="#a76125"/><text x="228" y="91" font-size="14">Cell makes</text><text x="228" y="110" font-size="14">antigen</text><path d="M20 137h240" stroke="#bfd4cf"/><text x="140" y="165">Viral-vector vaccine</text><circle cx="50" cy="199" r="19" fill="#d9e8f0" stroke="#537a94" stroke-width="2"/><path d="M42 199q8-10 16 0" fill="none" stroke="#a76125" stroke-width="2"/><path d="M77 199h44" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><circle cx="150" cy="199" r="30" fill="#e0edf0" stroke="#537a94" stroke-width="2"/><path d="M144 192l8-12 8 12Z" fill="#a76125"/><text x="228" y="197" font-size="14">Cell makes</text><text x="228" y="216" font-size="14">antigen</text><path d="M20 246h240" stroke="#bfd4cf"/><text x="140" y="275">Subunit vaccine</text><path d="M49 315l15-23 15 23Z" fill="#a76125"/><path d="M91 306h40" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><text x="195" y="300" font-size="14">Selected antigen</text><text x="195" y="320" font-size="14">supplied directly</text><text x="140" y="378" font-size="14">Each can stimulate adaptive</text><text x="140" y="399" font-size="14">immunity; images are schematic.</text></g></svg>
