<svg xmlns="http://www.w3.org/2000/svg" width="280" height="305" viewBox="0 0 280 305" role="img">
 <rect width="280" height="305" rx="12" fill="#f4f8f7"/>
 <g font-family="system-ui,sans-serif" fill="#233e4c" text-anchor="middle">
  <text x="140" y="25" font-size="17" font-weight="700">A timed walking task</text>
  <text x="140" y="51" font-size="14">Same course · illustrative times</text>
  <text x="45" y="92" font-size="15">Before</text>
  <rect x="87" y="72" width="160" height="28" fill="#d7e4f4" stroke="#537a94" stroke-width="2"/>
  <text x="45" y="143" font-size="15">After</text>
  <rect x="87" y="123" width="95" height="28" fill="#d7e9d4" stroke="#4b8361" stroke-width="2"/>
  <path d="M87 166h160m-7-5 7 5-7 5" stroke="#344958" stroke-width="2" fill="none"/>
  <text x="167" y="191" font-size="15">Longer time →</text>
  <path d="M20 210h240" stroke="#cbdedb" stroke-width="2"/>
  <text x="140" y="238" font-size="15">A shorter time can show</text>
  <text x="140" y="258" font-size="15">better task performance.</text>
  <text x="140" y="287" font-size="14">Disease status is not measured.</text>
 </g>
</svg>
