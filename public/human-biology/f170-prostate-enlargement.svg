<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 470" role="img" aria-labelledby="title desc">
<title id="title">Prostate enlargement can narrow the urethra</title><desc id="desc">Two simplified front sections compare the bladder and prostate. The urethra carries urine from the bladder and passes through the prostate. In the enlarged example, prostate tissue presses around and narrows the urethra, which can affect urination. Enlargement does not always cause symptoms.</desc>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#23656c"/></marker></defs><rect width="280" height="470" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">Urethra through the prostate</text><text x="140" y="51">Bladder</text><ellipse cx="140" cy="88" rx="55" ry="30" fill="#e5d9ec" stroke="#69447f" stroke-width="2"/>
<ellipse cx="140" cy="137" rx="48" ry="23" fill="#f9dfc8" stroke="#98451e" stroke-width="2"/><path d="M133 105h14v73h-14z" fill="#fff" stroke="#23656c" stroke-width="2"/><path d="M140 113v55" stroke="#23656c" stroke-width="2" marker-end="url(#a)"/>
<text x="140" y="202">Urine leaves through urethra</text><text x="140" y="240" font-weight="700">Enlarged prostate</text>
<ellipse cx="140" cy="280" rx="55" ry="30" fill="#e5d9ec" stroke="#69447f" stroke-width="2"/><ellipse cx="140" cy="329" rx="63" ry="29" fill="#f9dfc8" stroke="#98451e" stroke-width="2"/>
<path d="M133 297h14v12l-4 9v21l4 9v22h-14v-22l4-9v-21l-4-9z" fill="#fff" stroke="#23656c" stroke-width="2"/><path d="M140 303v57" stroke="#23656c" stroke-width="2" marker-end="url(#a)"/>
<text x="140" y="396">The channel can narrow;</text><text x="140" y="420">urination may be affected.</text><text x="140" y="452">Lower oval: prostate</text>
</g></svg>
