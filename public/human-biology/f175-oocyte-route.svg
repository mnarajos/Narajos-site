 <path d="M52 305v-19m22 19v-19m22 19v-19m22 19v-19m22 19v-19m22 19v-19m22 19v-19m22 19v-19m22 19v-19" stroke="#23656c" stroke-width="2"/>
 <path d="M47 306h186v13H47z" fill="#d8ece7" stroke="#23656c" stroke-width="2"/>
