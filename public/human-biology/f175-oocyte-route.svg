<svg xmlns="http://www.w3.org/2000/svg" width="280" height="350" viewBox="0 0 280 350" role="img" aria-labelledby="title desc">
<title id="title">Oocyte route towards the uterus</title>
<desc id="desc">A simplified pathway shows a secondary oocyte released from an ovary crossing a small gap towards fimbriae at the open end of an oviduct. The oviduct leads towards the uterus. Motile cilia and muscular contractions help transport the oocyte along the oviduct. The layout is not a body section or to scale.</desc>
