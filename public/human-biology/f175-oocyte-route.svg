 <path d="M130 92h70m-7-6 7 6-7 6" fill="none" stroke="#276972" stroke-width="2"/>
 <path d="M215 69q26 0 37 18v23q-20 13-37-2z" fill="#eed7db" stroke="#a76170" stroke-width="2"/>
 <text x="49" y="138">Ovary</text><text x="119" y="160">Fimbriae</text><text x="188" y="138">Oviduct</text><text x="235" y="160">Uterus</text>
