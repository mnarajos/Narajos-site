<svg xmlns="http://www.w3.org/2000/svg" width="280" height="350" viewBox="0 0 280 350" role="img" aria-labelledby="t d"><title id="t">Helper T-cell support and B-cell expansion</title><desc id="d">In a helper-dependent response an activated helper T cell provides signals to a matching B cell. Antigen presentation is a prerequisite but is not depicted. This support helps selected B cells divide into a clone, from which plasma and memory B cells can develop. The sequence is schematic.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#32776d"/></marker></defs><rect width="280" height="350" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" font-size="15" text-anchor="middle"><text x="140" y="25" font-size="16" font-weight="700">Helper T-cell support</text><circle cx="67" cy="85" r="30" fill="#e8d9ec" stroke="#80588f" stroke-width="2"/><text x="67" y="80" font-size="14">Helper</text><text x="67" y="98" font-size="14">T cell</text><circle cx="212" cy="85" r="30" fill="#d9e8f0" stroke="#537a94" stroke-width="2"/><text x="212" y="90" font-size="14">B cell</text><path d="M102 85h72" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><text x="140" y="67" font-size="13">Signals</text><text x="140" y="144" font-size="14">Matching B cell receives help</text><path d="M140 151v25" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><circle cx="92" cy="211" r="18" fill="#d9e8f0" stroke="#537a94"/><circle cx="140" cy="211" r="18" fill="#d9e8f0" stroke="#537a94"/><circle cx="188" cy="211" r="18" fill="#d9e8f0" stroke="#537a94"/><text x="140" y="252">Selected B cells multiply</text><text x="140" y="292" font-size="14">Plasma and memory cells</text><text x="140" y="312" font-size="14">can develop from the clone.</text><text x="140" y="336" font-size="13">Helper-dependent example</text></g></svg>
