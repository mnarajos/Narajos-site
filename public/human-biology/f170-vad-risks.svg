<svg xmlns="http://www.w3.org/2000/svg" width="280" height="360" viewBox="0 0 280 360" role="img" aria-labelledby="title desc">
<title id="title">Two possible assist-device risks</title><desc id="desc">A schematic shows germs near a driveline passing through skin; organisms may enter at the exit site in some ventricular assist devices. A second schematic shows a clot within a blood pathway that can obstruct flow. These are possible complications, not inevitable outcomes.</desc>
<rect width="280" height="360" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" fill="#243e49" text-anchor="middle" font-size="16">
<text x="140" y="24" font-weight="700">Two possible device risks</text>
<text x="140" y="52">1. Infection</text>
<rect x="35" y="94" width="210" height="30" fill="#f0d6cb" stroke="#b98472" stroke-width="2"/><path d="M140 65v87" stroke="#71838c" stroke-width="13"/><path d="M140 65v87" stroke="#c9d4d6" stroke-width="5"/>
<g fill="#b85d46"><circle cx="104" cy="79" r="4"/><circle cx="116" cy="68" r="4"/><circle cx="98" cy="65" r="4"/></g>
<path d="M116 85l17 16m-2-9 2 9-9-2" fill="none" stroke="#b85d46" stroke-width="2"/>
<text x="140" y="169" font-size="15">Germs may enter at a</text><text x="140" y="189" font-size="15">driveline exit through skin.</text>
<path d="M25 205h230" stroke="#b4cbce"/>
<text x="140" y="230">2. Blood clot</text>
<rect x="28" y="247" width="224" height="40" rx="20" fill="#f3d6d1" stroke="#aa6a63" stroke-width="2"/>
<path d="M140 254l10 4 5 10-7 8-12 3-9-8 3-11z" fill="#a85f55"/>
<path d="M43 267h66m-8-6 8 6-8 6M177 267h46m-8-6 8 6-8 6" fill="none" stroke="#286b73" stroke-width="2"/>
<text x="140" y="313" font-size="15">A clot can obstruct blood flow.</text><text x="140" y="341" font-size="15">These are possible, not inevitable.</text>
</g></svg>
