<svg xmlns="http://www.w3.org/2000/svg" width="280" height="325" viewBox="0 0 280 325" role="img" aria-labelledby="t d"><title id="t">FSH and LH at the ovary</title><desc id="d">FSH supports growth of an ovarian follicle containing an oocyte. An LH surge normally triggers ovulation: the secondary oocyte is released and the remaining follicle forms the corpus luteum. This is a simplified sequence.</desc><rect width="280" height="325" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" text-anchor="middle" font-size="16"><text x="140" y="26" font-weight="700">Follicle growth and ovulation</text><text x="140" y="56">FSH supports follicle growth</text><circle cx="140" cy="105" r="31" fill="#f7e7d2" stroke="#aa7a47" stroke-width="3"/><circle cx="140" cy="105" r="9" fill="#e8b470"/><text x="140" y="153">Oocyte inside follicle</text><text x="140" y="188">LH surge normally triggers</text><text x="140" y="212">ovulation</text><circle cx="90" cy="255" r="23" fill="#f3d4a2" stroke="#aa7a47" stroke-width="3"/><circle cx="190" cy="255" r="9" fill="#e8b470" stroke="#aa7a47"/><text x="80" y="294" font-size="14">Corpus luteum</text><text x="200" y="294" font-size="14">Oocyte</text></g></svg>
