<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 340" role="img" aria-labelledby="title desc">
<title id="title">Oxygen partial pressure across the alveolar barrier</title><desc id="desc">In this simplified example, ventilation renews alveolar air. Oxygen partial pressure is higher in alveolar air than in incoming capillary blood, so net oxygen diffusion is from air into blood. The barrier is enlarged and no numerical pressures are implied.</desc>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#23656c"/></marker></defs><rect width="280" height="340" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">Ventilation renews air</text><g stroke="#23656c" stroke-width="2" marker-end="url(#a)"><path d="M97 35v25"/><path d="M183 60V35"/></g>
<text x="140" y="87">Alveolar air</text><text x="140" y="110">Higher O₂ partial pressure</text>
<path d="M35 139q105-12 210 0v14q-105-12-210 0z" fill="#d8ece7" stroke="#23656c" stroke-width="2"/>
<path d="M35 168q105-12 210 0v14q-105-12-210 0z" fill="#e5d9ec" stroke="#69447f" stroke-width="2" stroke-dasharray="5 3"/>
<path d="M140 119v88" stroke="#98451e" stroke-width="3" marker-end="url(#a)"/><text x="190" y="159">O₂</text>
<text x="140" y="237">Incoming capillary blood</text><text x="140" y="261">Lower O₂ partial pressure</text>
<text x="140" y="299">Net diffusion is into blood.</text><text x="140" y="324">Barrier layers enlarged.</text>
</g></svg>
