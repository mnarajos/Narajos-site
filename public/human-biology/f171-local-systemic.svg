<svg xmlns="http://www.w3.org/2000/svg" width="280" height="405" viewBox="0 0 280 405" role="img" aria-labelledby="title desc">
<title id="title">Local surgery and systemic medicine</title><desc id="desc">In two schematic views of the same fictional patient, three dots indicate sites of disease. The first highlights surgery at one site. In the second, a systemic medicine enters the circulation and can reach cells at all three sites. Reaching a site does not guarantee that the treatment works. The sites and blood routes are schematic.</desc>
