<rect width="280" height="405" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16" fill="#243e49" text-anchor="middle">
 <text x="140" y="25" font-weight="700">Local surgery</text>
 <circle cx="140" cy="53" r="14" fill="#e3edf5" stroke="#537a94" stroke-width="2"/><path d="M115 83q25-20 50 0l-5 92h-40z" fill="#e3edf5" stroke="#537a94" stroke-width="2"/>
 <g fill="#a34843"><circle cx="130" cy="100" r="5"/><circle cx="151" cy="131" r="5"/><circle cx="135" cy="158" r="5"/></g>
 <circle cx="130" cy="100" r="13" fill="none" stroke="#a76125" stroke-width="2" stroke-dasharray="4 3"/>
 <path d="M40 112l75-9" stroke="#276972" stroke-width="2" marker-end="url(#a)"/><text x="44" y="81" font-size="14">Operated</text><text x="44" y="99" font-size="14">site</text>
 <path d="M20 193h240" stroke="#d6e1de" stroke-width="2"/>
 <text x="140" y="220" font-weight="700">Systemic medicine</text>
 <circle cx="140" cy="248" r="14" fill="#e3edf5" stroke="#537a94" stroke-width="2"/><path d="M115 278q25-20 50 0l-5 92h-40z" fill="#e3edf5" stroke="#537a94" stroke-width="2"/>
 <path d="M140 283v76M140 298l-10-4M140 326l11 0M140 352l-5 1" stroke="#537a94" stroke-width="3" fill="none"/>
 <g fill="#a34843"><circle cx="130" cy="295" r="5"/><circle cx="151" cy="326" r="5"/><circle cx="135" cy="353" r="5"/></g>
 <rect x="24" y="299" width="37" height="17" rx="8" fill="#e7d9ee" stroke="#80588f" stroke-width="2"/><path d="M42 299v17" stroke="#80588f" stroke-width="2"/>
 <path d="M65 307h75" stroke="#276972" stroke-width="2" marker-end="url(#a)"/><text x="69" y="345" font-size="14">Via blood</text>
