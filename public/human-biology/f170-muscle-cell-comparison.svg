<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 370" role="img" aria-labelledby="title description">
<title id="title">Three muscle cell arrangements</title>
<desc id="description">A skeletal fibre is long, striated and multinucleate. Cardiac cells are striated and branched, joining at intercalated discs. A smooth muscle cell is spindle shaped and lacks visible striations. Drawings are simplified and not size-matched.</desc>
<rect width="280" height="370" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" fill="#263e4a" text-anchor="middle">
<text x="140" y="24" font-weight="700">Skeletal fibre</text>
<rect x="26" y="38" width="228" height="52" rx="15" fill="#f4d7c8" stroke="#98451e" stroke-width="2"/>
<path d="M50 40v48m26-48v48m26-48v48m26-48v48m26-48v48m26-48v48m26-48v48m26-48v48" stroke="#bd8e80" stroke-width="2"/>
<g fill="#d8c7e4" stroke="#69447f"><ellipse cx="53" cy="77" rx="8" ry="5"/><ellipse cx="115" cy="77" rx="8" ry="5"/><ellipse cx="180" cy="77" rx="8" ry="5"/></g>
<text x="140" y="112">Long; several nuclei</text>
<text x="140" y="145" font-weight="700">Cardiac cells</text>
<path d="M27 161h94l24-12 16 13 23 4 38-20 16 13-40 27v34h-77l-24 14-15-14H27Z" fill="#f4d7c8" stroke="#98451e" stroke-width="2"/>
<path d="M55 162v56m21-56v56m21-56v56m28-58v55m22-54v57m23-49v49m20-53v34" stroke="#bd8e80" stroke-width="2"/>
<path d="M146 158v61" stroke="#69447f" stroke-width="4"/>
<text x="140" y="254">Branched; dark line: disc</text>
<text x="140" y="289" font-weight="700">Smooth muscle cell</text>
<path d="M25 321q115-36 230 0-115 36-230 0Z" fill="#d8ece7" stroke="#23656c" stroke-width="2"/>
<ellipse cx="140" cy="321" rx="15" ry="6" fill="#d8c7e4" stroke="#69447f"/>
<text x="140" y="357">Spindle-shaped; no stripes</text>
</g></svg>
