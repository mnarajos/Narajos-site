<svg xmlns="http://www.w3.org/2000/svg" width="280" height="355" viewBox="0 0 280 355" role="img" aria-labelledby="t d"><title id="t">An ECG records cardiac electrical activity</title><desc id="d">Electrodes on the skin connect to a recorder. The recorder displays a schematic ECG trace of electrical activity associated with heartbeats. The trace is illustrative, not a patient recording, and is not a direct measurement of cardiac output.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#32776d"/></marker></defs><rect width="280" height="355" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" text-anchor="middle" font-size="16"><text x="140" y="26" font-weight="700">What an ECG records</text><circle cx="63" cy="78" r="17" fill="#f3d6c5" stroke="#a57049" stroke-width="2"/><path d="M37 147q2-48 26-48t26 48Z" fill="#f3d6c5" stroke="#a57049" stroke-width="2"/><g fill="#537a94"><circle cx="52" cy="115" r="4"/><circle cx="74" cy="115" r="4"/><circle cx="63" cy="136" r="4"/></g><text x="63" y="174" font-size="14">Skin electrodes</text><path d="M94 119h40" fill="none" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><rect x="145" y="78" width="106" height="85" rx="6" fill="#d9e8f0" stroke="#537a94" stroke-width="2"/><path d="M154 126h12l5-7 5 7h7l4 8 5-30 6 30 5-8h12l6-6 8 6h12" fill="none" stroke="#32776d" stroke-width="2"/><text x="198" y="185" font-size="14">ECG recorder</text><text x="140" y="222">Cardiac electrical activity</text><text x="140" y="245">changes over time.</text><text x="140" y="287" font-size="14">Trace is schematic,</text><text x="140" y="308" font-size="14">not a patient recording.</text><text x="140" y="337" font-size="14">Not a direct measure of blood flow.</text></g></svg>
