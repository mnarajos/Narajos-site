<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" role="img" aria-labelledby="title description">
<title id="title">Vesicle fusion and blocked release</title>
<desc id="description">In an unblocked example, a protein-containing vesicle fuses with the surface membrane and releases protein outside. If surface fusion fails, vesicles accumulate inside and less protein appears outside.</desc>
<rect width="280" height="320" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" fill="#263e4a" text-anchor="middle">
<text x="140" y="24" font-weight="700">Fusion occurs</text>
<text x="51" y="52">Inside cell</text><text x="222" y="52">Outside</text>
<path d="M139 60v21m0 38v19" stroke="#23656c" stroke-width="5"/>
<path d="M139 81C108 81 108 119 139 119" fill="#e6f3fa" stroke="#23558c" stroke-width="2"/>
<circle cx="125" cy="95" r="3" fill="#98451e"/><circle cx="126" cy="105" r="3" fill="#98451e"/>
<path d="M132 99h30m-8-6 8 6-8 6" fill="none" stroke="#23558c" stroke-width="2.5"/>
<circle cx="180" cy="91" r="3" fill="#98451e"/><circle cx="197" cy="105" r="3" fill="#98451e"/>
<text x="140" y="162">Protein released outside</text>
<text x="140" y="196" font-weight="700">Fusion blocked</text>
<path d="M139 207v75" stroke="#23656c" stroke-width="5"/>
<circle cx="75" cy="244" r="16" fill="#e6f3fa" stroke="#23558c" stroke-width="2"/><circle cx="111" cy="244" r="16" fill="#e6f3fa" stroke="#23558c" stroke-width="2"/>
<g fill="#98451e"><circle cx="75" cy="244" r="3"/><circle cx="111" cy="244" r="3"/></g>
<path d="M155 232l17 18m-17 0 17-18" stroke="#98451e" stroke-width="3"/>
<text x="140" y="306">Vesicles collect inside</text>
</g></svg>
