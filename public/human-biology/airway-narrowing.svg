<svg xmlns="http://www.w3.org/2000/svg" width="220" height="280" viewBox="0 0 220 280"><style>text{font:16px system-ui,sans-serif;fill:#203c49}.t{font-weight:700;font-size:15px}.small{font-size:15px}</style><text x="110" y="22" text-anchor="middle" class="t">Airway cross-sections</text><text x="55" y="52" text-anchor="middle" class="small">Wider</text><text x="165" y="52" text-anchor="middle" class="small">Narrowed</text><circle cx="55" cy="110" r="43" fill="#e5f2ef" stroke="#397b6f" stroke-width="3"/><circle cx="165" cy="110" r="43" fill="#e5f2ef" stroke="#397b6f" stroke-width="3"/><circle cx="55" cy="110" r="32" fill="#fff" stroke="#397b6f" stroke-width="2"/><circle cx="165" cy="110" r="17" fill="#fff" stroke="#ad633c" stroke-width="2"/><text x="110" y="182" text-anchor="middle" class="small">White area: airway opening</text><text x="110" y="210" text-anchor="middle" class="small">Mucus narrows the opening</text><text x="110" y="232" text-anchor="middle" class="small">and raises airflow resistance.</text><text x="110" y="261" text-anchor="middle" class="small">Simplified cross-sections</text></svg>
