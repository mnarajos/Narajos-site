<svg xmlns="http://www.w3.org/2000/svg" width="280" height="495" viewBox="0 0 280 495" role="img" aria-labelledby="title desc">
  <title id="title">Inside the placenta: several chorionic villi</title>
  <desc id="desc">A simplified section of the placenta selected in figure 1 is turned so that the foetal side, towards the umbilical cord, is at the top and the uterine wall is below. Several branching chorionic villi extend from foetal-side tissue into surrounding maternal blood. One villus anchors to the uterine wall while others float in maternal blood. Each contains foetal vessels; only their main loops are shown. A dashed box marks the middle villus as the one enlarged in figure 3. Maternal and foetal blood normally remain separate. The diagram is not to scale.</desc>
  <rect width="280" height="495" rx="12" fill="#faf8f7"/>
  <g font-family="system-ui,sans-serif" fill="#243c48">
    <text x="14" y="25" font-size="17" font-weight="700">2. Inside the placenta</text>
    <text x="14" y="49" font-size="15">Foetal side: towards the cord</text>
    <!-- The section is turned from the first view; pink is maternal blood. -->
    <rect x="10" y="72" width="260" height="214" fill="#f8e7e5"/>
    <rect x="10" y="72" width="260" height="25" fill="#dbeaf1" stroke="#53798c" stroke-width="2"/>
    <rect x="10" y="277" width="260" height="20" fill="#d8c4ce" stroke="#855e72" stroke-width="2"/>
    <!-- One villus anchors to the uterine wall; the others float in maternal blood. -->
    <g fill="#fffdf9" stroke="#9c6275" stroke-width="2.5">
      <path d="M32 97 H73 V175 Q86 167 87 180 Q87 191 73 193 V208 Q73 225 65 229 V277 H43 V229 Q32 225 32 208 V199 Q18 199 20 187 Q21 176 32 183Z"/>
      <path d="M118 97 H162 V225 Q162 249 140 249 Q118 249 118 225Z"/>
      <path d="M207 97 H248 V174 Q261 168 262 181 Q261 191 248 193 V208 Q248 229 228 229 Q207 229 207 208 V198 Q193 198 194 187 Q195 177 207 183Z"/>
    </g>
    <!-- Each blue loop represents a foetal vessel within a villus. -->
    <g fill="none" stroke="#497888" stroke-width="9" stroke-linecap="round"><path d="M43 72 V204 Q43 217 53 217 Q62 217 62 204 V72"/><path d="M129 72 V222 Q129 237 140 237 Q151 237 151 222 V72"/><path d="M218 72 V204 Q218 217 228 217 Q237 217 237 204 V72"/></g>
    <g fill="none" stroke="#dff2f7" stroke-width="5" stroke-linecap="round"><path d="M43 72 V204 Q43 217 53 217 Q62 217 62 204 V72"/><path d="M129 72 V222 Q129 237 140 237 Q151 237 151 222 V72"/><path d="M218 72 V204 Q218 217 228 217 Q237 217 237 204 V72"/></g>
    <!-- The outlined middle villus is the subject of the next view. -->
    <rect x="96" y="101" width="88" height="155" rx="4" fill="none" stroke="#243c81" stroke-width="2" stroke-dasharray="5 3"/>
    <g font-size="16" font-weight="600">
      <text x="14" y="321">Maternal blood around villi</text>
      <text x="14" y="346">Pale shapes: chorionic villi</text>
      <text x="14" y="371">Foetal vessels inside villi</text>
      <text x="14" y="396">Dashed box: villus in figure 3</text>
      <text x="14" y="421">Lower band: uterus wall</text>
    </g>
    <text x="14" y="445" font-size="14">Some villi anchor; others float.</text>
    <text x="14" y="465" font-size="14">Blood normally remains separate.</text>
    <text x="14" y="485" font-size="13">Simplified; not to scale.</text>
  </g>
</svg>
