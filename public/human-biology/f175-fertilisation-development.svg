<svg xmlns="http://www.w3.org/2000/svg" width="280" height="410" viewBox="0 0 280 410" role="img" aria-labelledby="t d"><title id="t">Fertilisation and early development</title><desc id="d">In this schematic example sperm and oocyte meet in an oviduct. If fertilisation occurs a zygote forms, divides during transport and develops into a blastocyst. It may later implant in the uterine lining. Stages are not shown to scale.</desc><rect width="280" height="410" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" font-size="16" text-anchor="middle"><text x="140" y="25" font-weight="700">From gametes to implantation</text><text x="140" y="53">Oviduct</text><circle cx="140" cy="84" r="17" fill="#f8e4c6" stroke="#956d38" stroke-width="2"/><path d="M79 84h36m-7-5 7 5-7 5" fill="none" stroke="#39728a" stroke-width="2"/><text x="56" y="88">Sperm</text><text x="140" y="125">If fertilisation occurs</text><text x="140" y="148">↓ zygote divides during travel</text><ellipse cx="138" cy="185" rx="44" ry="21" fill="#eaf4f1" stroke="#32776d" stroke-width="2"/><circle cx="115" cy="185" r="11" fill="#c8dcd7" stroke="#32776d"/><circle cx="138" cy="185" r="11" fill="#c8dcd7" stroke="#32776d"/><circle cx="161" cy="185" r="11" fill="#c8dcd7" stroke="#32776d"/><text x="140" y="225">↓ blastocyst develops</text><circle cx="140" cy="264" r="25" fill="none" stroke="#32776d" stroke-width="4"/><circle cx="129" cy="269" r="5" fill="#32776d"/><circle cx="139" cy="273" r="5" fill="#32776d"/><text x="140" y="315">Uterus: may implant in lining</text><path d="M38 332q102 35 204 0" fill="none" stroke="#b26e7c" stroke-width="7"/><text x="140" y="382" font-size="14">Schematic; stages not to scale</text></g></svg>
