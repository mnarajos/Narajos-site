<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 295" role="img" aria-labelledby="title desc">
<title id="title">Short diffusion path at an alveolus</title><desc id="desc">Oxygen diffuses from alveolar air across a thin alveolar cell and capillary wall into blood. Carbon dioxide diffuses in the opposite direction. The layers and space are exaggerated for clarity.</desc>
<rect width="280" height="295" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">Alveolar air</text>
<path d="M30 68q110-12 220 0v14q-110-12-220 0z" fill="#d8ece7" stroke="#23656c" stroke-width="2"/>
<path d="M30 107q110-12 220 0v14q-110-12-220 0z" fill="#e5d9ec" stroke="#69447f" stroke-width="2" stroke-dasharray="5 3"/>
<path d="M100 45v102m-6-8 6 8 6-8" fill="none" stroke="#98451e" stroke-width="3"/><path d="M180 147V45m-6 8 6-8 6 8" fill="none" stroke="#23558c" stroke-width="3"/>
<text x="75" y="48">O₂</text><text x="207" y="48">CO₂</text>
<text x="140" y="174" font-weight="700">Blood in capillary</text>
<text x="140" y="218">Solid: thin alveolar cell</text><text x="140" y="244">Dashed: capillary wall</text><text x="140" y="277">Layers enlarged for clarity</text>
</g></svg>
