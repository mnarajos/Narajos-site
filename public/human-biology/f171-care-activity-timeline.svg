<svg xmlns="http://www.w3.org/2000/svg" width="280" height="330" viewBox="0 0 280 330" role="img" aria-labelledby="t d"><title id="t">Care and activity may need planning</title><desc id="d">Two time bars on a conceptual day overlap: a planned school or work activity and a care appointment or treatment. The overlap shows why the activity or care arrangements may need adjustment. No duration or particular treatment schedule is claimed; circumstances vary.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#32776d"/></marker></defs><rect width="280" height="330" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" text-anchor="middle" font-size="15"><text x="140" y="25" font-size="16" font-weight="700">Planning care and activity</text><text x="140" y="55">An illustrative day</text><text x="140" y="86">Planned school or work</text><rect x="35" y="99" width="182" height="27" fill="#d9e8f0" stroke="#537a94" stroke-width="2"/><text x="140" y="160">Care visit or treatment</text><rect x="143" y="173" width="99" height="27" fill="#f1dfc6" stroke="#a76125" stroke-width="2"/><path d="M149 127v45M213 127v45" stroke="#a76125" stroke-width="2" stroke-dasharray="4 4"/><path d="M34 229h212" fill="none" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><text x="140" y="254">Time →</text><text x="140" y="282" font-size="14">Overlapping plans may need</text><text x="140" y="302" font-size="14">adjustment; needs and timings vary.</text></g></svg>
