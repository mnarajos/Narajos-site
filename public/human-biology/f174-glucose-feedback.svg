<svg xmlns="http://www.w3.org/2000/svg" width="280" height="495" viewBox="0 0 280 495" role="img" aria-labelledby="t d"><title id="t">Insulin and glucagon oppose changes in blood glucose</title><desc id="d">When blood glucose is high, pancreatic beta cells release insulin. This increases glucose uptake in some tissues and glycogen storage, so glucose falls toward the usual range. When it is low, pancreatic alpha cells release glucagon. This stimulates the liver to break down glycogen and release glucose, so blood glucose rises toward the usual range.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#32776d"/></marker></defs><rect width="280" height="495" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" font-size="16" text-anchor="middle"><text x="140" y="25" font-weight="700">Glucose feedback</text><text x="150" y="59">Blood glucose rises</text><text x="150" y="98">Pancreatic β cells</text><text x="150" y="137">Release insulin</text><text x="150" y="176">More uptake and storage</text><text x="150" y="215">Glucose falls towards usual</text><path d="M20 237h240" stroke="#bed5d0"/><text x="150" y="268">Blood glucose falls</text><text x="150" y="307">Pancreatic α cells</text><text x="150" y="346">Release glucagon</text><text x="150" y="385">Liver releases glucose</text><text x="150" y="424">Glucose rises towards usual</text><text x="140" y="470" font-size="14">Pathways are simplified.</text><g stroke="#32776d" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M25 62v27"/><path d="M25 101v27"/><path d="M25 140v27"/><path d="M25 179v27"/><path d="M25 271v27"/><path d="M25 310v27"/><path d="M25 349v27"/><path d="M25 388v27"/></g></g></svg>
