<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 395" role="img" aria-labelledby="title desc">
<title id="title">Examples of gut microbiota activity</title><desc id="desc">Resident gut microbes can compete with a potential pathogen for space and nutrients, making establishment harder but not impossible. Some intestinal bacteria also synthesise vitamins. The symbols illustrate interactions and do not represent measured populations.</desc>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#23656c"/></marker></defs><rect width="280" height="395" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">Competition in the gut</text><text x="90" y="51">Residents</text><text x="214" y="51">Pathogen</text>
<g fill="#f9dfc8" stroke="#98451e" stroke-width="2"><rect x="36" y="64" width="49" height="20" rx="10"/><rect x="103" y="64" width="49" height="20" rx="10"/></g>
<path d="M214 64l10 10-10 10-10-10z" fill="#e5d9ec" stroke="#69447f" stroke-width="2"/><path d="M214 87l-19 18" stroke="#23656c" stroke-width="2" marker-end="url(#a)"/>
<g fill="#98451e"><circle cx="47" cy="103" r="3"/><circle cx="98" cy="103" r="3"/><circle cx="153" cy="103" r="3"/><circle cx="181" cy="103" r="3"/></g><path d="M30 117h220" stroke="#69447f" stroke-width="4"/>
<text x="140" y="146">Compete for space and</text><text x="140" y="168">nutrients near the lining.</text><text x="140" y="197">Some pathogens find it</text><text x="140" y="219">harder to establish.</text>
<text x="140" y="258" font-weight="700">Vitamin synthesis</text><rect x="47" y="275" width="68" height="28" rx="14" fill="#f9dfc8" stroke="#98451e" stroke-width="2"/><path d="M121 289h38" stroke="#23656c" stroke-width="2" marker-end="url(#a)"/><circle cx="195" cy="289" r="18" fill="#e5d9ec" stroke="#69447f" stroke-width="2"/><text x="195" y="295">V</text>
<text x="140" y="337">Some gut bacteria make vitamins.</text><text x="140" y="370">Illustrative, not a measurement.</text>
</g></svg>
