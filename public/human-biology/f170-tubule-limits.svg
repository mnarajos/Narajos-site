<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 380" role="img" aria-labelledby="title desc">
<title id="title">Two limits on tubule reabsorption</title><desc id="desc">Two simplified tubule cells face filtrate above. The first has a reduced brush border, leaving less apical membrane for transporters. The second retains its brush border but has little ATP available to power sodium pumps. Either change can reduce reabsorption.</desc>
<rect width="280" height="380" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">Reduced brush border</text><text x="140" y="48">Filtrate</text>
<path d="M50 98V84q0-8 7-8t7 8v14h14V84q0-8 7-8t7 8v14h96V84q0-8 7-8t7 8v14h14V84q0-8 7-8t7 8v14" fill="none" stroke="#23656c" stroke-width="3"/>
<path d="M50 98h180v42H50z" fill="#d8ece7" stroke="#23656c" stroke-width="2"/><text x="140" y="126">Tubule cell</text>
<text x="140" y="165">Less surface for transport</text>
<text x="140" y="208" font-weight="700">Little ATP available</text><text x="140" y="231">Filtrate</text>
<path d="M50 281V267q0-8 7-8t7 8v14h7v-14q0-8 7-8t7 8v14h7v-14q0-8 7-8t7 8v14h7v-14q0-8 7-8t7 8v14h7v-14q0-8 7-8t7 8v14h7v-14q0-8 7-8t7 8v14h7v-14q0-8 7-8t7 8v14h7v-14q0-8 7-8t7 8v14h7v-14q0-8 7-8t7 8v14" fill="none" stroke="#23656c" stroke-width="3"/>
<path d="M50 281h180v42H50z" fill="#d8ece7" stroke="#23656c" stroke-width="2"/><text x="140" y="308">Tubule cell</text>
<text x="140" y="352">Sodium pumping impaired</text>
</g></svg>
