<svg xmlns="http://www.w3.org/2000/svg" width="280" height="265" viewBox="0 0 280 265" role="img" aria-labelledby="t d"><title id="t">A worked BMI example</title><desc id="d">For a hypothetical adult with mass 70 kilograms and height 1.75 metres, body mass index is 70 divided by 1.75 squared, which is approximately 22.9 kilograms per square metre. This calculation alone does not establish health.</desc><rect width="280" height="265" rx="12" fill="#f4f8f7"/><g fill="#233e4c" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle"><text x="140" y="26" font-weight="700">Fictional BMI calculation</text><text x="140" y="61">Mass = 70 kg</text><text x="140" y="90">Height = 1.75 m</text><path d="M27 109h226" stroke="#bad2cb"/><text x="140" y="139">BMI = mass ÷ height²</text><text x="140" y="169">= 70 ÷ (1.75 × 1.75)</text><text x="140" y="199">≈ 22.9 kg/m²</text><text x="140" y="243" font-size="14">A calculation, not a diagnosis.</text></g></svg>
