<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" role="img" aria-labelledby="t d"><title id="t">Comparing two reported sleep changes</title><desc id="d">In a fictional four-week study, workshop participants report an average gain of 35 minutes of nightly sleep and the comparison group 15 minutes. The difference between the means is 20 minutes; this does not by itself establish that the workshop caused it.</desc><rect width="280" height="280" rx="12" fill="#f4f9f8"/><g font-family="system-ui,sans-serif" fill="#243e49" font-size="14"><text x="140" y="23" text-anchor="middle" font-weight="700">Fictional sleep study</text><text x="18" y="47">Mean reported gain (min/night)</text><path d="M43 68v147h213M38 215h5M38 180h5M38 145h5M38 110h5M38 75h5" stroke="#4d6972" fill="none" stroke-width="2"/><g text-anchor="end"><text x="32" y="220">0</text><text x="32" y="185">10</text><text x="32" y="150">20</text><text x="32" y="115">30</text><text x="32" y="80">40</text></g><rect x="66" y="92.5" width="56" height="122.5" fill="#4a847b"/><rect x="165" y="162.5" width="56" height="52.5" fill="#b67852"/><g text-anchor="middle"><text x="94" y="84">35</text><text x="193" y="154">15</text><text x="94" y="238">Workshop</text><text x="193" y="238">Comparison</text><text x="140" y="263">Difference: 20 min/night</text></g></g></svg>
