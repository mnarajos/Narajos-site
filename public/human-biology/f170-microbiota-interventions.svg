<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 480" role="img" aria-labelledby="title desc">
<title id="title">Microbiota interventions in different contexts</title><desc id="desc">A schematic compares probiotics, which contain live microbes and can have effects that depend on the product and context, with faecal microbiota transplantation using screened donor material. FMT is an established option for selected recurrent C. difficile infections; use for obesity remains investigational.</desc>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#23656c"/></marker></defs><rect width="280" height="480" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">Probiotic</text><rect x="100" y="40" width="80" height="26" rx="13" fill="#f9dfc8" stroke="#98451e" stroke-width="2"/><path d="M140 40v26" stroke="#98451e" stroke-width="2"/><text x="140" y="92">Live microbes</text>
<path d="M140 100v22" stroke="#23656c" stroke-width="2" marker-end="url(#a)"/><text x="140" y="148">May alter gut communities;</text><text x="140" y="171">effects depend on context.</text>
<text x="140" y="212" font-weight="700">Faecal microbiota transplant</text><path d="M106 227h68v16l-10 36h-48l-10-36z" fill="#e5d9ec" stroke="#69447f" stroke-width="2"/><circle cx="128" cy="252" r="4" fill="#69447f"/><circle cx="150" cy="257" r="4" fill="#69447f"/><text x="140" y="307">Screened donor material</text>
<path d="M140 316v22" stroke="#23656c" stroke-width="2" marker-end="url(#a)"/><text x="140" y="363">Introduced into recipient gut</text><text x="140" y="397">Selected recurrent C. difficile:</text><text x="140" y="420">an established clinical option.</text><text x="140" y="453">Obesity: investigational.</text>
</g></svg>
