<svg xmlns="http://www.w3.org/2000/svg" width="280" height="365" viewBox="0 0 280 365" role="img" aria-labelledby="title desc">
<title id="title">Testosterone and puberty</title><desc id="desc">Testosterone contributes to selected puberty changes: development of facial and body hair, larynx and vocal-fold growth associated with a lower voice, and muscle development. The extent and timing vary between individuals; these features are not diagnostic.</desc>
<rect width="280" height="365" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" fill="#243e49" font-size="16">
<text x="140" y="24" font-weight="700" text-anchor="middle">Testosterone and puberty</text>
<text x="140" y="49" font-size="15" text-anchor="middle">Examples of supported changes</text>
<circle cx="52" cy="94" r="25" fill="#f4ded0" stroke="#a67c69" stroke-width="2"/><path d="M35 100q17 25 34 0" fill="none" stroke="#735d65" stroke-width="2" stroke-dasharray="2 4"/><circle cx="43" cy="90" r="2" fill="#735d65"/><circle cx="61" cy="90" r="2" fill="#735d65"/>
<text x="92" y="89">Facial and body</text><text x="92" y="110">hair can develop</text>
<path d="M25 131h230" stroke="#b4cbce"/>
<path d="M42 153q10-8 20 0l5 17q-4 14-15 20-11-6-15-20z" fill="#e3d5ec" stroke="#806195" stroke-width="2"/><path d="M43 169q9-4 18 0M43 176q9 4 18 0" fill="none" stroke="#806195" stroke-width="2"/>
<text x="92" y="163">Larynx grows;</text><text x="92" y="184">voice may deepen</text>
<path d="M25 208h230" stroke="#b4cbce"/>
<path d="M28 261q6-18 15-17l8 8q9-16 24-9l3 16q-7 10-19 10H36z" fill="#f4ded0" stroke="#a67c69" stroke-width="2"/>
<text x="92" y="250">Muscle</text><text x="92" y="271">development</text>
<text x="140" y="317" font-size="15" text-anchor="middle">Timing and extent vary.</text><text x="140" y="341" font-size="15" text-anchor="middle">These features are not diagnostic.</text>
</g></svg>
