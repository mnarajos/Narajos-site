<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-labelledby="title description">
  <title id="title">Exchange across a chorionic villus</title>
  <desc id="description">A fetal capillary inside a chorionic villus is separated from the maternal blood surrounding it by the placental barrier. Oxygen moves from maternal to fetal blood and carbon dioxide moves in the opposite direction.</desc>
  <rect width="480" height="300" rx="12" fill="#f9f3ef"/>
  <path d="M194 48 C111 76 103 227 194 253 C252 271 367 243 380 167 C393 94 319 44 194 48Z" fill="#e8f4ef" stroke="#52786e" stroke-width="5"/>
  <path d="M258 76 C322 76 340 112 340 153 C340 196 318 226 258 226" fill="none" stroke="#5674a4" stroke-width="25" stroke-linecap="round"/>
  <path d="M258 76 C322 76 340 112 340 153 C340 196 318 226 258 226" fill="none" stroke="#e2ebf6" stroke-width="16" stroke-linecap="round"/>
  <g font-family="system-ui, sans-serif" fill="#253d4a" font-size="15" font-weight="600">
    <text x="20" y="30">Maternal blood</text>
    <text x="20" y="49">around villus</text>
    <text x="295" y="26">Chorionic villus</text>
    <text x="290" y="282">Fetal capillary</text>
    <text x="29" y="126">Oxygen</text>
    <text x="29" y="188">Carbon dioxide</text>
    <text x="22" y="277">Placental barrier</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M112 140H337 M325 133l12 7-12 7" stroke="#1a766a" stroke-width="4"/>
    <path d="M310 209H112 M124 202l-12 7 12 7" stroke="#a45438" stroke-width="4"/>
    <path d="M140 268L166 239 M340 267L324 226 M319 31L302 51" stroke="#425c66" stroke-width="1.8"/>
  </g>
</svg>
