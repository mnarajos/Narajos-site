<svg xmlns="http://www.w3.org/2000/svg" width="280" height="420" viewBox="0 0 280 420" role="img" aria-labelledby="t d"><title id="t">Compare inactivated, live attenuated and toxoid vaccines</title><desc id="d">An inactivated vaccine contains inactivated organisms that cannot replicate. A live attenuated vaccine contains weakened organisms that can replicate. A toxoid is an inactivated toxin; its recognisable features can stimulate an immune response. The organisms and toxin are schematic.</desc><rect width="280" height="420" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" text-anchor="middle" font-size="16"><text x="140" y="26" font-weight="700">Three vaccine approaches</text><text x="140" y="57">Inactivated organism</text><circle cx="70" cy="95" r="23" fill="#d9e8f0" stroke="#537a94" stroke-width="2"/><path d="M56 81l28 28M84 81l-28 28" stroke="#ad5e4a" stroke-width="3"/><text x="185" y="91" font-size="14">Inactivated;</text><text x="185" y="111" font-size="14">cannot replicate</text><path d="M20 132h240" stroke="#bfd4cf"/><text x="140" y="160">Live attenuated</text><circle cx="54" cy="202" r="20" fill="#d9e8f0" stroke="#537a94" stroke-width="2"/><path d="M80 202h30m-7-5 7 5-7 5" fill="none" stroke="#32776d" stroke-width="2"/><circle cx="129" cy="192" r="11" fill="#d9e8f0" stroke="#537a94"/><circle cx="129" cy="216" r="11" fill="#d9e8f0" stroke="#537a94"/><text x="211" y="193" font-size="14">Weakened;</text><text x="211" y="213" font-size="14">can replicate</text><path d="M20 242h240" stroke="#bfd4cf"/><text x="140" y="271">Toxoid</text><path d="M50 299l19-11 19 11v23l-19 11-19-11Z" fill="#f5dfbe" stroke="#a57049" stroke-width="2"/><text x="182" y="305" font-size="14">Inactivated toxin;</text><text x="182" y="325" font-size="14">recognisable features</text><text x="140" y="379" font-size="14">Shapes are schematic,</text><text x="140" y="400" font-size="14">not actual vaccine contents.</text></g></svg>
