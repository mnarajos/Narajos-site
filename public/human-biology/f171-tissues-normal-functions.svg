  <text x="140" y="53" font-size="16" font-weight="700">Nerve signal</text>
  <path d="M40 90h200" stroke="#8a6099" stroke-width="5"/><g fill="#d3e8de" stroke="#387f70" stroke-width="2"><rect x="48" y="80" width="42" height="20" rx="10"/><rect x="101" y="80" width="42" height="20" rx="10"/><rect x="154" y="80" width="42" height="20" rx="10"/></g>
  <path d="M66 116h145m-10-6 10 6-10 6" fill="none" stroke="#984b26" stroke-width="3"/><text x="140" y="142" font-size="16">Signal along nerve fibre</text>
  <path d="M20 158h240" stroke="#c4d7d0" stroke-width="2"/>
  <text x="140" y="183" font-size="16" font-weight="700">Movable joint</text>
