<svg xmlns="http://www.w3.org/2000/svg" width="280" height="620" viewBox="0 0 280 620" role="img" aria-labelledby="title desc">
 <title id="title">Four tissues and their functions</title><desc id="desc">A nerve fibre carries a signal; a movable joint allows one bone to move relative to another; a melanocyte makes the pigment melanin; and mineral contributes to the strength of growing bone. All four illustrations are simplified and are not to scale.</desc>
 <rect width="280" height="620" rx="12" fill="#f4f8f7"/>
 <g font-family="system-ui,sans-serif" fill="#233e4c" text-anchor="middle">
