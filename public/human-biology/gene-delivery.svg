<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-labelledby="title description">
  <title id="title">One example of gene delivery</title>
  <desc id="description">A gene copy is delivered to a target cell and expressed to produce functional protein. A second target cell remains untreated. Integration into a chromosome is not shown.</desc>
  <rect width="480" height="300" rx="12" fill="#f8f7f3"/>
  <circle cx="337" cy="132" r="92" fill="#e6f3ed" stroke="#52786e" stroke-width="3"/>
  <circle cx="337" cy="132" r="42" fill="#e9edf8" stroke="#647a9d" stroke-width="3"/>
  <path d="M28 112c12-18 20 18 32 0s20 18 32 0 M28 120c12 18 20-18 32 0s20-18 32 0" fill="none" stroke="#8059a1" stroke-width="3"/>
  <path d="M101 116H286 M275 109l11 7-11 7" fill="none" stroke="#477184" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M309 132c10-12 18 12 28 0s18 12 28 0 M309 140c10 12 18-12 28 0s18-12 28 0" fill="none" stroke="#8059a1" stroke-width="3"/>
  <path d="M338 158v26 M331 177l7 7 7-7" fill="none" stroke="#477184" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M319 195c5-10 10 8 17-1s11 7 19-1" fill="none" stroke="#b56b31" stroke-width="5" stroke-linecap="round"/>
  <circle cx="88" cy="220" r="35" fill="#f2f3f1" stroke="#81918d" stroke-width="3"/>
  <circle cx="88" cy="220" r="14" fill="#e9edf8" stroke="#647a9d" stroke-width="2"/>
  <g font-family="system-ui, sans-serif" fill="#253d4a" font-size="15" font-weight="600">
    <text x="16" y="28">Functional gene copy</text><text x="16" y="49">delivered</text>
    <text x="270" y="28">Treated target cell</text><text x="392" y="124">Nucleus</text>
    <text x="279" y="251">Functional protein</text><text x="16" y="280">A different target cell may not be reached.</text>
  </g>
  <path d="M391 128L376 130 M343 237L343 200" fill="none" stroke="#425c66" stroke-width="1.5"/>
</svg>
