<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 415" role="img" aria-labelledby="title desc">
<title id="title">Chromosome counts through replication and mitosis</title><desc id="desc">A model cell begins with four unduplicated chromosomes, each one DNA molecule. After S phase it has four duplicated chromosomes, each with two sister chromatids and two DNA molecules. After mitosis and cytokinesis, each of two daughter cells contains four unduplicated chromosomes and four DNA molecules.</desc>
<rect width="280" height="415" rx="12" fill="#f5faf9"/>
<defs><g id="single" stroke="#23656c" stroke-width="4" stroke-linecap="round"><path d="M0-8v16"/></g><g id="double" stroke="#98451e" stroke-width="3" stroke-linecap="round"><path d="M-5-9l10 18M5-9L-5 9"/></g></defs>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="24" font-weight="700">Before S phase</text><ellipse cx="140" cy="59" rx="80" ry="25" fill="#fff" stroke="#23656c" stroke-width="2"/><use href="#single" x="103" y="59"/><use href="#single" x="128" y="59"/><use href="#single" x="153" y="59"/><use href="#single" x="178" y="59"/>
<text x="140" y="106">4 chromosomes, 4 DNA</text><path d="M140 114v21m-6-7 6 7 6-7" fill="none" stroke="#263e4a" stroke-width="2"/>
<text x="140" y="158" font-weight="700">After S phase</text><ellipse cx="140" cy="193" rx="80" ry="25" fill="#fff" stroke="#23656c" stroke-width="2"/><use href="#double" x="103" y="193"/><use href="#double" x="128" y="193"/><use href="#double" x="153" y="193"/><use href="#double" x="178" y="193"/>
<text x="140" y="240">4 chromosomes, 8 DNA</text><path d="M140 247v21m-6-7 6 7 6-7" fill="none" stroke="#263e4a" stroke-width="2"/>
<text x="140" y="292" font-weight="700">After cell division</text><ellipse cx="72" cy="330" rx="60" ry="25" fill="#fff" stroke="#23656c" stroke-width="2"/><ellipse cx="208" cy="330" rx="60" ry="25" fill="#fff" stroke="#23656c" stroke-width="2"/>
<use href="#single" x="42" y="330"/><use href="#single" x="62" y="330"/><use href="#single" x="82" y="330"/><use href="#single" x="102" y="330"/><use href="#single" x="178" y="330"/><use href="#single" x="198" y="330"/><use href="#single" x="218" y="330"/><use href="#single" x="238" y="330"/>
<text x="140" y="382">Each daughter: 4 chromosomes,</text><text x="140" y="405">4 DNA molecules</text>
</g></svg>
