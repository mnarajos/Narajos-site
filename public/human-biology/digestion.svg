<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" width="280" height="300"><style>text{font:16px system-ui,sans-serif;fill:#203c49}.small{font-size:14px}.t{font-weight:700}.a{fill:none;stroke:#276c70;stroke-width:3;marker-end:url(#arr)}.b{fill:#e6f3ef;stroke:#397b6f;stroke-width:2}.r{fill:#f9eadd;stroke:#a55b32;stroke-width:2}</style><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3z" fill="#276c70"/></marker></defs><text x="140" y="22" text-anchor="middle" class="t">From starch to cells</text><rect class="b" x="25" y="37" width="230" height="53" rx="9"/><text x="140" y="58" text-anchor="middle" class="t">Gut lumen</text><text x="140" y="78" text-anchor="middle">Starch → glucose</text><path class="a" d="M140 92v28"/><rect class="r" x="25" y="124" width="230" height="50" rx="9"/><text x="140" y="145" text-anchor="middle" class="t">Intestinal lining</text><text x="140" y="165" text-anchor="middle">Absorption across cells</text><path class="a" d="M140 176v27"/><rect class="b" x="25" y="207" width="230" height="70" rx="9"/><text x="140" y="228" text-anchor="middle" class="t">Blood → tissues</text><text x="140" y="248" text-anchor="middle">Respiration or storage</text><text x="140" y="267" text-anchor="middle" class="small">Insulin signals some tissues</text></svg>
