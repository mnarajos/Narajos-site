<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" role="img" aria-labelledby="title description">
<title id="title">Genes and proteins for mitochondria</title>
<desc id="description">Nuclear DNA supplies instructions for proteins made by cytoplasmic ribosomes. Many of those proteins enter the mitochondrion. Mitochondrial DNA supplies instructions for only some mitochondrial proteins; the mitochondrion supplies ATP for cell processes.</desc>
<rect width="280" height="300" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="14" fill="#263e4a">
<ellipse cx="66" cy="66" rx="48" ry="36" fill="#eee8f4" stroke="#69447f" stroke-width="2"/>
<path d="M42 66q9-14 18 0t18 0t18 0" fill="none" stroke="#98451e" stroke-width="3"/>
<text x="66" y="120" text-anchor="middle">Nuclear DNA</text>
<path d="M116 67h40m-8-6 8 6-8 6" fill="none" stroke="#23558c" stroke-width="2.5"/>
<text x="136" y="53" text-anchor="middle">mRNA</text><circle cx="181" cy="67" r="17" fill="#c8e0d9" stroke="#23656c" stroke-width="2"/>
<text x="181" y="111" text-anchor="middle">Cytoplasmic</text><text x="181" y="129" text-anchor="middle">ribosome</text>
<path d="M181 89v80m-6-8 6 8 6-8" fill="none" stroke="#23558c" stroke-width="2.5"/>
<text x="196" y="150">Protein</text>
<ellipse cx="140" cy="206" rx="103" ry="43" fill="#f2ded1" stroke="#98451e" stroke-width="3"/>
<path d="M57 205q10-22 20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0" fill="none" stroke="#98451e" stroke-width="2"/>
<circle cx="99" cy="207" r="11" fill="none" stroke="#69447f" stroke-width="2"/>
<text x="116" y="232">mtDNA</text><path d="M115 224l-8-8" stroke="#69447f"/><text x="140" y="260" text-anchor="middle">Mitochondrion: ATP supply</text>
<text x="140" y="282" text-anchor="middle">Own DNA codes for some proteins</text>
</g></svg>
