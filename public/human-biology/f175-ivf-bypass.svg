<svg xmlns="http://www.w3.org/2000/svg" width="280" height="370" viewBox="0 0 280 370" role="img" aria-labelledby="t d"><title id="t">IVF can bypass blocked oviducts</title><desc id="d">In a simplified IVF cycle sperm and oocyte are brought together outside the body. If an embryo develops, it may be transferred into the uterus. This can bypass blocked oviducts; transfer does not guarantee implantation. The illustration is schematic.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#32776d"/></marker></defs><rect width="280" height="370" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" font-size="16" text-anchor="middle"><text x="140" y="25" font-weight="700">An IVF route</text><text x="140" y="54">Fertilisation outside body</text><ellipse cx="140" cy="95" rx="54" ry="24" fill="#fff" stroke="#537a94" stroke-width="2"/><circle cx="140" cy="95" r="12" fill="#f5dec3" stroke="#a57049"/><circle cx="108" cy="90" r="3" fill="#537a94"/><path d="M105 90q-8-7-14 0" fill="none" stroke="#537a94" stroke-width="2"/><text x="140" y="148">If an embryo develops</text><path d="M140 154v43" fill="none" stroke="#32776d" stroke-width="3" marker-end="url(#a)"/><text x="140" y="221">Transfer into uterus</text><path d="M93 252q-30-24-55-12m149 12q30-24 55-12M93 252q0 61 47 70 47-9 47-70" fill="none" stroke="#ae6d7c" stroke-width="5"/><path d="M64 235l8 19m136-19 8 19" fill="none" stroke="#8f4028" stroke-width="4"/><text x="140" y="244" font-size="13">Blocked oviducts</text><circle cx="140" cy="278" r="7" fill="#537a94"/><text x="140" y="351" font-size="14">Implantation is not guaranteed.</text></g></svg>
