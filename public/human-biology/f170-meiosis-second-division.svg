<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 330" role="img" aria-labelledby="title desc">
<title id="title">Sisters separate in meiosis II</title><desc id="desc">Each of two nuclei starts with a duplicated long and a duplicated short chromosome. In meiosis II their sister chromatids separate. The four resulting nuclei each have one long and one short unduplicated chromosome, with two DNA molecules in total.</desc>
<defs><g id="long" fill="none" stroke="#98451e" stroke-width="3" stroke-linecap="round"><path d="M-6-13l12 26M6-13L-6 13"/></g><g id="short" fill="none" stroke="#23656c" stroke-width="3" stroke-linecap="round"><path d="M-4-8l8 16M4-8l-8 16"/></g><g id="l" stroke="#98451e" stroke-width="4" stroke-linecap="round"><path d="M0-11v22"/></g><g id="s" stroke="#23656c" stroke-width="4" stroke-linecap="round"><path d="M0-6v12"/></g></defs>
<rect width="280" height="330" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">Before meiosis II</text><ellipse cx="72" cy="65" rx="59" ry="27" fill="#fff" stroke="#23656c" stroke-width="2"/><ellipse cx="208" cy="65" rx="59" ry="27" fill="#fff" stroke="#23656c" stroke-width="2"/>
<use href="#long" x="57" y="65"/><use href="#short" x="87" y="65"/><use href="#long" x="193" y="65"/><use href="#short" x="223" y="65"/>
<text x="140" y="125">Sister chromatids separate.</text><path d="M72 134v24m-6-7 6 7 6-7M208 134v24m-6-7 6 7 6-7" fill="none" stroke="#263e4a" stroke-width="2"/>
<text x="140" y="185" font-weight="700">Four resulting nuclei</text>
<g fill="#fff" stroke="#23656c" stroke-width="2"><ellipse cx="40" cy="225" rx="32" ry="25"/><ellipse cx="107" cy="225" rx="32" ry="25"/><ellipse cx="174" cy="225" rx="32" ry="25"/><ellipse cx="241" cy="225" rx="32" ry="25"/></g>
<use href="#l" x="31" y="225"/><use href="#s" x="49" y="225"/><use href="#l" x="98" y="225"/><use href="#s" x="116" y="225"/><use href="#l" x="165" y="225"/><use href="#s" x="183" y="225"/><use href="#l" x="232" y="225"/><use href="#s" x="250" y="225"/>
<text x="140" y="285">Each: 2 chromosomes,</text><text x="140" y="308">2 DNA molecules</text>
</g></svg>
