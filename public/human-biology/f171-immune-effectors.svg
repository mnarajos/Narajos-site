<svg xmlns="http://www.w3.org/2000/svg" width="280" height="390" viewBox="0 0 280 390" role="img" aria-labelledby="t d"><title id="t">Different immune effectors have different roles</title><desc id="d">A plasma cell secretes antibodies that can bind a matching antigen. A phagocyte engulfs material. A cytotoxic T cell can kill an infected host cell it recognises. These are distinct actions and the cells are schematic.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#32776d"/></marker></defs><rect width="280" height="390" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" text-anchor="middle" font-size="15"><text x="140" y="25" font-size="16" font-weight="700">Distinct effector roles</text><text x="140" y="56">Plasma cell secretes antibody</text><circle cx="56" cy="94" r="24" fill="#d9e8f0" stroke="#537a94" stroke-width="2"/><path d="M87 94h32" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><path d="M149 87l9 9 9-9m-9 9v13 M185 87l9 9 9-9m-9 9v13" fill="none" stroke="#a76125" stroke-width="3"/><path d="M143 81l6 6 4-9Z" fill="#537a94"/><text x="172" y="128" font-size="13">Y: antibody; ▲: antigen</text><path d="M20 145h240" stroke="#bfd4cf"/><text x="140" y="174">Phagocyte engulfs material</text><circle cx="91" cy="218" r="28" fill="#e1efde" stroke="#638b5e" stroke-width="2"/><circle cx="91" cy="218" r="9" fill="#edc293" stroke="#a76125"/><text x="185" y="223" font-size="14">Material inside</text><path d="M20 263h240" stroke="#bfd4cf"/><text x="140" y="293">Cytotoxic T cell can kill</text><text x="140" y="315">a recognised infected cell</text><circle cx="58" cy="349" r="18" fill="#e8d9ec" stroke="#80588f"/><path d="M83 349h66" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><circle cx="190" cy="349" r="21" fill="#f4ded7" stroke="#a76125"/><path d="M180 339l20 20m0-20-20 20" stroke="#a76125" stroke-width="2"/></g></svg>
