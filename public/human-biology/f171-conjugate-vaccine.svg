<svg xmlns="http://www.w3.org/2000/svg" width="280" height="410" viewBox="0 0 280 410" role="img" aria-labelledby="t d"><title id="t">A conjugate vaccine links polysaccharide and protein</title><desc id="d">Polysaccharide antigen is linked to a carrier protein. A B cell that binds the polysaccharide can take in the conjugate and present a carrier-protein peptide to a helper T cell. Helper T-cell signals can improve the antibody response to the polysaccharide and immune memory. Shapes are schematic.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#32776d"/></marker></defs><rect width="280" height="410" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" text-anchor="middle" font-size="16"><text x="140" y="25" font-weight="700">A conjugate vaccine</text><text x="75" y="54" font-size="14">Polysaccharide</text><text x="205" y="54" font-size="14">Carrier protein</text><g fill="#f2d3a9" stroke="#a76125" stroke-width="2"><circle cx="45" cy="80" r="8"/><circle cx="62" cy="80" r="8"/><circle cx="79" cy="80" r="8"/><circle cx="96" cy="80" r="8"/></g><path d="M104 80h51" stroke="#32776d" stroke-width="3"/><path d="M155 80l25-20 26 20-26 20Z" fill="#d6cae7" stroke="#80588f" stroke-width="2"/><path d="M140 112v25" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><text x="140" y="160">B cell binds polysaccharide</text><circle cx="70" cy="212" r="30" fill="#d9e8f0" stroke="#537a94" stroke-width="2"/><text x="70" y="217">B cell</text><path d="M104 212h59" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><path d="M180 247H105" stroke="#80588f" stroke-width="2" marker-end="url(#a)"/><text x="142" y="243" font-size="13">T-cell help</text><circle cx="210" cy="212" r="31" fill="#e8d9ec" stroke="#80588f" stroke-width="2"/><text x="210" y="207" font-size="14">Helper</text><text x="210" y="225" font-size="14">T cell</text><text x="140" y="270" font-size="14">B cell presents carrier peptide;</text><text x="140" y="291" font-size="14">helper T cell can provide signals.</text><text x="140" y="335" font-size="14">Response to polysaccharide and</text><text x="140" y="356" font-size="14">memory can be strengthened.</text><text x="140" y="389" font-size="14">Simplified process</text></g></svg>
