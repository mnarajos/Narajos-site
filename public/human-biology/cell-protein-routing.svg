<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 370" role="img" aria-labelledby="title description">
<title id="title">Rough ER and protein destinations</title>
<desc id="description">A ribosome makes a protein into rough endoplasmic reticulum. A vesicle carries it to the Golgi for modification and sorting. Some proteins are routed to lysosomes; secreted proteins travel in vesicles that fuse with the cell surface.</desc>
<rect width="280" height="370" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" fill="#263e4a" text-anchor="middle">
<text x="140" y="22" font-weight="700">A secreted protein's route</text>
<path d="M42 42q20-12 40 0t40 0v30q-20-12-40 0t-40 0Z" fill="#d8ece7" stroke="#23656c" stroke-width="2"/>
<g fill="#69447f"><circle cx="52" cy="39" r="4"/><circle cx="70" cy="34" r="4"/><circle cx="90" cy="39" r="4"/><circle cx="110" cy="34" r="4"/></g>
<text x="195" y="52">Rough ER</text><text x="195" y="70">ribosomes</text>
<circle cx="140" cy="100" r="6" fill="#e6f3fa" stroke="#23558c"/><path d="M140 87v27m-6-7 6 7 6-7" fill="none" stroke="#23558c" stroke-width="2.5"/>
<text x="140" y="103" dx="60">Vesicle</text>
<path d="M56 130q84-20 168 0M56 141q84-20 168 0M56 152q84-20 168 0" fill="none" stroke="#98451e" stroke-width="4"/>
<text x="140" y="178">Golgi: modify and sort</text>
<path d="M120 187L69 224m5-10-5 10 11-2M160 187l51 37m-11-2 11 2-5-10" fill="none" stroke="#23558c" stroke-width="2.5"/>
<circle cx="62" cy="241" r="20" fill="#eee8f4" stroke="#69447f" stroke-width="2"/>
<text x="62" y="276">Lysosome</text>
<circle cx="218" cy="241" r="15" fill="#e6f3fa" stroke="#23558c" stroke-width="2"/>
<text x="178" y="244" text-anchor="end">Secretory</text><text x="178" y="262" text-anchor="end">vesicle</text>
<path d="M218 258v55m-6-7 6 7 6-7M35 300h210" fill="none" stroke="#23656c" stroke-width="2"/>
<circle cx="218" cy="320" r="3" fill="#98451e"/><circle cx="230" cy="326" r="3" fill="#98451e"/><text x="140" y="345">Cell surface → outside</text>
</g></svg>
