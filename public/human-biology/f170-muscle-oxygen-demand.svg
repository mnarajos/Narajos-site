<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 380" role="img" aria-labelledby="title desc">
<title id="title">Working muscle and oxygen demand</title><desc id="desc">More muscle contractions increase ATP demand. If aerobic respiration increases to help meet the demand, the muscle needs more oxygen. This simplified pathway does not quantify exercise or oxygen delivery.</desc>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#23656c"/></marker></defs><rect width="280" height="380" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">Working muscle</text><rect x="52" y="42" width="176" height="42" rx="12" fill="#f9dfc8" stroke="#98451e" stroke-width="2"/><path d="M74 44v38M96 44v38M118 44v38M140 44v38M162 44v38M184 44v38M206 44v38" stroke="#98451e" stroke-width="1.5"/>
<text x="140" y="113">More contractions</text><path d="M140 121v21" stroke="#23656c" stroke-width="2" marker-end="url(#a)"/>
<text x="140" y="167">More ATP is needed</text><path d="M140 175v21" stroke="#23656c" stroke-width="2" marker-end="url(#a)"/>
<ellipse cx="140" cy="235" rx="46" ry="25" fill="#e5d9ec" stroke="#69447f" stroke-width="2"/><path d="M114 226q12 10 24 0t24 0M114 239q12 10 24 0t24 0" fill="none" stroke="#69447f" stroke-width="2"/>
<text x="140" y="280">Mitochondrion</text><text x="140" y="310">If aerobic respiration rises,</text><text x="140" y="333">O₂ demand can rise.</text><text x="140" y="365">Model, not measured data.</text>
</g></svg>
