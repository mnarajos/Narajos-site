<svg xmlns="http://www.w3.org/2000/svg" width="280" height="320" viewBox="0 0 280 320" role="img" aria-labelledby="t d"><title id="t">Glucose crosses the intestinal lining</title><desc id="d">Glucose in the intestinal lumen moves across the epithelial lining into the blood. The diagram focuses on movement and does not show individual transport proteins. Impaired absorption can reduce this movement even when glucose is present in the lumen.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#32776d"/></marker></defs><rect width="280" height="320" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" text-anchor="middle" font-size="16"><text x="140" y="25" font-weight="700">Absorbing glucose</text><text x="140" y="55">Intestinal lumen</text><g fill="#e8bd83" stroke="#a76125"><circle cx="65" cy="83" r="7"/><circle cx="140" cy="83" r="7"/><circle cx="215" cy="83" r="7"/></g><text x="140" y="115" font-size="14">Glucose</text><rect x="32" y="139" width="216" height="63" fill="#d9e8f0" stroke="#537a94" stroke-width="2"/><path d="M104 139v63m72-63v63" stroke="#537a94" stroke-width="2"/><text x="140" y="176">Epithelial lining</text><path d="M32 242h216v39H32z" fill="#f4dadd" stroke="#ad6875" stroke-width="2"/><path d="M65 93v160" stroke="#32776d" stroke-width="3" marker-end="url(#a)"/><path d="M215 93v160" stroke="#32776d" stroke-width="3" marker-end="url(#a)"/><text x="140" y="267">Blood</text><text x="140" y="306" font-size="14">Transport proteins omitted</text></g></svg>
