<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 555" role="img" aria-labelledby="title desc">
<title id="title">Hormones and the ovarian sequence</title><desc id="desc">The anterior pituitary releases FSH and LH into blood. FSH supports follicle development. An LH surge triggers release of a secondary oocyte. The remaining follicular tissue forms a corpus luteum, which produces progesterone that helps maintain which helps maintain the lining.</desc>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#23656c"/></marker></defs><rect width="280" height="555" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">Anterior pituitary</text><text x="140" y="49">FSH and LH travel in blood</text>
<text x="140" y="86" font-weight="700">FSH supports growth</text><circle cx="140" cy="133" r="32" fill="#f9dfc8" stroke="#98451e" stroke-width="2"/><circle cx="140" cy="133" r="13" fill="#e5d9ec" stroke="#69447f" stroke-width="2"/>
<text x="140" y="188">Developing follicle</text><path d="M140 195v23" stroke="#23656c" stroke-width="2" marker-end="url(#a)"/>
<text x="140" y="244" font-weight="700">LH surge triggers ovulation</text><circle cx="110" cy="292" r="30" fill="#f9dfc8" stroke="#98451e" stroke-width="2"/><path d="M142 292h35" stroke="#23656c" stroke-width="2" marker-end="url(#a)"/><circle cx="194" cy="292" r="12" fill="#e5d9ec" stroke="#69447f" stroke-width="2"/>
<text x="140" y="347">Secondary oocyte released</text><path d="M140 354v23" stroke="#23656c" stroke-width="2" marker-end="url(#a)"/>
<text x="140" y="401" font-weight="700">Corpus luteum forms</text><circle cx="140" cy="438" r="25" fill="#f9dfc8" stroke="#98451e" stroke-width="2"/><path d="M128 425q12 9 0 17t0 10M152 425q-12 9 0 17t0 10" fill="none" stroke="#98451e" stroke-width="2"/>
<text x="140" y="489">Produces progesterone</text><text x="140" y="512">which helps maintain</text><text x="140" y="535">the uterine lining.</text>
</g></svg>
