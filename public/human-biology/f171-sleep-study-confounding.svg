<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" role="img" aria-labelledby="t d"><title id="t">A possible alternative explanation</title><desc id="d">Motivation may affect both a person's choice to attend a sleep workshop and their sleep routine. Both workshop attendance and sleep routine may relate to reported sleep. Arrows describe plausible influences, not established causes in the fictional study.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285f68"/></marker></defs><rect width="280" height="320" rx="12" fill="#f4f9f8"/><g font-family="system-ui,sans-serif" fill="#243e49" text-anchor="middle" font-size="15"><text x="140" y="24" font-weight="700">A possible other explanation</text><ellipse cx="140" cy="68" rx="84" ry="21" fill="#d9e9e4" stroke="#4b8179" stroke-width="2"/><text x="140" y="73">Motivation</text><ellipse cx="75" cy="158" rx="66" ry="27" fill="#f3e5d3" stroke="#a17653" stroke-width="2"/><text x="75" y="153">Chooses</text><text x="75" y="172">workshop</text><ellipse cx="205" cy="158" rx="66" ry="27" fill="#f3e5d3" stroke="#a17653" stroke-width="2"/><text x="205" y="153">Changes</text><text x="205" y="172">routine</text><ellipse cx="140" cy="255" rx="92" ry="25" fill="#e0e4f1" stroke="#697ba0" stroke-width="2"/><text x="140" y="260">Reported sleep</text><g stroke="#285f68" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M124 87L91 130"/><path d="M156 87l33 43"/><path d="M92 185l30 45"/><path d="M188 185l-30 45"/></g><text x="140" y="301" font-size="14">Arrows are possible influences, not proof.</text></g></svg>
