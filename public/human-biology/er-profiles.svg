  <defs>
    <g id="sac"><path d="M27 0q37-7 64 0t58-2q10-3 10 5t-10 8q-36 9-61 2t-61 0q-9 2-9-5t9-8z" fill="#d4e7e3" stroke="#345566" stroke-width="2"/>
      <g fill="#263348"><circle cx="33" cy="-4" r="3"/><circle cx="49" cy="-7" r="3"/><circle cx="74" cy="-6" r="3"/><circle cx="104" cy="0" r="3"/><circle cx="134" cy="-2" r="3"/><circle cx="146" cy="14" r="3"/><circle cx="92" cy="18" r="3"/><circle cx="47" cy="14" r="3"/></g>
