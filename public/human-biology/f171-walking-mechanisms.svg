<svg xmlns="http://www.w3.org/2000/svg" width="280" height="430" viewBox="0 0 280 430" role="img" aria-labelledby="t d"><title id="t">Different mechanisms can affect walking</title><desc id="d">Three schematic examples show a disrupted signal in a nerve, inflammation of a joint and a weakened curved bone under load. Each can contribute to walking difficulty through a different mechanism. The diagrams do not diagnose an individual or imply every affected person has the same limitation.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#32776d"/></marker></defs><rect width="280" height="430" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" text-anchor="middle" font-size="15"><text x="140" y="25" font-size="16" font-weight="700">Walking: different causes</text><text x="140" y="54">Nerve signalling</text><path d="M35 84h70M175 84h70" stroke="#537a94" stroke-width="4"/><path d="M105 84h70" stroke="#537a94" stroke-width="3" stroke-dasharray="4 4"/><rect x="66" y="72" width="37" height="24" rx="8" fill="#d6e8e1" stroke="#32776d"/><rect x="177" y="72" width="37" height="24" rx="8" fill="#d6e8e1" stroke="#32776d"/><path d="M120 72l15 12-11 10m17-22 15 12-11 10" fill="none" stroke="#a76125" stroke-width="3"/><text x="140" y="121" font-size="14">Disrupted signal</text><path d="M20 137h240" stroke="#bfd4cf"/><text x="140" y="164">Joint movement</text><path d="M64 192q35 25 70 0M146 192q35 25 70 0" fill="none" stroke="#537a94" stroke-width="7"/><path d="M120 201q20-20 40 0" fill="none" stroke="#a76125" stroke-width="5"/><text x="140" y="235" font-size="14">Inflammation can restrict motion</text><path d="M20 251h240" stroke="#bfd4cf"/><text x="140" y="277">Bone under load</text><path d="M120 302q-25 34 0 68M160 302q-25 34 0 68" fill="none" stroke="#a57049" stroke-width="6"/><path d="M140 291v27" fill="none" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><text x="140" y="397" font-size="14">Weak bone may deform under load</text><text x="140" y="418" font-size="13">Examples are schematic, not diagnoses.</text></g></svg>
