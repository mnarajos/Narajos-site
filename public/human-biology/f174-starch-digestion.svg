<svg xmlns="http://www.w3.org/2000/svg" width="280" height="350" viewBox="0 0 280 350" role="img" aria-labelledby="t d"><title id="t">Digesting starch to glucose</title><desc id="d">A chain of linked units represents starch. Amylase breaks starch into smaller carbohydrates. Other digestive enzymes complete digestion and release glucose, shown as separate circles. The shapes are schematic and do not show every intermediate.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#32776d"/></marker></defs><rect width="280" height="350" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" font-size="16" text-anchor="middle"><text x="140" y="26" font-weight="700">Digesting starch</text><text x="140" y="55">Starch chain</text><path d="M43 75h194" stroke="#a76125" stroke-width="3"/><g fill="#f5deb8" stroke="#a76125" stroke-width="2"><circle cx="50" cy="75" r="11"/><circle cx="86" cy="75" r="11"/><circle cx="122" cy="75" r="11"/><circle cx="158" cy="75" r="11"/><circle cx="194" cy="75" r="11"/><circle cx="230" cy="75" r="11"/></g><path d="M140 95v32" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><text x="222" y="115" font-size="14">Amylase</text><text x="140" y="154">Smaller carbohydrates</text><path d="M40 181h30m45 0h30m45 0h30" stroke="#a76125" stroke-width="3"/><g fill="#f5deb8" stroke="#a76125" stroke-width="2"><circle cx="40" cy="181" r="10"/><circle cx="70" cy="181" r="10"/><circle cx="115" cy="181" r="10"/><circle cx="145" cy="181" r="10"/><circle cx="190" cy="181" r="10"/><circle cx="220" cy="181" r="10"/></g><path d="M140 199v30" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><text x="224" y="215" font-size="14">Other enzymes</text><g fill="#f5deb8" stroke="#a76125" stroke-width="2"><circle cx="40" cy="260" r="10"/><circle cx="80" cy="260" r="10"/><circle cx="120" cy="260" r="10"/><circle cx="160" cy="260" r="10"/><circle cx="200" cy="260" r="10"/><circle cx="240" cy="260" r="10"/></g><text x="140" y="295">Glucose available for absorption</text><text x="140" y="329" font-size="14">Simplified; not all products shown</text></g></svg>
