<svg xmlns="http://www.w3.org/2000/svg" width="280" height="355" viewBox="0 0 280 355" role="img" aria-labelledby="t d"><title id="t">Higher risk does not mean certainty</title><desc id="d">In a hypothetical teaching model, two equal groups of ten people are compared. Two in the first group and four in the second are marked as experiencing an outcome. The higher-risk group contains people without the outcome and the lower-risk group contains people with it. This is not evidence or a real risk estimate.</desc><rect width="280" height="355" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" font-size="15" text-anchor="middle"><text x="140" y="26" font-size="16" font-weight="700">Risk is not certainty</text><text x="140" y="53">Hypothetical equal groups</text><text x="140" y="84">Risk factor absent</text><g fill="#d9e8f0" stroke="#537a94" stroke-width="1.5"><circle cx="35" cy="112" r="9"/><circle cx="58" cy="112" r="9"/><circle cx="81" cy="112" r="9"/><circle cx="104" cy="112" r="9"/><circle cx="127" cy="112" r="9"/><circle cx="150" cy="112" r="9"/><circle cx="173" cy="112" r="9"/><circle cx="196" cy="112" r="9"/><circle cx="219" cy="112" r="9"/><circle cx="242" cy="112" r="9"/></g><path d="M29 106l12 12m0-12-12 12M52 106l12 12m0-12-12 12" stroke="#a76125" stroke-width="2"/><text x="140" y="165">Risk factor present</text><g fill="#d9e8f0" stroke="#537a94" stroke-width="1.5"><circle cx="35" cy="194" r="9"/><circle cx="58" cy="194" r="9"/><circle cx="81" cy="194" r="9"/><circle cx="104" cy="194" r="9"/><circle cx="127" cy="194" r="9"/><circle cx="150" cy="194" r="9"/><circle cx="173" cy="194" r="9"/><circle cx="196" cy="194" r="9"/><circle cx="219" cy="194" r="9"/><circle cx="242" cy="194" r="9"/></g><path d="M29 188l12 12m0-12-12 12M52 188l12 12m0-12-12 12M75 188l12 12m0-12-12 12M98 188l12 12m0-12-12 12" stroke="#a76125" stroke-width="2"/><text x="140" y="250">× marks an outcome</text><text x="140" y="279" font-size="14">An associated higher chance</text><text x="140" y="299" font-size="14">does not predict one person.</text><text x="140" y="335" font-size="14">Illustrative model, not real data.</text></g></svg>
