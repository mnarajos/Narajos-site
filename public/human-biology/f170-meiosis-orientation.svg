<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 395" role="img" aria-labelledby="title desc">
<title id="title">Independent orientation of two homologous pairs</title><desc id="desc">Two possible orientations of a long and short homologous pair are shown. The long pair faces the same way in both. The short pair can reverse independently, so a pole can receive a maternal long chromosome with either the maternal or paternal short chromosome.</desc>
<defs><g id="long" fill="none" stroke="#98451e" stroke-width="3" stroke-linecap="round"><path d="M-7-15l14 30M7-15l-14 30"/></g><g id="short" fill="none" stroke="#23656c" stroke-width="3" stroke-linecap="round"><path d="M-5-9l10 18M5-9L-5 9"/></g></defs>
<rect width="280" height="395" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">One orientation</text><text x="67" y="51">Left pole</text><text x="213" y="51">Right pole</text>
<path d="M140 60v95" stroke="#69447f" stroke-width="2" stroke-dasharray="5 3"/>
<use href="#long" x="90" y="82"/><use href="#long" x="190" y="82"/><text x="58" y="88">M</text><text x="222" y="88">P</text>
<use href="#short" x="90" y="126"/><use href="#short" x="190" y="126"/><text x="58" y="132">M</text><text x="222" y="132">P</text>
<text x="140" y="184" font-weight="700">Short pair reversed</text>
<path d="M140 199v95" stroke="#69447f" stroke-width="2" stroke-dasharray="5 3"/>
<use href="#long" x="90" y="221"/><use href="#long" x="190" y="221"/><text x="58" y="227">M</text><text x="222" y="227">P</text>
<use href="#short" x="90" y="265"/><use href="#short" x="190" y="265"/><text x="58" y="271">P</text><text x="222" y="271">M</text>
<text x="140" y="325">M: maternal; P: paternal</text><text x="140" y="349">Each pair can orient either way</text><text x="140" y="373">independently of the other.</text>
</g></svg>
