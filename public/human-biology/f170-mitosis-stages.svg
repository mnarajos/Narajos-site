<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 600" role="img" aria-labelledby="title desc">
<title id="title">Mitosis in a model cell</title><desc id="desc">A model cell with two duplicated chromosomes proceeds through mitosis. In prophase chromosomes condense and the spindle begins to form. In metaphase the chromosomes align at the equator with fibres attached. In anaphase sister chromatids separate to opposite poles. In telophase two nuclei re-form, each with two daughter chromosomes.</desc>
<rect width="280" height="600" rx="12" fill="#f5faf9"/>
<defs><g id="x" fill="none" stroke="#98451e" stroke-width="3" stroke-linecap="round"><path d="M-5-8l10 16M5-8L-5 8"/></g><g id="i" stroke="#98451e" stroke-width="4" stroke-linecap="round"><path d="M0-8v16"/></g></defs>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="24" font-weight="700">Prophase</text><ellipse cx="140" cy="66" rx="85" ry="34" fill="#fff" stroke="#23656c" stroke-width="2"/><ellipse cx="140" cy="66" rx="42" ry="25" fill="none" stroke="#69447f" stroke-width="2" stroke-dasharray="5 3"/><use href="#x" x="128" y="63"/><use href="#x" x="152" y="70"/>
<path d="M61 66l24-14M61 66l24 14M219 66l-24-14M219 66l-24 14" stroke="#23656c" stroke-width="2"/>
<text x="140" y="122">Condense; spindle starts</text>
<text x="140" y="156" font-weight="700">Metaphase</text><ellipse cx="140" cy="198" rx="85" ry="34" fill="#fff" stroke="#23656c" stroke-width="2"/>
<path d="M61 198l79-12M61 198l79 12M219 198l-79-12M219 198l-79 12" stroke="#23656c" stroke-width="2"/><use href="#x" x="140" y="186"/><use href="#x" x="140" y="210"/>
<text x="140" y="254">Align at equator</text>
<text x="140" y="288" font-weight="700">Anaphase</text><ellipse cx="140" cy="330" rx="85" ry="34" fill="#fff" stroke="#23656c" stroke-width="2"/>
<path d="M61 330l45-16M61 330l45 16M219 330l-45-16M219 330l-45 16" stroke="#23656c" stroke-width="2"/><use href="#i" x="106" y="314"/><use href="#i" x="106" y="346"/><use href="#i" x="174" y="314"/><use href="#i" x="174" y="346"/>
<path d="M125 330H91m7-6-7 6 7 6M155 330h34m-7-6 7 6-7 6" fill="none" stroke="#263e4a" stroke-width="2"/>
<text x="140" y="386">Sister chromatids separate</text>
<text x="140" y="420" font-weight="700">Telophase</text><ellipse cx="140" cy="462" rx="85" ry="34" fill="#fff" stroke="#23656c" stroke-width="2"/>
<ellipse cx="102" cy="462" rx="29" ry="24" fill="none" stroke="#69447f" stroke-width="2"/><ellipse cx="178" cy="462" rx="29" ry="24" fill="none" stroke="#69447f" stroke-width="2"/>
<use href="#i" x="95" y="462"/><use href="#i" x="109" y="462"/><use href="#i" x="171" y="462"/><use href="#i" x="185" y="462"/>
<text x="140" y="518">Two nuclei re-form</text><text x="140" y="550">Two chromosomes in each:</text><text x="140" y="574">this is a simplified model.</text>
</g></svg>
