<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 395" role="img" aria-labelledby="title desc">
<title id="title">Features of a hepatocyte</title><desc id="desc">A simplified liver cell contains rough ER with ribosomes, smooth ER without ribosomes and glycogen granules. Proteins made on rough ER can be sent out of the cell; smooth ER participates in lipid and drug processing and glycogen stores glucose units.</desc>
<rect width="280" height="395" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">Hepatocyte</text>
<rect x="33" y="45" width="214" height="190" rx="54" fill="#e7f3ef" stroke="#23656c" stroke-width="3"/>
<circle cx="140" cy="140" r="35" fill="#e5d9ec" stroke="#69447f" stroke-width="2"/><text x="140" y="145">Nucleus</text>
<path d="M55 85q23-16 47 0M54 94q24-16 48 0M55 103q23-16 47 0" fill="none" stroke="#23558c" stroke-width="3"/>
<g fill="#23558c"><circle cx="60" cy="79" r="2.5"/><circle cx="76" cy="74" r="2.5"/><circle cx="93" cy="78" r="2.5"/><circle cx="60" cy="98" r="2.5"/><circle cx="76" cy="93" r="2.5"/><circle cx="93" cy="97" r="2.5"/></g>
<path d="M178 86q12-13 24 0t24 0m-48 11q12-13 24 0t24 0m-48 11q12-13 24 0t24 0" fill="none" stroke="#98451e" stroke-width="3"/>
<g fill="#8b6b2d"><circle cx="78" cy="187" r="4"/><circle cx="90" cy="193" r="4"/><circle cx="100" cy="182" r="4"/><circle cx="193" cy="188" r="4"/><circle cx="205" cy="196" r="4"/><circle cx="215" cy="184" r="4"/></g>
<path d="M55 83H12m8-6-8 6 8 6" fill="none" stroke="#23558c" stroke-width="2"/>
<text x="140" y="267">Dotted rough ER:</text><text x="140" y="288">proteins for secretion</text>
<text x="140" y="316">Smooth ER: lipid and</text><text x="140" y="337">drug processing</text>
<text x="140" y="371">Dots below: glycogen</text>
</g></svg>
