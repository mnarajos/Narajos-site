<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 420" role="img" aria-labelledby="title desc">
<title id="title">Microbiota at different body sites</title><desc id="desc">A schematic body shows example microbiota sites at the skin, mouth, gut and reproductive tract. The communities can differ by site and include bacteria and fungi. Some microbial activities support metabolism and immune responses.</desc>
