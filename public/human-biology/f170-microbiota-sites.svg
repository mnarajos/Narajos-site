<path d="M117 252l-8 79h22l9-58 9 58h22l-8-79" fill="#f9dfc8" stroke="#98451e" stroke-width="2"/>
<circle cx="140" cy="74" r="4" fill="#69447f"/><circle cx="82" cy="183" r="4" fill="#69447f"/><circle cx="140" cy="174" r="4" fill="#69447f"/><circle cx="140" cy="235" r="4" fill="#69447f"/>
