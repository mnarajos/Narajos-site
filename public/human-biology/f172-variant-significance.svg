<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" width="280" height="320" role="img" aria-labelledby="title desc">
<title id="title">Finding a variant and interpreting it</title><desc id="desc">A marked site in a DNA sequence is found by a test. The report identifies the variant, but a question mark alongside evidence for its effect indicates that its clinical significance is uncertain.</desc>
<style>text{font:18px system-ui,sans-serif;fill:#203c49}.head{font-weight:700}.small{font-size:16px}.arrow{stroke:#286d70;stroke-width:3;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0v6l6-3z" fill="#286d70"/></marker></defs>
<text x="140" y="24" text-anchor="middle" class="head">A variant is found</text>
<path d="M37 55 C65 38 92 72 120 55 S175 38 203 55 S231 65 244 55 M37 82 C65 99 92 65 120 82 S175 99 203 82 S231 72 244 82" fill="none" stroke="#477d9d" stroke-width="3"/>
<path d="M56 50v36 M83 55v27 M110 62v13 M142 61v15 M174 51v34 M205 57v24 M230 62v14" stroke="#477d9d" stroke-width="2"/>
<circle cx="142" cy="69" r="10" fill="#d16d44" stroke="#8f4b30" stroke-width="2"/><text x="140" y="115" text-anchor="middle" class="small">Marked site: a detected variant</text>
<path class="arrow" d="M140 125v25"/>
<path d="M53 160h174v70H53z" fill="#eaf4f3" stroke="#397b6f" stroke-width="2"/><path d="M70 177h65 M70 190h76 M70 203h65" stroke="#557887" stroke-width="3"/>
<circle cx="182" cy="192" r="19" fill="#fff4df" stroke="#a55b32" stroke-width="2"/><text x="182" y="198" text-anchor="middle" class="head">?</text>
<text x="140" y="257" text-anchor="middle" class="head">Clinical effect uncertain</text><text x="140" y="282" text-anchor="middle" class="small">Detection does not establish</text><text x="140" y="303" text-anchor="middle" class="small">whether the variant causes disease.</text>
</svg>
