<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 465" role="img" aria-labelledby="title desc">
<title id="title">Simplified comparison of retinal pathways</title><desc id="desc">Several rod inputs converge on a shared retinal output. Responses can combine, helping detection in dim light but reducing the precision of location. In an idealised foveal cone pathway, two cone inputs remain separate, preserving finer spatial detail in bright light.</desc>
<rect width="280" height="465" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="26" font-weight="700">Rod pathway</text><text x="140" y="52">Several rod inputs</text>
<g fill="#d8ece7" stroke="#23656c" stroke-width="2"><circle cx="66" cy="83" r="13"/><circle cx="140" cy="83" r="13"/><circle cx="214" cy="83" r="13"/></g>
<path d="M66 98L130 139M140 98v41M214 98l-64 41" fill="none" stroke="#23656c" stroke-width="2.5"/>
<circle cx="140" cy="150" r="12" fill="#d8ece7" stroke="#23656c" stroke-width="2"/><path d="M140 162v29m-6-7 6 7 6-7" fill="none" stroke="#23656c" stroke-width="2.5"/>
<text x="140" y="216">Shared output: signals combine</text><text x="140" y="238">Less precise location</text>
<text x="140" y="281" font-weight="700">Cone pathways in the fovea</text>
<g fill="#e5d9ec" stroke="#69447f" stroke-width="2"><circle cx="84" cy="318" r="13"/><circle cx="196" cy="318" r="13"/></g>
<path d="M84 333v44m-6-7 6 7 6-7M196 333v44m-6-7 6 7 6-7" fill="none" stroke="#69447f" stroke-width="2.5"/>
<text x="140" y="410">Separate outputs preserve</text><text x="140" y="434">finer spatial detail</text>
</g></svg>
