<svg xmlns="http://www.w3.org/2000/svg" width="280" height="350" viewBox="0 0 280 350" role="img" aria-labelledby="t d"><title id="t">Symptoms can interrupt an activity</title><desc id="d">A schematic person follows an arrow up steps, pauses during the activity. This is one possible experience; symptoms, recovery and the support needed vary. The drawing does not show that all symptoms have the same cause.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#32776d"/></marker></defs><rect width="280" height="350" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" text-anchor="middle" font-size="16"><text x="140" y="26" font-weight="700">Activity may need a pause</text><path d="M32 245h49v-40h49v-40h49v-40h49" fill="none" stroke="#537a94" stroke-width="5"/><circle cx="48" cy="183" r="11" fill="#f2d7c8" stroke="#a57049"/><path d="M48 194v25m0-17-15 13m15-13 15 12m-15 5-12 18m12-18 12 18" stroke="#537a94" stroke-width="3" fill="none"/><path d="M73 214l25-19 22-12" stroke="#32776d" stroke-width="2" fill="none" marker-end="url(#a)"/><circle cx="144" cy="102" r="11" fill="#f2d7c8" stroke="#a57049"/><path d="M144 113v24m0-16-15 10m15-10 15 10m-15 6-12 18m12-18 12 18" stroke="#537a94" stroke-width="3" fill="none"/><text x="140" y="55">Symptoms</text><text x="140" y="76">may prompt a pause</text><text x="140" y="287" font-size="14">This is one possible experience.</text><text x="140" y="310" font-size="14">Symptoms and support needs vary.</text><text x="140" y="335" font-size="13">Not a diagnosis or exercise advice.</text></g></svg>
