<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 465" role="img" aria-labelledby="title desc">
<title id="title">Two ways insulin regulation can be affected</title><desc id="desc">In type 1 diabetes, the immune system attacks pancreatic beta cells, which can result in little insulin being produced. In type 2 diabetes, target tissues respond less well to insulin; insulin secretion may also later become insufficient. A glucose curve alone does not identify the type.</desc>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#23656c"/></marker></defs><rect width="280" height="465" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">Type 1</text><text x="140" y="51">Immune attack</text><path d="M140 58v20" stroke="#23656c" stroke-width="2" marker-end="url(#a)"/>
<path d="M40 114q35-31 105-26 55 4 95 26-22 23-65 25-90 6-135-25z" fill="#f9dfc8" stroke="#98451e" stroke-width="2"/><circle cx="140" cy="114" r="15" fill="#e5d9ec" stroke="#69447f" stroke-width="2"/><path d="M130 104l20 20M150 104l-20 20" stroke="#69447f" stroke-width="2"/>
<text x="140" y="165">Damaged beta cells</text><text x="140" y="189">can make little insulin.</text>
<text x="140" y="231" font-weight="700">Type 2</text><text x="140" y="257">Insulin signal</text><path d="M140 266v25" stroke="#23656c" stroke-width="2" marker-end="url(#a)"/>
<rect x="75" y="306" width="130" height="45" rx="12" fill="#f9dfc8" stroke="#98451e" stroke-width="2"/><path d="M95 309v39M115 309v39M135 309v39M155 309v39M175 309v39" stroke="#98451e" stroke-width="1.5"/>
<text x="140" y="379">Target tissues respond less.</text><text x="140" y="405">Insulin secretion may also</text><text x="140" y="428">become insufficient.</text><text x="140" y="454">Models are simplified.</text>
</g></svg>
