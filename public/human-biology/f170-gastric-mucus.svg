<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 355" role="img" aria-labelledby="title desc">
<title id="title">Protective gastric mucus</title><desc id="desc">A simplified gastric surface cell has mucus-filled vesicles which fuse with its exposed surface and release mucus. The mucus layer retains bicarbonate and helps protect the surface from acid and digestive enzymes in the stomach lumen.</desc>
<rect width="280" height="355" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">Stomach lumen</text><text x="140" y="49">Acid and enzymes</text>
<path d="M33 74h214v45H33z" fill="#f8e5bf"/><text x="140" y="94">Mucus retains</text><text x="140" y="114">bicarbonate</text>
<path d="M33 119h214v133H33z" fill="#d8ece7" stroke="#23656c" stroke-width="3"/>
<circle cx="95" cy="169" r="15" fill="#f8e5bf" stroke="#98451e" stroke-width="2"/><circle cx="225" cy="155" r="15" fill="#f8e5bf" stroke="#98451e" stroke-width="2"/><circle cx="185" cy="180" r="15" fill="#f8e5bf" stroke="#98451e" stroke-width="2"/>
<path d="M225 138v-24m-6 7 6-7 6 7" fill="none" stroke="#98451e" stroke-width="3"/>
<text x="140" y="221">Surface mucous cell</text>
<text x="140" y="282">Vesicles fuse at the surface</text><text x="140" y="307">and release mucus.</text><text x="140" y="338">The layer helps protect cells.</text>
</g></svg>
