<svg xmlns="http://www.w3.org/2000/svg" width="280" height="320" viewBox="0 0 280 320" role="img" aria-labelledby="t d"><title id="t">Different steps can affect fertilisation</title><desc id="d">One schematic shows a retained oocyte when ovulation does not occur. Another shows a sperm with a short movement arrow on its way toward an oocyte, representing low motility. Either can reduce the probability of gametes meeting; the examples do not establish the cause in an individual.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#32776d"/></marker></defs><rect width="280" height="320" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" font-size="16" text-anchor="middle"><text x="140" y="25" font-weight="700">Different points of difficulty</text><text x="140" y="57">Ovulation does not occur</text><ellipse cx="86" cy="102" rx="42" ry="27" fill="#f6dfc6" stroke="#a57049" stroke-width="2"/><circle cx="86" cy="102" r="8" fill="#d9a467"/><path d="M143 90v24m0-12h55" stroke="#a76125" stroke-width="3"/><text x="140" y="150" font-size="14">Oocyte not released</text><path d="M20 168h240" stroke="#bed5d0"/><text x="140" y="195">Reduced sperm motility</text><circle cx="66" cy="233" r="5" fill="#537a94"/><path d="M62 233q-12-10-22 0" fill="none" stroke="#537a94" stroke-width="2"/><path d="M80 233h34" fill="none" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><circle cx="216" cy="233" r="18" fill="#f6dfc6" stroke="#a57049" stroke-width="2"/><text x="140" y="277" font-size="14">Fewer sperm may reach oocyte</text><text x="140" y="303" font-size="14">Schematic examples, not a diagnosis</text></g></svg>
