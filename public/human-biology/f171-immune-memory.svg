<svg xmlns="http://www.w3.org/2000/svg" width="280" height="430" viewBox="0 0 280 430" role="img" aria-labelledby="t d"><title id="t">Immune memory supports a faster later response</title><desc id="d">A first exposure to an antigen selects matching B cells; after activation some become antibody-secreting plasma cells and some remain as memory B cells. On a later exposure to the same antigen, memory cells can respond more rapidly and give rise to more antibody-secreting cells. A booster can strengthen memory. T-cell memory also contributes, but is not drawn. The sequence is schematic and protection is not guaranteed.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#32776d"/></marker></defs><rect width="280" height="430" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" text-anchor="middle" font-size="16"><text x="140" y="25" font-weight="700">Preparing immune memory</text><text x="140" y="56">First antigen exposure</text><path d="M66 96l10-16 10 16Z" fill="#a76125"/><path d="M102 92h41" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><circle cx="188" cy="92" r="26" fill="#d9e8f0" stroke="#537a94" stroke-width="2"/><text x="188" y="97" font-size="14">B cell</text><text x="140" y="138">Matching cells activated</text><path d="M140 146v20m-5-6 5 6 5-6" fill="none" stroke="#32776d" stroke-width="2"/><text x="140" y="195">Plasma cells + memory cells</text><path d="M20 206h240" stroke="#bfd4cf"/><text x="140" y="236">Later matching antigen</text><path d="M65 276l10-16 10 16Z" fill="#a76125"/><path d="M100 272h43" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><circle cx="188" cy="272" r="26" fill="#e8d9ec" stroke="#80588f" stroke-width="2"/><text x="188" y="269" font-size="12">Memory</text><text x="188" y="285" font-size="12">B cell</text><text x="140" y="315">Faster specific response</text><text x="140" y="338">can make more antibody</text><text x="140" y="385" font-size="14">A booster can strengthen memory.</text><text x="140" y="407" font-size="14">Protection is not guaranteed.</text></g></svg>
