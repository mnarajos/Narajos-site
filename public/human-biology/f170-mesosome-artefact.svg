<svg xmlns="http://www.w3.org/2000/svg" width="280" height="365" viewBox="0 0 280 365" role="img" aria-labelledby="title desc">
<title id="title">Preparation can change appearance</title><desc id="desc">A conceptual bacterial membrane is shown before and after a possible change during chemical fixation. An inward fold is labelled as a possible preparation artefact, not an established organelle. The drawing is not an observation and does not imply every preparation creates a fold.</desc>
<rect width="280" height="365" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" fill="#243e49" text-anchor="middle" font-size="16">
<text x="140" y="24" font-weight="700">Preparation can change</text><text x="140" y="46" font-weight="700">what a section shows</text>
<rect x="38" y="64" width="130" height="66" rx="32" fill="#fff" stroke="#77598a" stroke-width="3"/>
<path d="M168 90h15" stroke="#435b66" stroke-width="1.5"/><text x="187" y="95" text-anchor="start" font-size="15">Membrane</text>
<path d="M112 143v30m-6-7 6 7 6-7" fill="none" stroke="#286b73" stroke-width="2.5"/>
<text x="140" y="194">Chemical fixation can</text><text x="140" y="216">alter the membrane</text>
<path d="M38 273q0-33 33-33h32c-4 10 3 17 12 22s1 16-7 13-10-12-1-19 14-8 17-16h29q35 0 35 33t-35 33H71q-33 0-33-33z" fill="#fff" stroke="#77598a" stroke-width="3"/>

<path d="M122 267h73" stroke="#435b66" stroke-width="1.5"/><text x="200" y="260" text-anchor="start" font-size="14.5">Possible</text><text x="200" y="280" text-anchor="start" font-size="14.5">artefact</text>
<text x="140" y="333" font-size="15">Conceptual: not an observation.</text><text x="140" y="354" font-size="15">Not every preparation causes this.</text>
</g></svg>
