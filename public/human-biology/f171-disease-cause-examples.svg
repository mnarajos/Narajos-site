<svg xmlns="http://www.w3.org/2000/svg" width="280" height="385" viewBox="0 0 280 385" role="img" aria-labelledby="t d"><title id="t">Examples of infectious and non-infectious disease</title><desc id="d">The first schematic shows bacteria entering the lungs, representing one possible infectious cause of pneumonia. The second shows a plaque in an artery narrowing its lumen, representing a non-infectious example of disease. The pictures are examples, not diagnostic images; pneumonia has several possible causes.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#32776d"/></marker></defs><rect width="280" height="385" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" font-size="15" text-anchor="middle"><text x="140" y="25" font-size="16" font-weight="700">Two possible disease causes</text><text x="140" y="57">Infectious example</text><ellipse cx="45" cy="102" rx="15" ry="8" fill="#d9e8f0" stroke="#537a94" stroke-width="2"/><circle cx="40" cy="102" r="2" fill="#537a94"/><circle cx="50" cy="102" r="2" fill="#537a94"/><text x="45" y="133" font-size="13">Bacterium</text><path d="M69 102h50" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><path d="M185 74v17m-5 0q-33-5-36 42 14 14 36 1V91m10 0q33-5 36 42-14 14-36 1V91" fill="#f5ddd5" stroke="#a57049" stroke-width="2"/><text x="187" y="158" font-size="14">Possible pneumonia</text><path d="M20 174h240" stroke="#bfd4cf"/><text x="140" y="204">Non-infectious example</text><circle cx="75" cy="260" r="39" fill="#f4dadd" stroke="#ad6875" stroke-width="3"/><circle cx="75" cy="260" r="29" fill="#fff" stroke="#ad6875" stroke-width="2"/><path d="M47 255q24-17 35 4-4 14-20 24-12-9-15-28" fill="#eac78f" stroke="#a57049" stroke-width="2"/><text x="183" y="251" font-size="14">Plaque narrows</text><text x="183" y="272" font-size="14">an artery</text><text x="140" y="330" font-size="14">Examples, not diagnoses.</text><text x="140" y="354" font-size="14">Diseases can have several causes.</text></g></svg>
