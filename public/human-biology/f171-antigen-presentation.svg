<svg xmlns="http://www.w3.org/2000/svg" width="280" height="420" viewBox="0 0 280 420" role="img" aria-labelledby="t d"><title id="t">Recognising an antigen</title><desc id="d">An antigen-presenting cell displays a peptide fragment on MHC for a matching helper T cell to recognise. Separately, a B cell receptor binds a matching feature of an intact antigen. These different recognition routes are schematic.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#32776d"/></marker></defs><rect width="280" height="420" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" text-anchor="middle" font-size="15"><text x="140" y="25" font-size="16" font-weight="700">Two recognition routes</text><text x="140" y="57">Antigen-presenting cell</text><circle cx="71" cy="108" r="32" fill="#d9e8f0" stroke="#537a94" stroke-width="2"/><path d="M99 95h15v17H99z" fill="#e5cfe8" stroke="#80588f"/><path d="M114 95l8-12 8 12Z" fill="#a76125"/><circle cx="210" cy="108" r="32" fill="#e8d9ec" stroke="#80588f" stroke-width="2"/><path d="M177 108h-38" fill="none" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><text x="210" y="104" font-size="14">Helper</text><text x="210" y="122" font-size="14">T cell</text><text x="140" y="168" font-size="14">Matching T cell recognises</text><text x="140" y="188" font-size="14">peptide displayed on MHC.</text><path d="M20 207h240" stroke="#bfd4cf"/><text x="140" y="235">Intact antigen binds B cell</text><path d="M58 282l14-21 14 21Z" fill="#a76125"/><path d="M100 273h45" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><circle cx="192" cy="273" r="31" fill="#d9e8f0" stroke="#537a94" stroke-width="2"/><path d="M160 273h-6l-7-7m7 7-7 7" stroke="#a76125" stroke-width="2" fill="none"/><text x="192" y="278">B cell</text><text x="74" y="313" font-size="13">Surface receptor</text><path d="M124 308h23v-28" fill="none" stroke="#a76125" stroke-width="1.5"/><text x="140" y="338" font-size="14">The B-cell receptor binds</text><text x="140" y="358" font-size="14">a matching antigen feature.</text><text x="140" y="397" font-size="14">Routes are simplified.</text></g></svg>
