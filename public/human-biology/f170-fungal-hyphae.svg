<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 390" role="img" aria-labelledby="title desc">
<title id="title">Hyphae and mycelium</title><desc id="desc">A branching network of fungal hyphae forms a mycelium. One hypha is shown enlarged: its wall contains chitin, and cross-walls called septa subdivide the filament in some fungi. The model is not to scale.</desc>
<rect width="280" height="390" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">Mycelium: branching hyphae</text>
<rect x="28" y="40" width="224" height="121" rx="8" fill="#ece9db" stroke="#a39b82" stroke-width="1.5" stroke-dasharray="5 3"/><text x="246" y="178" text-anchor="end">Substrate</text><g fill="none" stroke="#98451e" stroke-width="5" stroke-linecap="round"><path d="M139 158V94L109 65M139 119l38-35 25-18M139 144l-45-29-35-12M109 65l-8-22M109 65L82 53M177 84l1-30M177 84l28 11M94 115l-12 26M94 115l-31 10M139 95l-2-53"/></g>
<path d="M139 158v19" fill="none" stroke="#23656c" stroke-width="2"/><text x="140" y="199">One hypha enlarged</text>
<rect x="29" y="221" width="222" height="55" rx="23" fill="#f9dfc8" stroke="#98451e" stroke-width="7"/><path d="M39 233h202M39 264h202" stroke="#69447f" stroke-width="2"/><path d="M90 231v35M149 231v35M208 231v35" stroke="#23656c" stroke-width="3"/>
<text x="140" y="310">Wall contains chitin.</text><text x="140" y="336">Cross-walls are septa</text><text x="140" y="359">in some hyphae.</text><text x="140" y="383">Model is not to scale.</text>
</g></svg>
