<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" width="280" height="300"><style>text{font:16px system-ui,sans-serif;fill:#203c49}.small{font-size:14px}.t{font-weight:700}.a{fill:none;stroke:#276c70;stroke-width:3;marker-end:url(#arr)}.b{fill:#e6f3ef;stroke:#397b6f;stroke-width:2}</style><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3z" fill="#276c70"/></marker></defs><text x="140" y="22" text-anchor="middle" class="t">IVF and ICSI</text><text x="70" y="49" text-anchor="middle">IVF</text><text x="210" y="49" text-anchor="middle">ICSI</text><circle cx="76" cy="102" r="31" fill="#f6dfc6" stroke="#995b45" stroke-width="3"/><circle cx="204" cy="102" r="31" fill="#f6dfc6" stroke="#995b45" stroke-width="3"/><g fill="#5674a4"><circle cx="26" cy="86" r="4"/><circle cx="27" cy="118" r="4"/><circle cx="204" cy="102" r="4"/></g><path d="M280 96h-71m71 12h-62" stroke="#456979" stroke-width="3"/><text x="70" y="157" text-anchor="middle" class="small">Sperm and</text><text x="70" y="175" text-anchor="middle" class="small">oocyte together</text><text x="210" y="157" text-anchor="middle" class="small">One sperm</text><text x="210" y="175" text-anchor="middle" class="small">injected</text><path d="M70 185v17h140v-17 M140 202v16" class="a"/><text x="140" y="242" text-anchor="middle" class="small">If an embryo develops,</text><text x="140" y="260" text-anchor="middle" class="small">transfer may follow.</text><text x="140" y="282" text-anchor="middle" class="small">Implantation is not assured.</text></svg>
