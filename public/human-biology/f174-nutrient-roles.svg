<svg xmlns="http://www.w3.org/2000/svg" width="280" height="360" viewBox="0 0 280 360" role="img" aria-labelledby="t d"><title id="t">Nutrients have different roles</title><desc id="d">Starch can be digested to glucose represented by a hexagon for respiration. A protein chain breaks down into amino acids, represented by separate circles, for synthesis and can also supply energy. A fat molecule with three tails represents an energy store. Shapes are schematic.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#32776d"/></marker></defs><rect width="280" height="360" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" text-anchor="middle" font-size="15"><text x="140" y="25" font-size="16" font-weight="700">Examples of nutrient roles</text><text x="55" y="54">Starch</text><text x="134" y="54">Glucose</text><path d="M24 75l8-5 8 5v10l-8 5-8-5ZM42 75l8-5 8 5v10l-8 5-8-5ZM60 75l8-5 8 5v10l-8 5-8-5Z" fill="#f5deb8" stroke="#aa7a47" stroke-width="2"/><path d="M78 80h33" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><path d="M126 75l8-5 8 5v10l-8 5-8-5Z" fill="#f5deb8" stroke="#aa7a47" stroke-width="2"/><path d="M151 80h28" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><text x="226" y="85">Respiration</text><text x="140" y="119">Digestion supplies glucose</text><path d="M15 140h250" stroke="#cbdedb"/><text x="62" y="165">Protein</text><text x="198" y="165">Amino acids</text><path d="M31 191h65" stroke="#a76125" stroke-width="3"/><g fill="#f2d5ae" stroke="#a76125" stroke-width="2"><circle cx="36" cy="191" r="7"/><circle cx="55" cy="191" r="7"/><circle cx="74" cy="191" r="7"/><circle cx="93" cy="191" r="7"/><circle cx="177" cy="191" r="7"/><circle cx="199" cy="191" r="7"/><circle cx="221" cy="191" r="7"/></g><path d="M107 191h39" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><text x="140" y="223">Used for synthesis; can supply energy</text><path d="M15 238h250" stroke="#cbdedb"/><text x="54" y="267">Fat</text><path d="M38 281v41m0-34h53m-53 13h53m-53 13h53" fill="none" stroke="#a76125" stroke-width="3"/><path d="M105 301h37" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><text x="205" y="307">Energy store</text><text x="140" y="344" font-size="13">Shapes are schematic; roles overlap.</text></g></svg>
