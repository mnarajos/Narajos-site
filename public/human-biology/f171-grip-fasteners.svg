<svg xmlns="http://www.w3.org/2000/svg" width="280" height="360" viewBox="0 0 280 360" role="img" aria-labelledby="t d"><title id="t">A possible clothing adaptation for weak grip</title><desc id="d">Two fingertips approach a small button. A larger loop attached to a zip pull offers a larger opening that some people may find easier to grip. The comparison is schematic and does not guarantee that any aid will work for an individual.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#32776d"/></marker></defs><rect width="280" height="360" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" font-size="16" text-anchor="middle"><text x="140" y="25" font-weight="700">A fastener and a possible aid</text><text x="140" y="55">Small button</text><circle cx="140" cy="98" r="14" fill="#f5deb8" stroke="#a76125" stroke-width="2"/><circle cx="136" cy="95" r="2" fill="#a76125"/><circle cx="144" cy="101" r="2" fill="#a76125"/><g fill="#f2d7c8" stroke="#a57049" stroke-width="2"><circle cx="47" cy="98" r="11"/><circle cx="233" cy="98" r="11"/></g><path d="M61 98h50" fill="none" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><path d="M219 98h-50" fill="none" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><text x="140" y="143" font-size="14">Small object: fingertip grip</text><path d="M20 164h240" stroke="#bfd4cf"/><text x="140" y="193">Larger loop on a zip pull</text><ellipse cx="140" cy="245" rx="28" ry="35" fill="none" stroke="#a76125" stroke-width="6"/><path d="M140 280v20" stroke="#a76125" stroke-width="5"/><g fill="#f2d7c8" stroke="#a57049" stroke-width="2"><circle cx="49" cy="245" r="11"/><circle cx="231" cy="245" r="11"/></g><path d="M63 245h43" fill="none" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><path d="M217 245h-43" fill="none" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><text x="140" y="326" font-size="14">A larger grip may help some people.</text><text x="140" y="346" font-size="13">Needs and suitable aids vary.</text></g></svg>
