<svg xmlns="http://www.w3.org/2000/svg" width="280" height="355" viewBox="0 0 280 355" role="img" aria-labelledby="t d"><title id="t">Urgent bowel symptoms may affect a journey</title><desc id="d">A hypothetical journey from home to work has a planned stop where a toilet is available. Urgent bowel movements may lead someone to plan their route or allow extra time. Experiences vary and a route plan does not treat the underlying condition.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#32776d"/></marker></defs><rect width="280" height="355" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" text-anchor="middle" font-size="16"><text x="140" y="26" font-weight="700">One possible journey plan</text><text x="140" y="54">Urgency may affect travel</text><path d="M45 106h190" stroke="#32776d" stroke-width="3" fill="none" marker-end="url(#a)"/><circle cx="45" cy="106" r="7" fill="#537a94"/><circle cx="140" cy="106" r="7" fill="#a76125"/><circle cx="235" cy="106" r="7" fill="#537a94"/><text x="45" y="137" font-size="14">Home</text><text x="140" y="137" font-size="14">Planned stop</text><text x="235" y="137" font-size="14">Work</text><path d="M140 151v24" stroke="#a76125" stroke-width="2"/><rect x="87" y="181" width="106" height="58" rx="7" fill="#e0edf0" stroke="#537a94" stroke-width="2"/><text x="140" y="205" font-size="14">Toilet</text><text x="140" y="225" font-size="14">available</text><text x="140" y="280" font-size="14">Route and time may be adjusted.</text><text x="140" y="305" font-size="14">Experiences and needs vary.</text><text x="140" y="334" font-size="13">An illustrative plan, not treatment.</text></g></svg>
