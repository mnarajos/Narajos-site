<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 350" role="img" aria-labelledby="title desc">
<title id="title">A possible balance of additions and losses</title><desc id="desc">A hypothetical population starts with four cells A, B, C and D. A divides into two cells, B dies and C and D remain. Four cells are present afterwards. A constant viable count alone does not show whether this specific balance occurred.</desc>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#23656c"/></marker></defs><rect width="280" height="350" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">A possible balance</text><text x="140" y="51">Start: four viable cells</text>
<g fill="#f9dfc8" stroke="#98451e" stroke-width="2"><circle cx="50" cy="83" r="15"/><circle cx="110" cy="83" r="15"/><circle cx="170" cy="83" r="15"/><circle cx="230" cy="83" r="15"/></g>
<text x="50" y="89">A</text><text x="110" y="89">B</text><text x="170" y="89">C</text><text x="230" y="89">D</text>
<g stroke="#23656c" stroke-width="2" marker-end="url(#a)"><path d="M50 103v21"/><path d="M110 103v21"/></g><text x="140" y="150">A divides; B dies.</text><text x="140" y="173">C and D remain.</text>
<text x="140" y="207">End: four viable cells</text>
<g fill="#f9dfc8" stroke="#98451e" stroke-width="2"><circle cx="50" cy="241" r="15"/><circle cx="110" cy="241" r="15"/><circle cx="170" cy="241" r="15"/><circle cx="230" cy="241" r="15"/></g>
<text x="50" y="247">A₁</text><text x="110" y="247">A₂</text><text x="170" y="247">C</text><text x="230" y="247">D</text>
<text x="140" y="292">One added and one lost:</text><text x="140" y="316">no net change in count.</text>
</g></svg>
