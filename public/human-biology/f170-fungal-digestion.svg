<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 425" role="img" aria-labelledby="title desc">
<title id="title">Extracellular digestion by a fungus</title><desc id="desc">A hypha releases enzymes outside its cells. The enzymes break larger food molecules into smaller soluble products, which can be absorbed by the hypha. Saprotrophs obtain nutrients from non-living material; parasites obtain resources from living hosts.</desc>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#23656c"/></marker></defs><rect width="280" height="425" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">Digestion outside the hypha</text>
<rect x="21" y="61" width="70" height="230" rx="24" fill="#f9dfc8" stroke="#98451e" stroke-width="4"/><text x="56" y="176">Hypha</text>
<path d="M96 93h42" stroke="#23656c" stroke-width="2.5" marker-end="url(#a)"/><text x="181" y="76">Enzymes released</text>
<g fill="#69447f"><circle cx="153" cy="104" r="4"/><circle cx="171" cy="104" r="4"/><circle cx="189" cy="104" r="4"/><circle cx="207" cy="104" r="4"/></g>
<text x="181" y="140">Large molecule</text><g fill="#f9dfc8" stroke="#98451e" stroke-width="2"><circle cx="154" cy="164" r="7"/><circle cx="169" cy="164" r="7"/><circle cx="184" cy="164" r="7"/><circle cx="199" cy="164" r="7"/><circle cx="214" cy="164" r="7"/></g>
<path d="M181 177v22" stroke="#23656c" stroke-width="2" marker-end="url(#a)"/>
<g fill="#f9dfc8" stroke="#98451e" stroke-width="2"><circle cx="155" cy="220" r="6"/><circle cx="181" cy="220" r="6"/><circle cx="207" cy="220" r="6"/></g>
<text x="181" y="253">Small soluble</text><text x="181" y="274">products</text><path d="M139 289H96" stroke="#23656c" stroke-width="2.5" marker-end="url(#a)"/><text x="181" y="309">Absorbed</text>
<text x="140" y="352">Saprotroph: non-living material</text><text x="140" y="382">Parasite: resources from a host</text><text x="140" y="410">Drawing is not to scale.</text>
</g></svg>
