<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 365" role="img" aria-labelledby="title desc">
<title id="title">A chemical synapse</title><desc id="desc">An action potential reaches a presynaptic terminal. Calcium enters through a channel, helping a vesicle fuse and release neurotransmitter. Transmitter crosses the cleft and binds a receptor on the next cell. Effects on firing depend on the receptor and other input.</desc>
<g font-family="system-ui,sans-serif" font-size="18" fill="#233e4c">
<text x="160" y="22" text-anchor="middle">Action potential arrives</text><path d="M160 28v38m-6-7 6 7 6-7" fill="none" stroke="#a76125" stroke-width="3"/>
<rect x="70" y="72" width="180" height="123" rx="12" fill="#eef6f2"/><path d="M70 118V84Q70 72 82 72H238Q250 72 250 84V182Q250 195 238 195H165 M135 195H82Q70 195 70 183V136" fill="none" stroke="#32776d" stroke-width="3"/>
<text x="160" y="99" text-anchor="middle">Presynaptic terminal</text><text x="29" y="111" text-anchor="middle">Ca²⁺</text><path d="M22 127H98m-7-6 7 6-7 6" fill="none" stroke="#a76125" stroke-width="3"/><path d="M66 116v22M75 116v22" stroke="#537a94" stroke-width="3"/>
<circle cx="142" cy="155" r="14" fill="#e5d8ee" stroke="#80588f" stroke-width="2"/><g fill="#80588f"><circle cx="138" cy="152" r="2.4"/><circle cx="146" cy="151" r="2.4"/><circle cx="142" cy="159" r="2.4"/></g><text x="180" y="150">Vesicle</text><path d="M150 169v18m-5-5 5 5 5-5" fill="none" stroke="#80588f" stroke-width="2"/>
<path d="M136 195q14-17 28 0" fill="#e5d8ee" stroke="#80588f" stroke-width="2"/><g fill="#80588f"><circle cx="143" cy="204" r="3"/><circle cx="157" cy="212" r="3"/><circle cx="148" cy="222" r="3"/><circle cx="157" cy="233" r="3"/></g>
<text x="176" y="220">Transmitter</text><path d="M173 216L160 213" fill="none" stroke="#233e4c" stroke-width="1.5"/><text x="20" y="219">Synaptic</text><text x="20" y="238">cleft</text><path d="M150 238v19m-5-6 5 6 5-6" fill="none" stroke="#80588f" stroke-width="2"/><path d="M25 285H130m40 0h125" stroke="#32776d" stroke-width="4"/><path d="M130 285v-13q0-10 10-10h20q10 0 10 10v13" fill="#edd5ad" stroke="#a5792e" stroke-width="2"/>
<circle cx="141" cy="261" r="3" fill="#80588f"/><text x="183" y="267">Receptor</text><path d="M181 270l-14 5" stroke="#233e4c" fill="none"/><text x="160" y="314" text-anchor="middle">Postsynaptic cell</text><text x="160" y="346" text-anchor="middle">Effect depends on receptor</text>
</g></svg>
