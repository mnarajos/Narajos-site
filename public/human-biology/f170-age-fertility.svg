<svg xmlns="http://www.w3.org/2000/svg" width="280" height="370" viewBox="0 0 280 370" role="img" aria-labelledby="title desc">
<title id="title">Age, fertility and pregnancy</title><desc id="desc">Two schematic ovaries show a general decline in remaining follicles with age. An upward arrow notes that some pregnancy risks, such as miscarriage, increase with maternal age on average. Symbols are not counts or predictions for an individual.</desc>
<rect width="280" height="370" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" fill="#243e49" text-anchor="middle" font-size="16">
<text x="140" y="24" font-weight="700">Age and reproduction</text>
<text x="62" y="53" font-size="15">Earlier</text><text x="218" y="53" font-size="15">Later</text>
<ellipse cx="62" cy="100" rx="46" ry="30" fill="#f5d9d6" stroke="#a66378" stroke-width="2"/><ellipse cx="218" cy="100" rx="46" ry="30" fill="#f5d9d6" stroke="#a66378" stroke-width="2"/>
<g fill="#8c6ca0"><circle cx="40" cy="90" r="5"/><circle cx="62" cy="84" r="5"/><circle cx="84" cy="94" r="5"/><circle cx="48" cy="110" r="5"/><circle cx="70" cy="105" r="5"/><circle cx="85" cy="113" r="5"/><circle cx="208" cy="93" r="5"/><circle cx="229" cy="109" r="5"/></g>
<path d="M120 100h40m-8-6 8 6-8 6" fill="none" stroke="#286b73" stroke-width="2.5"/>
<text x="140" y="155" font-size="15">Remaining follicles generally fall</text><text x="140" y="176" font-size="15">with age; fertility can decline.</text>
<path d="M25 195h230" stroke="#b4cbce"/>
<text x="140" y="221">Pregnancy risk varies</text>
<path d="M52 279v-38m-6 8 6-8 6 8" fill="none" stroke="#a85f40" stroke-width="3"/>
<text x="160" y="250" font-size="15">Some risks, such as</text><text x="160" y="271" font-size="15">miscarriage, increase</text><text x="160" y="292" font-size="15">with maternal age on average.</text>
<text x="140" y="330" font-size="15">Follicle dots are not counts.</text><text x="140" y="352" font-size="15">Individual outcomes vary.</text>
</g></svg>
