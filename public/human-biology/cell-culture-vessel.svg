<svg xmlns="http://www.w3.org/2000/svg" width="280" height="365" viewBox="0 0 280 365" role="img" aria-labelledby="title desc">
<title id="title">A culture in controlled conditions</title><desc id="desc">Cells are shown in medium within a covered culture vessel. Conditions including temperature and pH are controlled to suit the culture. A cover alone does not guarantee sterility.</desc>
