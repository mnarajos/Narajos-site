<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 335" role="img" aria-labelledby="title desc">
<title id="title">Oocyte structure and cortical granules</title><desc id="desc">A simplified oocyte has a large cytoplasm and nucleus. Cortical granules lie just inside the cell membrane. After sperm entry, granules release material that changes the surrounding coat and helps prevent entry of another sperm.</desc>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#23656c"/></marker></defs><rect width="280" height="335" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">Oocyte</text><circle cx="140" cy="126" r="72" fill="#e5d9ec" stroke="#69447f" stroke-width="3"/><circle cx="140" cy="126" r="61" fill="#f9dfc8" stroke="#98451e" stroke-width="2"/><circle cx="140" cy="126" r="22" fill="#fff" stroke="#69447f" stroke-width="2"/>
<g fill="#23656c"><circle cx="140" cy="72" r="4"/><circle cx="178" cy="88" r="4"/><circle cx="194" cy="126" r="4"/><circle cx="178" cy="164" r="4"/><circle cx="140" cy="180" r="4"/><circle cx="102" cy="164" r="4"/><circle cx="86" cy="126" r="4"/><circle cx="102" cy="88" r="4"/></g>
<g stroke="#23656c" stroke-width="2" marker-end="url(#a)"><path d="M140 72V51"/><path d="M194 126h21"/><path d="M140 180v21"/><path d="M86 126H65"/></g>
<text x="140" y="237">Dots: cortical granules</text><text x="140" y="261">Outer ring: zona pellucida</text><text x="140" y="291">Large interior: cytoplasm</text><text x="140" y="320">Drawing is not to scale.</text>
</g></svg>
