<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 395" role="img" aria-labelledby="title desc">
<title id="title">Examples of bacterial locations</title><desc id="desc">Schematic examples of places where bacteria may be found include the conjunctiva, teeth, water, soil and surfaces. Their presence and abundance vary; the drawing does not assert that every example is contaminated.</desc>
<rect width="280" height="395" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">Possible locations</text><text x="140" y="51">Body surfaces</text>
<path d="M38 91q28-29 56 0-28 29-56 0z" fill="#fff" stroke="#69447f" stroke-width="2"/><circle cx="66" cy="91" r="11" fill="#e5d9ec" stroke="#69447f" stroke-width="2"/>
<path d="M166 76q12-8 23 0 11-8 23 0l-6 30q-3 12-10 3l-6-9-6 9q-7 9-10-3z" fill="#fff" stroke="#98451e" stroke-width="2"/>
<text x="66" y="135">Conjunctiva</text><text x="190" y="135">Teeth</text>
<text x="140" y="179">Environment</text><path d="M57 197q-25 34 0 48 25-14 0-48z" fill="#d8ece7" stroke="#23656c" stroke-width="2"/>
<path d="M111 241q9-26 22-13 10-21 22 0 13-12 23 13z" fill="#f9dfc8" stroke="#98451e" stroke-width="2"/>
<rect x="202" y="214" width="45" height="27" fill="#e5d9ec" stroke="#69447f" stroke-width="2"/>
<text x="57" y="273">Water</text><text x="145" y="273">Soil</text><text x="225" y="273">Surface</text>
<text x="140" y="324">Presence and amount vary;</text><text x="140" y="347">these are examples,</text><text x="140" y="370">not positive test results.</text>
</g></svg>
