<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 335" role="img" aria-labelledby="title desc">
<title id="title">One replicated chromosome</title><desc id="desc">One replicated chromosome contains two sister chromatids. Each chromatid runs lengthways from one tip to the other, through the centromere region. The short and long arms on each side are parts of the same chromatid.</desc>
<rect width="280" height="335" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">One replicated chromosome</text>
<text x="65" y="51">One sister</text><text x="215" y="51">Other sister</text>
<path d="M100 66C90 97 100 119 134 139C100 159 90 190 100 230" fill="none" stroke="#23656c" stroke-width="15" stroke-linecap="round"/>
<path d="M180 66C190 97 180 119 146 139C180 159 190 190 180 230" fill="none" stroke="#98451e" stroke-width="15" stroke-linecap="round"/>
<circle cx="140" cy="139" r="5" fill="#263e4a"/><path d="M145 139h64v42" fill="none" stroke="#263e4a" stroke-width="1.5"/>
<text x="140" y="267">Centromere region</text><path d="M209 181v65h-31" fill="none" stroke="#263e4a" stroke-width="1.5"/>
<text x="140" y="298">Two sister chromatids</text><text x="140" y="322">= two DNA molecules</text>
</g></svg>
