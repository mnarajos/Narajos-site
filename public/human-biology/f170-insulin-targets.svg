<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 475" role="img" aria-labelledby="title desc">
<title id="title">How insulin changes target-tissue activity</title><desc id="desc">Insulin signals muscle and fat cells, which can take up more glucose from blood. It also promotes glycogen synthesis in muscle and liver, and reduces glucose output from the liver. These effects oppose a rise in blood glucose.</desc>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#23656c"/></marker></defs><rect width="280" height="475" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">Insulin signal in blood</text><path d="M140 34v22" stroke="#23656c" stroke-width="2" marker-end="url(#a)"/>
<text x="140" y="79" font-weight="700">Muscle and fat cells</text><path d="M45 96h190v42H45z" fill="#e5d9ec" stroke="#69447f" stroke-width="2"/><text x="140" y="122">Glucose in blood</text>
<path d="M82 143v24" stroke="#23656c" stroke-width="2.5" marker-end="url(#a)"/><path d="M198 143v24" stroke="#23656c" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="38" y="175" width="88" height="30" rx="9" fill="#f9dfc8" stroke="#98451e" stroke-width="2"/><path d="M54 177v26M70 177v26M86 177v26M102 177v26" stroke="#98451e" stroke-width="1.5"/><circle cx="198" cy="190" r="24" fill="#f9dfc8" stroke="#98451e" stroke-width="2"/>
<text x="82" y="230">Muscle</text><text x="198" y="230">Fat</text><text x="140" y="258">More glucose uptake</text>
<text x="140" y="294" font-weight="700">Liver and muscle</text><path d="M38 329q22-20 75-10l5 20q-31 11-49 5-16 6-31-3z" fill="#f9dfc8" stroke="#98451e" stroke-width="2"/><path d="M128 333h32" stroke="#23656c" stroke-width="2" marker-end="url(#a)"/><g fill="#69447f"><circle cx="181" cy="325" r="5"/><circle cx="194" cy="333" r="5"/><circle cx="207" cy="325" r="5"/><circle cx="220" cy="333" r="5"/></g><text x="77" y="370">Liver</text><text x="200" y="370">Glycogen</text><text x="140" y="398">More glycogen synthesis</text><text x="140" y="426">Liver: less glucose output</text><text x="140" y="456">These oppose the rise.</text>
</g></svg>
