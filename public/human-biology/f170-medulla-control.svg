<title id="title">Medulla and physiological control</title><desc id="desc">A side-view schematic highlights the medulla in the lower brainstem, above the spinal cord. Arrows connect it to heart-rate regulation and the muscles of breathing. The arrows indicate functions, not anatomical nerve routes; other brainstem regions also contribute.</desc>
