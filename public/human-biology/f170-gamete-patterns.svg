<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 325" role="img" aria-labelledby="title desc">
<title id="title">Contrasting patterns of gamete production</title><desc id="desc">A conceptual time line shows oocyte maturation and release generally recurring in cycles, with variable intervals. A second line shows sperm production as relatively continuous after puberty. The drawing has no time scale and does not predict fertility.</desc>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#23656c"/></marker></defs><rect width="280" height="325" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">Patterns after puberty</text><text x="140" y="54">Oocyte maturation and release</text>
<path d="M30 109h220" stroke="#23656c" stroke-width="2" marker-end="url(#a)"/><g fill="#e5d9ec" stroke="#69447f" stroke-width="2"><circle cx="60" cy="83" r="10"/><circle cx="128" cy="83" r="10"/><circle cx="218" cy="83" r="10"/></g>
<path d="M60 94v10M128 94v10M218 94v10" stroke="#69447f" stroke-width="2"/><text x="140" y="140">Generally cyclic</text>
<text x="140" y="181">Sperm production</text><path d="M30 225h220" stroke="#23656c" stroke-width="4" marker-end="url(#a)"/>
<g fill="none" stroke="#98451e" stroke-width="2"><circle cx="65" cy="208" r="4"/><path d="M69 208q8-7 14 0"/><circle cx="132" cy="208" r="4"/><path d="M136 208q8-7 14 0"/><circle cx="202" cy="208" r="4"/><path d="M206 208q8-7 14 0"/></g>
<text x="140" y="258">Relatively continuous</text><text x="140" y="293">Conceptual: timing varies.</text><text x="140" y="315">No time scale is implied.</text>
</g></svg>
