<title id="title">Rod and cone photoreceptors</title><desc id="desc">A rod has a cylindrical outer segment, while a cone has a tapering outer segment. The lines in each outer segment represent layers of membrane containing visual pigments. Both cells signal to other retinal cells.</desc>
