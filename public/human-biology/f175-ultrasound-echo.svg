<svg xmlns="http://www.w3.org/2000/svg" width="280" height="330" viewBox="0 0 280 330" role="img" aria-labelledby="t d"><title id="t">Ultrasound echoes form an image</title><desc id="d">An ultrasound probe sends sound pulses into the body. Some sound reflects at a tissue boundary and returns to the probe. A scanner uses returning echoes to create an image. The diagram is schematic and does not show every boundary.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#32776d"/></marker></defs><rect width="280" height="330" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" font-size="16" text-anchor="middle"><text x="140" y="25" font-weight="700">Ultrasound and echoes</text><rect x="75" y="48" width="130" height="39" rx="8" fill="#d9e8f0" stroke="#537a94" stroke-width="2"/><text x="140" y="73">Probe</text><path d="M95 99v85 M185 185v-85" fill="none" stroke="#32776d" stroke-width="3" marker-end="url(#a)"/><text x="79" y="129" text-anchor="end" font-size="14">Sound</text><text x="79" y="149" text-anchor="end" font-size="14">pulses</text><text x="200" y="129" text-anchor="start" font-size="14">Echoes</text><text x="200" y="149" text-anchor="start" font-size="14">return</text><path d="M25 197q115 -24 230 0" stroke="#b36e7e" stroke-width="5" fill="none"/><text x="140" y="225">Tissue boundary</text><text x="140" y="261">Scanner uses echoes</text><text x="140" y="284">to form an image</text><text x="140" y="314" font-size="14">Simplified; not to scale</text></g></svg>
