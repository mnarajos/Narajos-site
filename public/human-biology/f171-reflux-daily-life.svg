<path d="M65 48v40q0 12 15 14q24 3 24 23q0 18-26 20q-31 0-34-22q-1-10 5-16q5-5 5-19V48" fill="#f2d9c8" stroke="#a16b4d" stroke-width="2"/><path d="M60 125V70m-6 7 6-7 6 7" fill="none" stroke="#a76125" stroke-width="3"/>
<text x="178" y="75">Reflux can</text><text x="178" y="96">irritate the</text><text x="178" y="117">oesophagus</text>
