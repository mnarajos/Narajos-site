<title id="t">Reflux can interrupt daily activities</title><desc id="d">A schematic shows stomach contents moving upwards into the oesophagus. Two possible consequences are a meal being interrupted and sleep being interrupted. Not everyone with reflux experiences these effects.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285f68"/></marker></defs>
