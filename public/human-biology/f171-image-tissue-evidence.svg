<svg xmlns="http://www.w3.org/2000/svg" width="280" height="335" viewBox="0 0 280 335" role="img" aria-labelledby="t d">
<title id="t">Imaging and tissue examination answer different questions</title><desc id="d">A schematic scan can locate an area of altered tissue. A tissue sample from that area can be examined with a microscope to investigate changes in the tissue itself. The icons are not patient images, and a scan does not by itself establish the cause.</desc>
<rect width="280" height="335" rx="12" fill="#f5faf9"/><g font-family="system-ui,sans-serif" fill="#243e49" text-anchor="middle" font-size="16">
<text x="140" y="25" font-weight="700">Different evidence</text><rect x="24" y="49" width="92" height="82" rx="6" fill="#e3edf5" stroke="#537a94" stroke-width="2"/><circle cx="70" cy="89" r="24" fill="#f4f8f7" stroke="#537a94" stroke-width="2"/><path d="M65 80q13-8 17 3t-8 14q-12-3-9-17" fill="#d6b6c2" stroke="#a55c70" stroke-width="2"/>
<text x="190" y="74">Imaging can locate</text><text x="190" y="97">an altered area</text><path d="M140 143v24m-6-6 6 6 6-6" stroke="#276972" stroke-width="2" fill="none"/>
<circle cx="70" cy="223" r="42" fill="#fff" stroke="#80588f" stroke-width="2"/><g fill="#e7d9ee" stroke="#80588f"><circle cx="57" cy="211" r="9"/><circle cx="77" cy="218" r="10"/><circle cx="64" cy="237" r="9"/><circle cx="87" cy="239" r="8"/></g>
<text x="192" y="209">Microscopy of</text><text x="192" y="232">a tissue sample</text><text x="192" y="255">examines tissue</text>
<text x="140" y="298" font-size="14">A sample represents its own site.</text><text x="140" y="321" font-size="14">Icons are not patient images.</text></g></svg>
