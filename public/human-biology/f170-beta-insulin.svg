<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 330" role="img" aria-labelledby="title desc">
<title id="title">Beta cells respond to blood glucose</title><desc id="desc">An increase in blood glucose stimulates pancreatic beta cells to release more insulin into the blood. The insulin is a chemical signal that travels to target cells, not glucose itself.</desc>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#23656c"/></marker></defs><rect width="280" height="330" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">Blood glucose rises</text><path d="M140 34v25" stroke="#23656c" stroke-width="2" marker-end="url(#a)"/>
<path d="M39 96q31-37 111-29 58 5 91 30-14 24-59 29-93 8-143-30z" fill="#f9dfc8" stroke="#98451e" stroke-width="2.5"/>
<circle cx="140" cy="96" r="15" fill="#e5d9ec" stroke="#69447f" stroke-width="2"/><path d="M140 80v-12" stroke="#69447f" stroke-width="2"/>
<text x="140" y="155">Pancreas: beta cells</text><path d="M140 163v26" stroke="#23656c" stroke-width="2" marker-end="url(#a)"/>
<path d="M33 208h214v39H33z" fill="#e5d9ec" stroke="#69447f" stroke-width="2"/><circle cx="82" cy="227" r="5" fill="#69447f"/><circle cx="140" cy="227" r="5" fill="#69447f"/><circle cx="198" cy="227" r="5" fill="#69447f"/>
<text x="140" y="273">More insulin enters blood</text><text x="140" y="303">and signals target cells.</text>
</g></svg>
