<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 365" role="img" aria-labelledby="title desc">
<title id="title">Sperm cell structure</title><desc id="desc">A sperm cell has a head containing a haploid nucleus and an acrosome at its tip, a mitochondria-rich midpiece and a flagellum. The flagellum propels the cell, using ATP supplied in part by mitochondria.</desc>
<rect width="280" height="365" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" fill="#263e4a">
<text x="140" y="25" text-anchor="middle" font-weight="700">Sperm cell</text>
<ellipse cx="95" cy="92" rx="28" ry="42" fill="#f9dfc8" stroke="#98451e" stroke-width="2.5"/><path d="M69 77q26-31 52 0" fill="#e5d9ec" stroke="#69447f" stroke-width="3"/><ellipse cx="95" cy="99" rx="18" ry="25" fill="#e5d9ec" stroke="#69447f" stroke-width="2"/>
<path d="M84 134v49q11 10 22 0v-49" fill="#d8ece7" stroke="#23656c" stroke-width="2"/><path d="M86 143l18 8m-18 4 18 8m-18 4 18 8" stroke="#23656c" stroke-width="2"/>
<path d="M95 188q-30 22 0 43t0 43q-30 22 0 43" fill="none" stroke="#98451e" stroke-width="3"/>
<path d="M116 70h32M113 101h35M106 157h42M100 265h48" stroke="#263e4a" stroke-width="1.5"/>
<text x="154" y="75">Acrosome</text><text x="154" y="106">Nucleus</text><text x="154" y="151">Midpiece:</text><text x="154" y="172">mitochondria</text><text x="154" y="270">Flagellum</text>
<text x="140" y="349" text-anchor="middle">Drawing is not to scale.</text>
</g></svg>
