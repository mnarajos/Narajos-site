<svg xmlns="http://www.w3.org/2000/svg" width="280" height="380" viewBox="0 0 280 380" role="img" aria-labelledby="t d"><title id="t">Different origins of immunodeficiency</title><desc id="d">A primary immunodeficiency may arise from an inherited or developmental difference. It can be recognised at different ages. An acquired immunodeficiency develops later, for example following certain infections or treatments. The time line is conceptual and does not imply that all cases have one cause or age of recognition.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#32776d"/></marker></defs><rect width="280" height="380" rx="12" fill="#f4f8f7"/><g font-family="system-ui,sans-serif" fill="#233e4c" font-size="15" text-anchor="middle"><text x="140" y="25" font-size="16" font-weight="700">Origins of immunodeficiency</text><text x="140" y="57">Primary immunodeficiency</text><path d="M45 76c28 0 28 38 56 38M45 114c28 0 28-38 56-38M53 83l14 22m0-22-14 22m23-22 14 22m0-22-14 22" fill="none" stroke="#80588f" stroke-width="2"/><text x="180" y="91" font-size="14">Inherited or</text><text x="180" y="111" font-size="14">developmental origin</text><text x="140" y="146" font-size="14">May be recognised at different ages</text><path d="M20 165h240" stroke="#bfd4cf"/><text x="140" y="194">Acquired immunodeficiency</text><path d="M35 239h206" stroke="#32776d" stroke-width="2" marker-end="url(#a)"/><path d="M64 228v22M180 228v22" stroke="#32776d" stroke-width="2"/><text x="64" y="274">Birth</text><text x="180" y="267" font-size="14">Later infection</text><text x="180" y="286" font-size="14">or treatment</text><text x="140" y="332" font-size="14">Examples of origins, not diagnosis.</text><text x="140" y="355" font-size="14">Age of onset can vary.</text></g></svg>
