<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 330" role="img" aria-labelledby="title desc">
<title id="title">Binary fission in a bacterium</title><desc id="desc">A schematic bacterium copies its chromosome, elongates and forms a dividing partition, producing two daughter cells. The stages are simplified and not to scale.</desc>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0v7l6-3.5z" fill="#23656c"/></marker></defs><rect width="280" height="330" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">Binary fission</text><rect x="89" y="42" width="102" height="35" rx="17" fill="#f9dfc8" stroke="#98451e" stroke-width="2"/><circle cx="140" cy="60" r="7" fill="none" stroke="#69447f" stroke-width="2"/>
<text x="140" y="101">Chromosome copied</text><path d="M140 109v19" stroke="#23656c" stroke-width="2" marker-end="url(#a)"/>
<rect x="62" y="143" width="156" height="37" rx="18" fill="#f9dfc8" stroke="#98451e" stroke-width="2"/><circle cx="103" cy="161" r="7" fill="none" stroke="#69447f" stroke-width="2"/><circle cx="177" cy="161" r="7" fill="none" stroke="#69447f" stroke-width="2"/><path d="M140 143v37" stroke="#98451e" stroke-width="2"/>
<text x="140" y="207">Partition forms</text><path d="M140 215v19" stroke="#23656c" stroke-width="2" marker-end="url(#a)"/>
<rect x="29" y="249" width="98" height="35" rx="17" fill="#f9dfc8" stroke="#98451e" stroke-width="2"/><rect x="153" y="249" width="98" height="35" rx="17" fill="#f9dfc8" stroke="#98451e" stroke-width="2"/><circle cx="78" cy="267" r="7" fill="none" stroke="#69447f" stroke-width="2"/><circle cx="202" cy="267" r="7" fill="none" stroke="#69447f" stroke-width="2"/>
<text x="140" y="316">Two daughter cells</text>
</g></svg>
