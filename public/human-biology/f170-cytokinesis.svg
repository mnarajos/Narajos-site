<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 355" role="img" aria-labelledby="title desc">
<title id="title">Cytokinesis in animal and plant cells</title><desc id="desc">An animal cell develops a cleavage furrow as its surface pinches in between the two nuclei. A plant cell develops a cell plate between its two nuclei. Cytokinesis separates the cytoplasm and can overlap with nuclear division.</desc>
<rect width="280" height="355" rx="12" fill="#f5faf9"/>
<g font-family="system-ui,sans-serif" font-size="16.5" text-anchor="middle" fill="#263e4a">
<text x="140" y="25" font-weight="700">Animal cell</text>
<path d="M35 89C35 41 106 43 140 74C174 43 245 41 245 89S174 137 140 104C106 137 35 137 35 89z" fill="#d8ece7" stroke="#23656c" stroke-width="3"/><circle cx="83" cy="89" r="19" fill="#e5d9ec" stroke="#69447f" stroke-width="2"/><circle cx="197" cy="89" r="19" fill="#e5d9ec" stroke="#69447f" stroke-width="2"/>
<path d="M140 74V55" stroke="#98451e" stroke-width="2"/><text x="140" y="151">Cleavage furrow</text>
<text x="140" y="194" font-weight="700">Plant cell</text><rect x="36" y="208" width="208" height="94" fill="#d8ece7" stroke="#23656c" stroke-width="5"/><circle cx="85" cy="255" r="19" fill="#e5d9ec" stroke="#69447f" stroke-width="2"/><circle cx="195" cy="255" r="19" fill="#e5d9ec" stroke="#69447f" stroke-width="2"/>
<path d="M140 209v92" stroke="#98451e" stroke-width="5"/><text x="140" y="332">Cell plate</text>
</g></svg>
