<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" role="img" aria-labelledby="t d">
<title id="t">A possible difficulty starting movement</title><desc id="d">An illustrative sequence shows a person pausing before the first step, then moving a foot forward. In Parkinson's, some people have difficulty initiating movement. A pause is one possible experience and does not establish a diagnosis or a fixed delay.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#285f68"/></marker></defs>
<rect width="280" height="320" rx="12" fill="#f4f9f8"/><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#243e49" font-size="16"><text x="140" y="24" font-weight="700">Starting a movement</text>
<text x="72" y="55">Before first step</text><text x="210" y="55">A step begins</text>
<circle cx="71" cy="92" r="12" fill="#f2d7c8" stroke="#a57049"/><path d="M71 104v53m0-40-20 19m20-19 20 19m-20 21-16 30m16-30 15 30" fill="none" stroke="#537a94" stroke-width="4"/>
<circle cx="210" cy="92" r="12" fill="#f2d7c8" stroke="#a57049"/><path d="M210 104v53m0-40-20 19m20-19 20 19m-20 21-21 30m21-30 25 22" fill="none" stroke="#537a94" stroke-width="4"/>
<circle cx="72" cy="218" r="18" fill="#fff" stroke="#80588f" stroke-width="2"/><path d="M72 207v12l8 5" fill="none" stroke="#80588f" stroke-width="2"/><path d="M168 195h52" fill="none" stroke="#285f68" stroke-width="2" marker-end="url(#a)"/>
<text x="72" y="253" font-size="14">Possible pause</text><text x="210" y="253" font-size="14">Foot moves forward</text>
<text x="140" y="288" font-size="14">Starting can be difficult for some people.</text><text x="140" y="308" font-size="14">The sequence is illustrative.</text></g></svg>
