name: Import Narajos website

on:
  push:
    branches: [main]
    paths:
      - 'Narajos_Keystone_Updated_Homepage_READY_TO_DEPLOY*.zip'
      - '.github/workflows/import-site.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Unpack website into public folder
        shell: bash
        run: |
          shopt -s nullglob
          files=(Narajos_Keystone_Updated_Homepage_READY_TO_DEPLOY*.zip)
          if (( ${#files[@]} == 0 )); then
            echo "No website ZIP found"
            exit 1
          fi
          mkdir -p public
          unzip -o "${files[0]}" -d public/
          for file in index.html teaching/index.html gcse/index.html alevel/index.html teacher/index.html assets/site.css; do
            if [[ ! -f "public/$file" ]]; then
              echo "Missing site file: $file"
              exit 1
            fi
          done
      - name: Commit website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          if ! git diff --cached --quiet; then
            git commit -m "Import Narajos website files"
            git push
          fi
