name: Browser smoke tests

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/check-browser.mjs'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test actual browser interactions and mobile layout
        run: node scripts/check-browser.mjs
      - name: Retain viewport screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-screenshots
          path: /tmp/narajos-*.png
          if-no-files-found: ignore
          retention-days: 7
