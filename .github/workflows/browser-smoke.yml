name: Browser smoke tests

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/**'
      - '.github/workflows/browser-smoke.yml'
  pull_request:
    paths:
      - 'public/**'
      - 'scripts/**'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test actual browser interactions and mobile layout
        run: node scripts/check-browser.mjs
      - name: Retain viewport screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-screenshots
          path: /tmp/narajos-*.png
          if-no-files-found: ignore
          retention-days: 7


  additional-browser-smoke:
    name: ${{ matrix.engine }} smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and test runner
        run: |
          npm install --no-save playwright@1.56.1 axe-core@4.10.3
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Test A-level independent paper practice
        run: node scripts/check-alevel-paper-practice.mjs ${{ matrix.engine }}
      - name: Test A-level question interpretation
        run: node scripts/check-alevel-question-interpretation.mjs ${{ matrix.engine }}
      - name: Check representative Narajos flows
        run: node scripts/check-browser-engines.mjs ${{ matrix.engine }}

  visual-audit:
    name: Readability and accessibility checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and audit runner
        run: |
          npm install --no-save playwright@1.56.1 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Test A-level independent paper practice
        run: node scripts/check-alevel-paper-practice.mjs chromium
      - name: Audit representative pages and touch journeys
        run: node scripts/check-visual.mjs

  performance-sample:
    name: Synthetic performance sample
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: perf-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Sample the same routes before and after the change
        run: node scripts/measure-site.mjs perf-baseline/public
